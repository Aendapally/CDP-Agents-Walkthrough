<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDP-Agents Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#18211E; --muted:#5D6964; --line:#CAD2CE;
  --node:#FFFFFF; --node-stroke:#8E9A95; --edge:#8A9690;
  --z-agent:#FBF3DC; --z-agent-s:#DDC888;
  --z-art:#E2F1E5; --z-art-s:#94C5A0;
  --z-gov:#ECE9F6; --z-gov-s:#B5ACD8;
  --z-ext:#E8EEF3; --z-ext-s:#AFBECC;
  --accent:#2541D8; --accent-soft:#DCE2FB; --on-accent:#FFFFFF;
  --ok:#2F8F5B; --wip:#B7791F; --plan:#7A6FA8; --bad:#B4382F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513; --surface:#171E1B; --ink:#E6ECE9; --muted:#97A39E; --line:#2D3834;
    --node:#1C2421; --node-stroke:#55625D; --edge:#66736E;
    --z-agent:#262315; --z-agent-s:#5A5030;
    --z-art:#16271B; --z-art-s:#2F5939;
    --z-gov:#201E31; --z-gov-s:#4A4370;
    --z-ext:#18212A; --z-ext-s:#394959;
    --accent:#8095FF; --accent-soft:#242C55; --on-accent:#0E1330;
    --ok:#5BC48A; --wip:#E0A84A; --plan:#A79CDB; --bad:#EE8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513; --surface:#171E1B; --ink:#E6ECE9; --muted:#97A39E; --line:#2D3834;
  --node:#1C2421; --node-stroke:#55625D; --edge:#66736E;
  --z-agent:#262315; --z-agent-s:#5A5030;
  --z-art:#16271B; --z-art-s:#2F5939;
  --z-gov:#201E31; --z-gov-s:#4A4370;
  --z-ext:#18212A; --z-ext-s:#394959;
  --accent:#8095FF; --accent-soft:#242C55; --on-accent:#0E1330;
  --ok:#5BC48A; --wip:#E0A84A; --plan:#A79CDB; --bad:#EE8A80;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;box-sizing:border-box}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--node-stroke)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;min-height:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;position:relative;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 8px;border-radius:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 9px;font-weight:500;letter-spacing:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance}
.panel p{margin:0;max-width:62ch}
.meta{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.meta h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
button.chip:hover{border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status i{width:9px;height:9px;border-radius:50%}
.note{font-size:13px;color:var(--muted)}
.hint{margin-top:auto;font-size:12px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}
footer{display:flex;align-items:center;gap:10px;padding-block:12px 14px}
.rail{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin;padding-block:2px}
.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.rail button.done{color:var(--ink)}
.rail button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 14px}

/* diagram */
.zone rect,.zone path{stroke-width:1.2}
.zone[data-tone="agent"] .shape{fill:var(--z-agent);stroke:var(--z-agent-s)}
.zone[data-tone="art"] .shape{fill:var(--z-art);stroke:var(--z-art-s)}
.zone[data-tone="gov"] .shape{fill:var(--z-gov);stroke:var(--z-gov-s)}
.zone[data-tone="ext"] .shape{fill:var(--z-ext);stroke:var(--z-ext-s)}
.zone[data-tone="inner"] .shape{fill:var(--node);stroke:var(--z-agent-s);stroke-dasharray:4 3;fill-opacity:.55}
.zlabel{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.zsub{font:italic 400 11.5px var(--sans);fill:var(--muted)}
.node .shape{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.2;transition:stroke .3s,fill .3s}
.node[data-kind="artifact"] .shape{stroke:var(--z-art-s)}
.node[data-kind="agent"] .shape{stroke-width:1.8;stroke:var(--ink)}
.node[data-kind="ext"] .shape{stroke-dasharray:3 3}
.ntitle{font:600 12.5px var(--sans);fill:var(--ink)}
.nsub{font:400 11px var(--sans);fill:var(--muted)}
.node,.zone,.edge,.badge{transition:opacity .35s}
.node:not(.zone){cursor:pointer}
.node:not(.zone):hover .shape{stroke:var(--accent)}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.3}
.edge.dotted path{stroke-dasharray:2 4}
.badge rect{fill:var(--surface);stroke:var(--edge);stroke-width:1}
.badge text{font:500 10px var(--mono);fill:var(--muted)}
.focus .zone:not(.on){opacity:.45}
.focus .node:not(.zone):not(.on){opacity:.2}
.focus .edge:not(.on),.focus .badge:not(.on){opacity:.1}
.node.on:not(.zone) .shape{stroke:var(--accent);stroke-width:2.2;fill:var(--accent-soft)}
.zone.on .zlabel{fill:var(--ink)}
.edge.on path{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 5;animation:flow 1s linear infinite}
.badge.on rect{fill:var(--accent);stroke:var(--accent)}
.badge.on text{fill:var(--on-accent)}
@keyframes flow{to{stroke-dashoffset:-12}}
.sdot{display:none;stroke:var(--surface);stroke-width:2}
.show-status .sdot{display:block}
.s-ok{fill:var(--ok);background:var(--ok)} .s-wip{fill:var(--wip);background:var(--wip)} .s-plan{fill:var(--plan);background:var(--plan)}
.mk{fill:var(--edge)} .mk-on{fill:var(--accent)}
.node[data-kind="artifact"] .peek{font:500 9.5px var(--mono);fill:var(--accent);letter-spacing:.04em}

/* sample artifact viewer */
.open-sample{align-self:flex-start;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
button.chip.art{border-color:var(--z-art-s);background:var(--z-art)}
dialog.viewer{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(1100px,calc(100vw - 32px));height:min(860px,calc(100vh - 32px));max-width:none;max-height:none}
dialog.viewer[open]{display:flex;flex-direction:column}
dialog.viewer::backdrop{background:rgba(10,14,12,.55)}
.v-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.v-head h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.2}
.v-head .v-title{margin-right:auto;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 360px}
.v-path{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.v-path a{color:var(--accent)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;align-self:flex-start}
.tag.real{background:var(--z-art);color:var(--ok);border:1px solid var(--z-art-s)}
.tag.illus{background:var(--z-agent);color:var(--wip);border:1px solid var(--z-agent-s)}
.tag.ref{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent)}
.v-sets{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:center}
.v-sets button{border:0;background:var(--surface);padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.v-sets button+button{border-left:1px solid var(--line)}
.v-sets button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.v-tabs{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.v-tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;border-radius:8px 8px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.v-tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.v-note{font-size:13px;color:var(--muted);padding:10px 18px 0;margin:0}
.v-body{flex:1;min-height:0;overflow:auto;padding:12px 18px 18px}
.code{font:12.5px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0;white-space:pre;tab-size:2;min-width:max-content}
.code .k{color:var(--accent)} .code .s{color:var(--ok)} .code .n{color:var(--wip)} .code .c{color:var(--muted);font-style:italic}
.doc{display:flex;flex-direction:column;gap:12px}
.doc>:not(.tablewrap){max-width:78ch}
.doc h2,.doc h3{font-family:var(--display);font-size:17px;margin:10px 0 0}
.doc a{color:var(--accent)}
.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc p,.doc li{margin:0}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc table{border-collapse:collapse;font-size:13px;width:100%}
.doc th,.doc td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 10px 8px 0}
.doc th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.doc code{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.tablewrap{overflow-x:auto}
.imgwrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;cursor:zoom-in}
.imgwrap img{display:block;width:100%;max-width:100%}
.imgwrap.zoomed{cursor:zoom-out}
.imgwrap.zoomed img{width:auto;max-width:none}
/* company policy list */
a.pol{font:12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px;text-decoration:none;overflow-wrap:break-word}
a.pol:hover{text-decoration:underline}
.p-tools{display:flex;gap:12px;align-items:center;padding:10px 18px 0;flex-wrap:wrap}
.p-tools input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.p-row{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr);gap:4px 16px;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.p-row.flash{animation:pflash 1.8s ease}
@keyframes pflash{0%,45%{background:var(--accent-soft)}100%{background:transparent}}
.p-id{font:12.5px var(--mono);overflow-wrap:anywhere}
.p-text{font-size:13.5px;min-width:0}
.p-text q{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;font-style:italic}
.p-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.mod{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.mod.must,.mod.required{color:var(--ok)} .mod.must-not,.mod.prohibited{color:var(--bad)} .mod.may-only{color:var(--wip)}
.p-empty{color:var(--muted);padding:16px 0}
@media (max-width:700px){.p-row{grid-template-columns:1fr}.p-meta{grid-column:1}}
@media (prefers-reduced-motion: reduce){.p-row.flash{animation:none}}
@media (prefers-reduced-motion: reduce){.edge.on path{animation:none}.node,.zone,.edge,.badge{transition:none}}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .stage{height:58vh;min-height:320px}
  .panel{overflow:visible}
  .hint{display:none}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>CDP-Agents Walkthrough</h1>
      <span>Application code → policy-compliant, provisioned cloud architecture</span>
    </div>
    <div class="tools">
      <button class="btn" id="samplesBtn" title="Open the sample artifacts">Sample artifacts</button>
      <button class="btn" id="follow" aria-pressed="true" title="Zoom the diagram to each step">Zoom to step</button>
      <button class="btn" id="play" aria-pressed="false">▶ Auto-play</button>
      <button class="btn" id="fsBtn" title="Full screen (F)" hidden>Full screen</button>
      <button class="btn" id="policyBtn" title="Open the policy list">Policy</button>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <svg id="dia" viewBox="0 0 1400 1110" preserveAspectRatio="xMidYMid meet" role="img" aria-label="CDP-Agents end-to-end architecture flow">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-on" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <g id="layer-zones"></g><g id="layer-edges"></g><g id="layer-nodes"></g><g id="layer-badges"></g>
      </svg>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
  <footer>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous step">←</button>
      <button class="btn primary" id="next" aria-label="Next step">Next →</button>
    </div>
    <nav class="rail" id="rail" aria-label="Steps"></nav>
  </footer>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="vTitle">
  <div class="v-head">
    <div class="v-title">
      <span class="tag ref">Reference sample</span>
      <h2 id="vTitle"></h2>
      <span class="v-path" id="vPath"></span>
    </div>
    <div class="v-sets" role="group" aria-label="Sample system" id="vSets"></div>
    <button class="btn" id="vClose" aria-label="Close sample viewer">Close ✕</button>
  </div>
  <div class="v-tabs" role="tablist" id="vTabs"></div>
  <p class="v-note" id="vNote"></p>
  <div class="v-body" id="vBody"></div>
</dialog>

<dialog class="viewer policy" id="policyViewer" aria-labelledby="pTitle">
  <div class="v-head">
    <div class="v-title">
      <span class="tag ref">Company policy</span>
      <h2 id="pTitle">Policies and standards</h2>
      <span class="v-path" id="pMeta"></span>
    </div>
    <button class="btn" id="pClose" aria-label="Close policy list">Close ✕</button>
  </div>
  <div class="v-tabs" role="tablist" id="pTabs"></div>
  <div class="p-tools"><input id="pSearch" type="search" placeholder="Filter by ID or text" aria-label="Filter policies"></div>
  <p class="v-note" id="pNote"></p>
  <div class="v-body"><div class="p-list" id="pList"></div></div>
</dialog>

<script type="application/json" id="policy-data">{"company": [{"id": "ASSUMP-01", "statement": "When a paved path exists and a customer is not compliant, the customer must remediate within an appropriate and agreed-upon timeline.", "modality": "must", "knob": "none", "kind": "policy", "page": 2, "quote": "This is a violation of POLY<GO>.The customer must remediate within an appropriate and agreed-upon timeline."}, {"id": "BB_AWS0100", "statement": "Password reuse prevention is suppressed (BB_AWS0100); no corresponding POLY<GO> requirement exists.", "modality": "may-only", "knob": "iam", "kind": "enforced-control", "page": 9, "quote": "IAM Password Complexity Rules (Suppressed)\nBB_AWS0100 (Suppressed): Password reuse prevention"}, {"id": "BB_AWS0101", "statement": "Password expiry within 90 days is suppressed (BB_AWS0101).", "modality": "may-only", "knob": "iam", "kind": "enforced-control", "page": 9, "quote": "IAM Password Complexity Rules (Suppressed)\nBB_AWS0101 (Suppressed): Password expiry within 90 days"}, {"id": "BB_AWS0120", "statement": "Inbound VNC (ports 5800/5900/5500) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0120, BB_AWS0122: Block VNC (ports 5800/5900/5500)"}, {"id": "BB_AWS0123", "statement": "Inbound Telnet (port 23) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0123: Block Telnet (port 23)"}, {"id": "BB_AWS0125", "statement": "ELB cross-zone load balancing must be enabled.", "modality": "must", "knob": "network", "kind": "enforced-control", "page": 10, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nService-Specific Security Hardening\nBB_AWS0125: ELB cross-zone load balancing enabled"}, {"id": "BB_AWS0128", "statement": "SQS policies must not have global wildcard ('.') access.", "modality": "must-not", "knob": "resource-policy", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nSpecific S3 Bucket Policy Restrictions\nBB_AWS0128: SQS policies should not have global \".\" access"}, {"id": "BB_AWS0136", "statement": "CloudFront WAF protection is suppressed (BB_AWS0136); POLY<GO> does not mandate WAF usage.", "modality": "may-only", "knob": "network", "kind": "enforced-control", "page": 10, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nService-Specific Security Hardening\nBB_AWS0136 (Suppressed): CloudFront WAF protection"}, {"id": "BB_AWS0137", "statement": "Inbound SSH (port 22) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0137: Block SSH (port 22)"}, {"id": "BB_AWS0139", "statement": "Inbound RDP (port 3389) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0139: Block RDP (port 3389)"}, {"id": "BB_AWS01471", "statement": "S3 lifecycle policies must be enabled.", "modality": "must", "knob": "data-protection", "kind": "enforced-control", "page": 10, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nService-Specific Security Hardening\nBB_AWS01471: S3 lifecycle policies enabled"}, {"id": "BB_AWS0148", "statement": "ELB must not use TCP all (unrestricted TCP listener).", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0148: ELB not using TCP all"}, {"id": "BB_AWS0155", "statement": "S3 bucket policies must block ALL actions for all principals.", "modality": "must-not", "knob": "resource-policy", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nSpecific S3 Bucket Policy Restrictions\nBB_AWS0155: Block ALL actions for all principals (more restrictive)"}, {"id": "BB_AWS0156", "statement": "S3 bucket policies must block LIST actions for all principals.", "modality": "must-not", "knob": "resource-policy", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nSpecific S3 Bucket Policy Restrictions\nBB_AWS0156: Block LIST actions for all principals (specific action type)"}, {"id": "BB_AWS0157", "statement": "Inbound Elasticsearch (ports 9200/9300) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0157: Block Elasticsearch (ports 9200/9300)"}, {"id": "BB_AWS0159", "statement": "Inbound etcd (port 2379) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0159: Block etcd (port 2379)"}, {"id": "BB_AWS0160", "statement": "Inbound MongoDB (ports 27017/27018) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0160: Block MongoDB (ports 27017/27018)"}, {"id": "BB_AWS0167", "statement": "Inbound LDAP (port 389) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0167: Block LDAP (port 389)"}, {"id": "BB_AWS0173", "statement": "Inbound NetBIOS (ports 137-139) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0173: Block NetBIOS (ports 137-139)"}, {"id": "BB_AWS0176", "statement": "Inbound MSSQL (ports 1433/1434/135) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0176, BB_AWS0177, BB_AWS0172: Block MSSQL (ports 1433/1434/135)"}, {"id": "BB_AWS0183", "statement": "Inbound SQL Server Analysis (port 2383) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0183: Block SQL Server Analysis (port 2383)"}, {"id": "BB_AWS0184", "statement": "Inbound Oracle DB SSL (port 2484) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0184: Block Oracle DB SSL (port 2484)"}, {"id": "BB_AWS0187", "statement": "Inbound MySQL (port 3306) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0187: Block MySQL (port 3306)"}, {"id": "BB_AWS0190", "statement": "Inbound PostgreSQL (port 5432) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0190: Block PostgreSQL (port 5432)"}, {"id": "BB_AWS0193", "statement": "Inbound Cassandra (port 7001) must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 8, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0193: Block Cassandra (port 7001)"}, {"id": "BB_AWS0204", "statement": "RDS deletion protection must be enabled.", "modality": "must", "knob": "data-protection", "kind": "enforced-control", "page": 10, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nService-Specific Security Hardening\nBB_AWS0204: RDS deletion protection enabled"}, {"id": "BB_AWS0205", "statement": "All ports/protocols from any source must be blocked.", "modality": "must-not", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0205, BB_AWS02051: Block all ports/protocols from any source"}, {"id": "BB_AWS0206", "statement": "Only ports 80/443 may be allowed from the internet.", "modality": "may-only", "knob": "network", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nGranular Port-Level Network Security\nBB_AWS0206: Only allow ports 80/443 from internet"}, {"id": "BB_AWS0211", "statement": "S3 bucket policies must block DELETE actions from all principals.", "modality": "must-not", "knob": "resource-policy", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nSpecific S3 Bucket Policy Restrictions\nBB_AWS0211: Block DELETE actions from all principals (specific action type)"}, {"id": "BB_AWS0213", "statement": "S3 bucket policies must block GET actions from all principals.", "modality": "must-not", "knob": "resource-policy", "kind": "enforced-control", "page": 9, "quote": "Enforced in sK8s but Not Explicitly Required by POLY<GO>\nSpecific S3 Bucket Policy Restrictions\nBB_AWS0213: Block GET actions from all principals (specific action type)"}, {"id": "COMP-01", "statement": "CSP compute resources must only be deployed using PCE-hardened (golden) images.", "modality": "may-only", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "CSP compute resources must only be deployed using PCE-hardened (golden) images."}, {"id": "COMP-02", "statement": "Workloads must leverage PCE-approved deployment pipelines and automation.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "Workloads must leverage PCE-approved deployment pipelines and automation."}, {"id": "COMP-03", "statement": "Workloads must leverage CTO-approved public cloud patterns where suitable patterns exist.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "Workloads must leverage CTO-approved public cloud patterns where suitable patterns exist."}, {"id": "COMP-04", "statement": "Development activity must occur exclusively in PCE-managed development environments.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "Development activity must occur exclusively in PCE-managed development environments."}, {"id": "COMP-05", "statement": "Production workloads must operate exclusively in PCE-managed production environments.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "Production workloads must operate exclusively in PCE-managed production environments."}, {"id": "COMP-06", "statement": "Production workloads must comply with CTO-approved disaster recovery patterns, including multi-region where appropriate.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 4, "quote": "Production workloads must comply with CTO-approved disaster recovery patterns, including multi-region where appropriate."}, {"id": "COMP-07", "statement": "CSP environments must be scanned for vulnerabilities and remediated in accordance with the Vulnerability Management Standard.", "modality": "must", "knob": "service-selection", "kind": "policy", "page": 5, "quote": "CSP environments must be scanned for vulnerabilities and remediated in accordance with the Vulnerability Management Standard."}, {"id": "CSPLOG-01", "statement": "CSP environments must integrate with CSP-native logging solutions (e.g., AWS Config, CloudTrail), unless explicitly approved by CTO.", "modality": "must", "knob": "observability", "kind": "policy", "page": 6, "quote": "CSP environments must integrate with CSP-native logging solutions (e.g., AWS Config, CloudTrail), unless explicitly approved by CTO."}, {"id": "CSPLOG-02", "statement": "Approved CSP Services must log activity, including configuration changes.", "modality": "must", "knob": "observability", "kind": "policy", "page": 6, "quote": "Approved CSP Services must log activity, including configuration changes."}, {"id": "CSPLOG-03", "statement": "Logging must comply with the Logging Procedure.", "modality": "must", "knob": "observability", "kind": "policy", "page": 6, "quote": "Logging must comply with the Logging Procedure."}, {"id": "DPE-01", "statement": "Restricted data stored in CSPs must be encrypted at rest using CTO-approved patterns.", "modality": "must", "knob": "data-protection", "kind": "policy", "page": 5, "quote": "Restricted data stored in CSPs must be encrypted at rest using CTO-approved patterns."}, {"id": "DPE-02", "statement": "CTO-approved key management solutions must be used.", "modality": "must", "knob": "data-protection", "kind": "policy", "page": 5, "quote": "CTO-approved key management solutions must be used."}, {"id": "DPE-03", "statement": "All data in transit to, from, and within CSP environments must be encrypted.", "modality": "must", "knob": "data-protection", "kind": "policy", "page": 5, "quote": "All data in transit to, from, and within CSP environments must be encrypted."}, {"id": "DPE-04", "statement": "Production data must not be accessible from non-production CSP environments.", "modality": "must-not", "knob": "data-protection", "kind": "policy", "page": 5, "quote": "Production data must not be accessible from non-production CSP environments."}, {"id": "DPE-05", "statement": "CSP data stores containing Internal, Limited, or Restricted data must not be accessible over the public internet without authentication and authorization.", "modality": "must-not", "knob": "resource-policy", "kind": "policy", "page": 5, "quote": "CSP data stores containing Internal, Limited, or Restricted data must not be accessible over the public internet without authentication and authorization."}, {"id": "DPE-06", "statement": "Only CGC-approved regions may store data.", "modality": "may-only", "knob": "region", "kind": "policy", "page": 5, "quote": "Only CGC-approved regions may store data."}, {"id": "IAM-01", "statement": "CSP console access must leverage Bloomberg Single Sign On (BSSO) and PVF <GO> and/or PVFX <GO>.", "modality": "must", "knob": "iam", "kind": "policy", "page": 3, "quote": "CSP console access must leverage Bloomberg Single Sign On (BSSO) and PVF <GO> and/or PVFX <GO>."}, {"id": "IAM-02", "statement": "Administrative access to CSP environments must be limited to PCE-authorized team members.", "modality": "must", "knob": "iam", "kind": "policy", "page": 3, "quote": "Administrative access to CSP environments must be limited to PCE-authorized team members."}, {"id": "IAM-03", "statement": "MFA is required for administrative access and for direct human access to the CSP control plane and related assets.", "modality": "required", "knob": "iam", "kind": "policy", "page": 3, "quote": "MFA is required for: Administrative access; Direct human access to the CSP control plane and related assets"}, {"id": "IAM-04", "statement": "Static identities are prohibited for interactive use.", "modality": "prohibited", "knob": "iam", "kind": "policy", "page": 3, "quote": "Static identities are prohibited for interactive use."}, {"id": "IAM-05", "statement": "Templated roles are required to restrict access to approved environments and services.", "modality": "required", "knob": "iam", "kind": "policy", "page": 3, "quote": "Templated roles are required to restrict access to approved environments and services."}, {"id": "IAM-06", "statement": "CSP credentials must be rotated at a maximum cadence of 90 days.", "modality": "must", "knob": "iam", "kind": "policy", "page": 3, "quote": "CSP credentials must be rotated at a maximum cadence of 90 days."}, {"id": "IAM-07", "statement": "CSP Services must integrate with CSP-native IAM and key management solutions.", "modality": "must", "knob": "iam", "kind": "policy", "page": 3, "quote": "CSP Services must integrate with CSP-native IAM and key management solutions."}, {"id": "IAM-08", "statement": "Programmatic access keys must be encrypted at rest and rotated at a maximum cadence of 90 days.", "modality": "must", "knob": "iam", "kind": "policy", "page": 3, "quote": "Programmatic access keys must be encrypted at rest and rotated at a maximum cadence of 90 days."}, {"id": "INIT-VM-01", "statement": "Virtual machine images must be rotated every 90 days (enforced by INIT; not explicitly required by POLY<GO>).", "modality": "must", "knob": "service-selection", "kind": "enforced-control", "page": 8, "quote": "Enforced in INIT but Not Explicitly Required by POLY<GO>\nVirtual Machine Lifecycle\nPOLY<GO> does not include a requirement to rotate images every 90 days."}, {"id": "LOGP-01", "statement": "Logs must be forwarded to Bloomberg's centralized log management solution.", "modality": "must", "knob": "observability", "kind": "policy", "page": 6, "quote": "Logs must be forwarded to Bloomberg's centralized log management solution."}, {"id": "LOGP-02", "statement": "Only the logging subsystem may write or modify log files.", "modality": "may-only", "knob": "observability", "kind": "policy", "page": 6, "quote": "Only the logging subsystem may write or modify log files."}, {"id": "LOGP-03", "statement": "Only authorized administrators may access logs for troubleshooting.", "modality": "may-only", "knob": "observability", "kind": "policy", "page": 6, "quote": "Only authorized administrators may access logs for troubleshooting."}, {"id": "LOGP-04", "statement": "All other users must not have direct access to log files.", "modality": "must-not", "knob": "observability", "kind": "policy", "page": 6, "quote": "All other users must not have direct access to log files."}, {"id": "LOGP-05", "statement": "Log data at rest must be protected from alteration.", "modality": "must", "knob": "data-protection", "kind": "policy", "page": 6, "quote": "Log data at rest must be protected from alteration."}, {"id": "LOGP-06", "statement": "Systems and applications must log security-related events including successful and unsuccessful user registration, authentication, authorization, resource access, and privileged operations; network connection initiation, acceptance, or denial; creation, modification, and deletion of user accounts, group accounts, and objects; changes to security policy, access control configurations, and audit policy configurations; changes in system state; application/process failures and abnormal terminations; all actions taken by root or administrative users; all administrative access and activity; access attempts made to logs; initialization or clearing of audit logs; password change events; login and logout events; application errors (e.g., HTTP 403, 500); modification of security configuration; and starting and stopping of critical system services including the logging subsystem.", "modality": "must", "knob": "observability", "kind": "policy", "page": 6, "quote": "Systems and applications must log security-related events including, but not limited to: Successful and unsuccessful: User registration events, Authentication events, Authorization events, Resource access events, Privileged operations; Network connection initiation, acceptance, or denial; Creation, modification, deletion of: User accounts, Group accounts, Objects (files, directories, accounts); Changes to: Security policy, Access control configurations, Audit policy configurations; Changes in system state (startup, shutdown, restart); Application/process failures and abnormal terminations; All actions taken by root or administrative users; All administrative access and activity; Access attempts made to logs; Initialization or clearing of audit logs; Password change events; Login and logout events; Application errors (e.g., HTTP 403, 500); Modification of security configuration; Starting and stopping of critical system services, including the logging subsystem"}, {"id": "LOGP-07", "statement": "Logs must include sufficient information to accurately describe the event, including where available: date and time (including time zone if not UTC), type of action performed, identifiers of the subject, identifiers of the object acted upon, whether the action was allowed or denied, subsystem performing the action, reason codes for denied actions, before/after values when updating data (unless sensitive), and category or severity label.", "modality": "must", "knob": "observability", "kind": "policy", "page": 7, "quote": "Logs must include sufficient information to accurately describe the event, including where available: Date and time (including time zone if not UTC); Type of action performed; Identifiers of the subject (e.g., user, IP address); Identifiers of the object acted upon; Whether the action was allowed or denied; Subsystem performing the action; Reason codes for denied actions; Before/after values when updating data (unless sensitive); Category or severity label"}, {"id": "LOGP-08", "statement": "Logs must be formatted in a structured way (e.g., JSON, KVP, XML) to support parsing and integrations.", "modality": "must", "knob": "observability", "kind": "policy", "page": 7, "quote": "Logs should be formatted in a structured way (e.g., JSON, KVP, XML) to support parsing and integrations."}, {"id": "LOGP-09", "statement": "Logs must not contain unsanitized user input, passwords, encryption or decryption keys, API keys or other credentials, bank or credit card information, Personal Data, personal health information, Restricted Client Data, Restricted Internal Data, Restricted Contributor Data, source code, IB or MSG content, or any information illegal to collect.", "modality": "must-not", "knob": "observability", "kind": "policy", "page": 7, "quote": "Logs must not contain: Unsanitized user input; Passwords; Encryption or decryption keys; API keys or other credentials; Bank or credit card information; Personal Data; Personal health information; Restricted Client Data, Restricted Internal Data, or Restricted Contributor Data; Source code; IB or MSG content; Any information illegal to collect"}, {"id": "LOGP-10", "statement": "If user input must be logged, it must be sanitized first.", "modality": "must", "knob": "observability", "kind": "policy", "page": 7, "quote": "If user input must be logged, it must be sanitized first."}, {"id": "LOGP-11", "statement": "Client-side logs must not be relied upon for security decisions.", "modality": "must-not", "knob": "observability", "kind": "policy", "page": 8, "quote": "Client-side logs must not be relied upon for security decisions."}, {"id": "LOGP-12", "statement": "Client-side logs must be encrypted when possible.", "modality": "must", "knob": "data-protection", "kind": "policy", "page": 8, "quote": "Client-side logs should be encrypted when possible."}, {"id": "LOGP-13", "statement": "Client-side logs must be separated from server logs when uploaded.", "modality": "must", "knob": "observability", "kind": "policy", "page": 8, "quote": "Client-side logs must be separated from server logs when uploaded."}, {"id": "MON-01", "statement": "Operational monitoring of CSP environments must be performed by PCE.", "modality": "must", "knob": "observability", "kind": "policy", "page": 5, "quote": "Operational monitoring of CS across multiple Amazon EC2 instances or containers, or from multiple on-prem servers, such as team file shares, highly-available enterprise applications, analytics workloads, and ML training.", "services": ["Amazon EFS", "Amazon FSx", "Amazon FSx for Lustre", "Amazon FSx for NetApp ONTAP", "Amazon FSx for OpenZFS", "Amazon FSx for Windows File Server", "Amazon S3 File Gateway", "Amazon FSx File Gateway"]}, {"id": "guidance:storage:hybrid-edge", "category": "storage", "topic": "Hybrid/Edge", "when": "Deliver low-latency data to on-premises applications and providing on-premises applications access to cloud-backed storage.", "services": ["AWS Storage Gateway Tape Gateway", "AWS Storage Gateway Volume Gateway"]}, {"id": "guidance:storage:object", "category": "storage", "topic": "Object", "when": "Read-heavy workloads such as content distribution, web hosting, big data analytics, and ML workflows. Well-suited for scenarios where data needs to be stored, accessed, and distributed globally over the internet.", "services": ["Amazon S3"]}, {"id": "guidance:storage:offline-migration", "category": "storage", "topic": "Offline migration", "when": "Suitable for one-time or periodic uploads - and when data can be static in transit. This choice makes sense when you need to use only the minimum available bandwidth - and you prefer the predictability of physical moves.", "services": ["AWS Snowball"]}, {"id": "guidance:storage:online-migration", "category": "storage", "topic": "Online migration", "when": "Online is optimized for frequent updates to data. Use it for time-critical or ongoing workloads. Consider scheduling your transfer during off hours when you have sufficient bandwidth.", "services": ["AWS DataSync", "AWS Transfer Family", "Amazon FSx for NetApp ONTAP SnapMirror", "AWS Storage Gateway"]}], "meta": {"summary": "80 company rules · 19 approved regions · 155 approved services · 117 selection-guidance rules · from policy_rule.md (policy engine)"}}</script>
<script type="application/json" id="sample-data">[{"short": "Signal", "title": "Signal secure messaging on AWS", "source": "signalapp/Signal-Server @ a15d5cd", "sourceUrl": "https://github.com/signalapp/Signal-Server/tree/a15d5cdbb937fc5d078b73ec7b4a725ddf4e9473", "alt": "Architecture diagram: employee devices reach Signal chat services on Amazon EKS through Route 53, AWS WAF and an Application Load Balancer. The services use DynamoDB, ElastiCache, FoundationDB and S3. A separate compliance account captures journaled messages into an S3 Object Lock archive, and a warm-standby region receives replicas.", "folder": "samples/signal_secure_messaging_on_aws", "linkFiles": true, "files": {"req": "requirements.json", "sum": "architecture_summary.md", "yaml": "signal_secure_messaging_on_aws.yaml", "diag": "signal_secure_messaging_on_aws.png"}, "req": "{\n  \"$schema\": \"cdp/requirements/v0\",\n  \"document\": {\n    \"id\": \"REQ-SIGNAL-001\",\n    \"title\": \"Signal secure messaging for a regulated financial firm\",\n    \"version\": \"1.0\",\n    \"status\": \"ready-for-design\",\n    \"created\": \"2026-10-08\",\n    \"produced_by\": \"Reference sample written in the Requirements Analyzer format (see ../README.md)\",\n    \"policy_basis\": \"Company policy rules from policy_rule.md (policy engine); policy_refs use its rule IDs.\"\n  },\n  \"application\": {\n    \"name\": \"Signal Server and companion services\",\n    \"repository\": \"https://github.com/signalapp/Signal-Server\",\n    \"commit\": \"a15d5cdbb937\",\n    \"license\": \"AGPL-3.0\",\n    \"summary\": \"The open-source server behind the Signal messenger: end-to-end encrypted 1:1 and group messaging, attachments, linked devices, and voice/video calling. The chat server is a Java (Dropwizard) service; several capabilities live in companion repositories.\",\n    \"components\": [\n      {\n        \"name\": \"Chat service\",\n        \"repository\": \"signalapp/Signal-Server\",\n        \"language\": \"Java (Dropwizard)\",\n        \"role\": \"WebSocket/gRPC API, message routing, accounts, keys, push\"\n      },\n      {\n        \"name\": \"Registration service\",\n        \"repository\": \"signalapp/registration-service\",\n        \"language\": \"Java\",\n        \"role\": \"Phone-number verification for new accounts (gRPC)\"\n      },\n      {\n        \"name\": \"Storage service\",\n        \"repository\": \"signalapp/storage-service\",\n        \"language\": \"Java\",\n        \"role\": \"Encrypted contacts/settings sync and groups; uses Google Cloud Bigtable\"\n      },\n      {\n        \"name\": \"Key transparency server\",\n        \"repository\": \"signalapp/key-transparency-server\",\n        \"language\": \"Go\",\n        \"role\": \"Append-only log of identity keys; uses DynamoDB and DynamoDB Streams\"\n      },\n      {\n        \"name\": \"Calling service\",\n        \"repository\": \"signalapp/Signal-Calling-Service\",\n        \"language\": \"Rust\",\n        \"role\": \"Selective forwarding unit for group calls\"\n      },\n      {\n        \"name\": \"Contact discovery\",\n        \"repository\": \"signalapp/ContactDiscoveryService-Icelake\",\n        \"language\": \"C (hardware enclave)\",\n        \"role\": \"Private address-book lookup inside an attested enclave\"\n      },\n      {\n        \"name\": \"Secure value recovery\",\n        \"repository\": \"signalapp/SecureValueRecovery2\",\n        \"language\": \"C++ (hardware enclave)\",\n        \"role\": \"PIN-protected recovery of account secrets\"\n      }\n    ],\n    \"detected_signals\": [\n      {\n        \"id\": \"SIG-01\",\n        \"signal\": \"WebSocket and gRPC listeners on the chat service\",\n        \"evidence\": \"service/config/sample.yml: grpc.port 50051, grpc.websocketPort 8080\",\n        \"implies\": \"Long-lived client connections; load balancer must support WebSocket and HTTP/2\"\n      },\n      {\n        \"id\": \"SIG-02\",\n        \"signal\": \"34 DynamoDB tables (accounts, keys, profiles, messages, verification sessions, and more)\",\n        \"evidence\": \"service/config/sample.yml: dynamoDbTables\",\n        \"implies\": \"DynamoDB is the primary system of record for accounts and keys\"\n      },\n      {\n        \"id\": \"SIG-03\",\n        \"signal\": \"Five separate Redis endpoints: cache, pub/sub, push scheduler, rate limiters, message cache\",\n        \"evidence\": \"service/config/sample.yml: cacheCluster, pubsub, pushSchedulerCluster, rateLimitersCluster, messageCache\",\n        \"implies\": \"Managed Redis with cluster mode for four endpoints; pub/sub uses a single non-cluster endpoint\"\n      },\n      {\n        \"id\": \"SIG-04\",\n        \"signal\": \"FoundationDB message store sharded across four clusters with resharding epochs\",\n        \"evidence\": \"service/config/sample.yml: foundationDbMessages; README: 'This project uses FoundationDB'\",\n        \"implies\": \"Self-managed FoundationDB; no managed equivalent on AWS\"\n      },\n      {\n        \"id\": \"SIG-05\",\n        \"signal\": \"Messages are cached in Redis and persisted after one minute\",\n        \"evidence\": \"service/config/sample.yml: messageCache.persistDelayMinutes 1\",\n        \"implies\": \"Message cache must be Multi-AZ to avoid loss of undelivered messages\"\n      },\n      {\n        \"id\": \"SIG-06\",\n        \"signal\": \"Object storage for attachments and prekeys, with resumable uploads\",\n        \"evidence\": \"service/config/sample.yml: cdn.bucket, pagedSingleUseKEMPreKeyStore.bucket, tus.uploadUri, gcpAttachments, cdn3StorageManager (gcs, r2)\",\n        \"implies\": \"S3 buckets plus a CDN for downloads and a tus upload endpoint; upstream also uses GCS and Cloudflare R2\"\n      },\n      {\n        \"id\": \"SIG-07\",\n        \"signal\": \"Push notifications through Apple and Google\",\n        \"evidence\": \"service/config/sample.yml: apn, fcm\",\n        \"implies\": \"Outbound internet egress to APNs and FCM only\"\n      },\n      {\n        \"id\": \"SIG-08\",\n        \"signal\": \"Contact discovery and secure value recovery run as remote enclave services\",\n        \"evidence\": \"service/config/sample.yml: directoryV2, svr2, svrb\",\n        \"implies\": \"Hardware-enclave hosting; the upstream enclave code targets Intel SGX\"\n      },\n      {\n        \"id\": \"SIG-09\",\n        \"signal\": \"Storage service persists to Google Cloud Bigtable\",\n        \"evidence\": \"signalapp/storage-service: src/main/java/org/signal/storageservice/storage/Table.java\",\n        \"implies\": \"Porting to an AWS data store, or a cross-cloud dependency\"\n      },\n      {\n        \"id\": \"SIG-10\",\n        \"signal\": \"Consumer monetisation integrations: Stripe, Braintree, Google Play and App Store billing, MobileCoin payments, donations\",\n        \"evidence\": \"service/config/sample.yml: stripe, braintree, googlePlayBilling, appleAppStore, paymentsService, oneTimeDonations\",\n        \"implies\": \"Not needed for an enterprise deployment; removing them shrinks third-party and payment-card scope\"\n      },\n      {\n        \"id\": \"SIG-11\",\n        \"signal\": \"Calling relies on TURN relays (Cloudflare in the sample) and a group-call SFU\",\n        \"evidence\": \"service/config/sample.yml: turn.cloudflare; signalapp/Signal-Calling-Service\",\n        \"implies\": \"UDP media paths and public IPs for relays\"\n      },\n      {\n        \"id\": \"SIG-12\",\n        \"signal\": \"OpenTelemetry export for logs and traces\",\n        \"evidence\": \"service/config/sample.yml: logging.appenders[type: otlp], openTelemetry\",\n        \"implies\": \"OTel collector feeding the firm's monitoring stack\"\n      },\n      {\n        \"id\": \"SIG-13\",\n        \"signal\": \"Dynamic configuration and ASN table read from S3 every 10 seconds\",\n        \"evidence\": \"service/config/sample.yml: dynamicConfig, asnTable\",\n        \"implies\": \"Configuration bucket with versioning and change control\"\n      },\n      {\n        \"id\": \"SIG-14\",\n        \"signal\": \"Secrets referenced indirectly as secret:// values\",\n        \"evidence\": \"service/config/sample.yml: secret://...\",\n        \"implies\": \"Secrets manager integration; no secrets in config files\"\n      },\n      {\n        \"id\": \"SIG-15\",\n        \"signal\": \"Messages expire after 30 days in the messages table\",\n        \"evidence\": \"service/config/sample.yml: dynamoDbTables.messages.expiration P30D\",\n        \"implies\": \"Server-side storage is transient and cannot serve as a record-keeping archive\"\n      },\n      {\n        \"id\": \"SIG-16\",\n        \"signal\": \"Cryptography export classification ECCN 5D002\",\n        \"evidence\": \"README.md: Cryptography Notice\",\n        \"implies\": \"Export-control review before deploying in each country\"\n      }\n    ]\n  },\n  \"scenario\": {\n    \"summary\": \"A regulated broker-dealer wants a sanctioned secure messenger for employees to replace off-channel use of consumer apps. It will self-host the open-source Signal stack on AWS, keep end-to-end encryption, and still capture every business communication for record-keeping and supervision.\",\n    \"assumptions\": [\n      \"25,000 employees with up to three linked devices each (about 60,000 devices)\",\n      \"Peak 20,000 concurrent WebSocket connections and 2 million messages per day\",\n      \"Attachments up to 100 MB\",\n      \"Closed user group: only employees can register; no federation with the public Signal network\",\n      \"All devices are enrolled in the firm's mobile device management\"\n    ],\n    \"out_of_scope\": [\n      \"Consumer payments, donations and subscription billing\",\n      \"Interoperability with the public Signal service\",\n      \"Voice recording for roles subject to call-taping rules (calling is disabled for those roles)\"\n    ]\n  },\n  \"functional_requirements\": [\n    {\n      \"id\": \"FR-01\",\n      \"statement\": \"End-to-end encrypted 1:1 and group messaging across phones, tablets and desktops, including linked devices\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-02\",\n      \"statement\": \"1:1 and group voice and video calls with relay support for restrictive networks\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-03\",\n      \"statement\": \"Attachments up to 100 MB with resumable uploads\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-04\",\n      \"statement\": \"Only active employees can register, using their corporate identity; leavers lose access within 15 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-05\",\n      \"statement\": \"Capture every message, edit, deletion, attachment and call record of in-scope employees into the firm's archive\",\n      \"source\": \"regulation\"\n    },\n    {\n      \"id\": \"FR-06\",\n      \"statement\": \"Compliance reviewers can search, review and export captured communications, and place legal holds\",\n      \"source\": \"regulation\"\n    },\n    {\n      \"id\": \"FR-07\",\n      \"statement\": \"Employees find colleagues through the firm directory\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-08\",\n      \"statement\": \"Users can verify each other's identity keys (safety numbers backed by key transparency)\",\n      \"source\": \"detected\"\n    }\n  ],\n  \"non_functional_requirements\": [\n    {\n      \"id\": \"NFR-SEC-01\",\n      \"category\": \"security\",\n      \"statement\": \"Message content stays end-to-end encrypted; servers never handle plaintext\",\n      \"target\": \"Zero plaintext message content in the production account\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"DPE-03\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-02\",\n      \"category\": \"security\",\n      \"statement\": \"All data at rest is encrypted with customer-managed keys; archive keys are controlled only by the compliance function\",\n      \"target\": \"100% of stores use KMS customer-managed keys; archive key in a separate account\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"DPE-01\",\n        \"DPE-02\",\n        \"IAM-07\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-03\",\n      \"category\": \"security\",\n      \"statement\": \"Only MDM-managed, attested devices can register and connect\",\n      \"target\": \"Device attestation on every registration\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-04\",\n      \"category\": \"security\",\n      \"statement\": \"Administrative access through SSO with MFA and no standing shell access\",\n      \"target\": \"No SSH keys; Session Manager only; break-glass access audited\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"IAM-01\",\n        \"IAM-02\",\n        \"IAM-03\",\n        \"BB_AWS0137\"\n      ]\n    },\n    {\n      \"id\": \"NFR-CMP-01\",\n      \"category\": \"compliance\",\n      \"statement\": \"Retain business communications, the first two years in an easily accessible place\",\n      \"target\": \"At least 3 years (regulatory minimum); firm policy 7 years\",\n      \"source\": \"regulation\",\n      \"reference\": \"SEC Rule 17a-4(b)(4)\"\n    },\n    {\n      \"id\": \"NFR-CMP-02\",\n      \"category\": \"compliance\",\n      \"statement\": \"Records are preserved in a non-rewriteable, non-erasable form\",\n      \"target\": \"WORM storage in compliance mode; deletions impossible before retention ends\",\n      \"source\": \"regulation\",\n      \"reference\": \"SEC Rule 17a-4(f); FINRA Rule 4511\"\n    },\n    {\n      \"id\": \"NFR-CMP-03\",\n      \"category\": \"compliance\",\n      \"statement\": \"Captured communications are available to supervisory review and surveillance\",\n      \"target\": \"Delivered to the surveillance platform within 15 minutes of capture\",\n      \"source\": \"regulation\",\n      \"reference\": \"FINRA Rule 3110\"\n    },\n    {\n      \"id\": \"NFR-CMP-04\",\n      \"category\": \"compliance\",\n      \"statement\": \"Disappearing messages and deletions must not defeat capture\",\n      \"target\": \"Capture happens before any client-side expiry\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-05\",\n      \"category\": \"compliance\",\n      \"statement\": \"Encryption export-control review for every country of operation\",\n      \"target\": \"Legal sign-off per country before rollout\",\n      \"source\": \"org-policy\",\n      \"reference\": \"ECCN 5D002\"\n    },\n    {\n      \"id\": \"NFR-AVL-01\",\n      \"category\": \"availability\",\n      \"statement\": \"Messaging remains available through the loss of one availability zone\",\n      \"target\": \"99.95% monthly availability\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-DR-01\",\n      \"category\": \"disaster-recovery\",\n      \"statement\": \"Recover messaging in a second region after a regional outage\",\n      \"target\": \"RPO 5 minutes for accounts and keys; RTO 1 hour\",\n      \"source\": \"team-confirmed\",\n      \"policy_refs\": [\n        \"COMP-06\"\n      ]\n    },\n    {\n      \"id\": \"NFR-PRF-01\",\n      \"category\": \"performance\",\n      \"statement\": \"Fast delivery to online recipients within the region\",\n      \"target\": \"p99 under 1 second from server acknowledgement to recipient device\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-SCL-01\",\n      \"category\": \"scalability\",\n      \"statement\": \"Handle peak load with headroom\",\n      \"target\": \"20,000 concurrent connections and 2 million messages per day, with 3x headroom\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-OPS-01\",\n      \"category\": \"operations\",\n      \"statement\": \"Central logs, metrics and traces with no message content, keys or phone numbers in telemetry\",\n      \"target\": \"Automated log scrubbing checks in CI\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"LOGP-01\",\n        \"LOGP-09\",\n        \"CSPLOG-01\"\n      ]\n    },\n    {\n      \"id\": \"NFR-NET-01\",\n      \"category\": \"networking\",\n      \"statement\": \"Outbound traffic only to approved destinations\",\n      \"target\": \"Egress allowlist: APNs, FCM, corporate IdP\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"REG-03\"\n      ]\n    },\n    {\n      \"id\": \"NFR-DAT-01\",\n      \"category\": \"data\",\n      \"statement\": \"Message content stays in the firm's AWS accounts, except for exports to the approved surveillance platform\",\n      \"target\": \"Exports only over private connectivity; no other third party receives message content\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"REG-01\",\n        \"DPE-06\"\n      ]\n    },\n    {\n      \"id\": \"NFR-CST-01\",\n      \"category\": \"cost\",\n      \"statement\": \"Cost is visible per component and per environment\",\n      \"target\": \"100% of resources tagged; monthly cost report per tier\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"TAG-02\"\n      ]\n    }\n  ],\n  \"policy_conflicts\": [\n    {\n      \"id\": \"CON-01\",\n      \"between\": [\n        \"NFR-SEC-01\",\n        \"FR-05\",\n        \"NFR-CMP-01\"\n      ],\n      \"summary\": \"End-to-end encryption means the servers cannot read messages, yet every business communication must be captured and retained.\",\n      \"proposed_resolution\": \"Capture at the endpoint: a firm-managed client build journals each sent and received message, encrypted to the archive's public key, into an isolated compliance account. Plaintext exists only on devices and inside the archive's controlled decryption step.\",\n      \"needs_exception\": true\n    },\n    {\n      \"id\": \"CON-02\",\n      \"between\": [\n        \"SIG-15\",\n        \"NFR-CMP-04\"\n      ],\n      \"summary\": \"Signal supports disappearing messages and server-side expiry, which conflicts with retention.\",\n      \"proposed_resolution\": \"Disable disappearing messages through managed-client policy; journal messages at send and receive time.\",\n      \"needs_exception\": false\n    },\n    {\n      \"id\": \"CON-03\",\n      \"between\": [\n        \"SIG-08\",\n        \"NFR-DAT-01\"\n      ],\n      \"summary\": \"Upstream contact discovery and secure value recovery depend on Intel SGX enclaves, which AWS does not offer.\",\n      \"proposed_resolution\": \"Replace contact discovery with the firm directory (the user group is closed and the directory is known) and disable PIN-based recovery; managed devices are re-provisioned instead.\",\n      \"needs_exception\": false,\n      \"policy_refs\": [\n        \"COMP-03\"\n      ]\n    },\n    {\n      \"id\": \"CON-04\",\n      \"between\": [\n        \"SIG-09\",\n        \"NFR-DAT-01\"\n      ],\n      \"summary\": \"The storage service persists to Google Cloud Bigtable, which would put group and sync data with a second cloud provider.\",\n      \"proposed_resolution\": \"Port the storage layer to DynamoDB.\",\n      \"needs_exception\": false,\n      \"policy_refs\": [\n        \"DPE-06\"\n      ]\n    },\n    {\n      \"id\": \"CON-05\",\n      \"between\": [\n        \"FR-02\",\n        \"BB_AWS0206\"\n      ],\n      \"summary\": \"Group calls need UDP media ports from the internet, but company policy allows only ports 80 and 443 from the internet.\",\n      \"proposed_resolution\": \"Request an exception for the SFU and TURN media ports (EXC-04), with TURN over TLS on 443 as the fallback for networks that block UDP.\",\n      \"needs_exception\": true,\n      \"policy_refs\": [\n        \"BB_AWS0206\"\n      ]\n    }\n  ],\n  \"open_questions\": [\n    {\n      \"id\": \"Q-01\",\n      \"question\": \"Which surveillance and e-discovery platform receives the export, and in which format?\",\n      \"owner\": \"Compliance\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-02\",\n      \"question\": \"Which roles are subject to call-recording rules and must have calling disabled?\",\n      \"owner\": \"Compliance\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-03\",\n      \"question\": \"Is the firm prepared to maintain modified forks of the AGPL-licensed server components and offer their source to users?\",\n      \"owner\": \"Legal / Engineering\",\n      \"blocking\": false\n    }\n  ],\n  \"scoring\": {\n    \"rubric\": \"Mean of 12 parts: ten NFR categories (1 = numeric target, 0.5 = requirement without one, 0 = none), functional coverage, and conflict resolution; minus 0.05 per blocking open question. See ../README.md.\",\n    \"threshold\": 0.85,\n    \"completeness\": 0.875,\n    \"status\": \"ready-for-design\",\n    \"by_dimension\": {\n      \"security\": 1.0,\n      \"compliance\": 1.0,\n      \"availability\": 1.0,\n      \"disaster-recovery\": 1.0,\n      \"performance\": 1.0,\n      \"scalability\": 1.0,\n      \"operations\": 0.5,\n      \"networking\": 0.5,\n      \"data\": 0.5,\n      \"cost\": 1.0,\n      \"functional\": 1.0,\n      \"conflicts-resolved\": 1.0\n    },\n    \"gaps\": [\n      \"operations: no measurable target\",\n      \"networking: no measurable target\",\n      \"data: no measurable target\"\n    ]\n  }\n}", "yaml": "diagram:\n  name: Signal Secure Messaging on AWS\n  direction: left-to-right\n  format: png\n  open: true\n  style:\n    graph:\n      splines: ortho\n      nodesep: 0.7\n      ranksep: 1.3\n      fontsize: 24\n  resources:\n    # People and services outside the firm's AWS accounts\n    - id: employees\n      name: Employee devices (MDM-managed)\n      type: aws.general.Users\n      relates:\n        - to: route53\n          direction: outgoing\n        - to: attachments_cdn\n          direction: outgoing\n          label: Attachment download\n        - to: calls_nlb\n          direction: outgoing\n          label: Group calls (UDP)\n        - to: turn\n          direction: outgoing\n          label: 1:1 call relay\n        - to: capture_api\n          direction: outgoing\n          label: Compliance journal (encrypted)\n\n    - id: idp\n      name: Corporate IdP (SSO + SCIM)\n      type: aws.security.SingleSignOn\n      relates:\n        - to: registration\n          direction: incoming\n          label: Verify employee (OIDC)\n        - to: directory\n          direction: outgoing\n          label: SCIM sync\n\n    - id: push_providers\n      name: Push providers\n      type: cluster\n      of:\n        - id: apns\n          name: Apple APNs\n          type: generic.os.IOS\n        - id: fcm\n          name: Google FCM\n          type: generic.os.Android\n\n    - id: surveillance\n      name: Approved surveillance & e-discovery platform\n      type: aws.general.TraditionalServer\n\n    # Primary region: production workload account\n    - id: region_primary\n      name: AWS Region A - primary (3 AZs)\n      type: cluster\n      of:\n        - id: edge\n          name: Edge\n          type: cluster\n          of:\n            - id: route53\n              name: Route 53 (failover routing)\n              type: aws.network.Route53\n              relates:\n                - to: chat_waf\n                  direction: outgoing\n                - to: dr_eks\n                  direction: outgoing\n                  label: Regional failover\n                  style: dashed\n            - id: chat_waf\n              name: AWS WAF + Shield Advanced\n              type: aws.security.WAF\n              relates:\n                - to: chat_alb\n                  direction: outgoing\n            - id: chat_alb\n              name: Chat ALB (WebSocket, TLS 1.3)\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: chat\n                  direction: outgoing\n                  label: WebSocket + gRPC\n                - to: registration\n                  direction: outgoing\n                - to: directory\n                  direction: outgoing\n                - to: storage_service\n                  direction: outgoing\n                - to: key_transparency\n                  direction: outgoing\n                - to: upload\n                  direction: outgoing\n                  label: Uploads (tus)\n            - id: attachments_cdn\n              name: CloudFront (signed URLs)\n              type: aws.network.CloudFront\n              relates:\n                - to: attachments\n                  direction: outgoing\n                  label: Origin access control\n            - id: calls_nlb\n              name: NLB (UDP) for calls\n              type: aws.network.ElbNetworkLoadBalancer\n              relates:\n                - to: sfu\n                  direction: outgoing\n\n        - id: eks\n          name: Amazon EKS - private subnets\n          type: cluster\n          of:\n            - id: chat\n              name: Chat service x N (Signal-Server)\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Accounts, keys, profiles\n                - to: redis\n                  direction: outgoing\n                  label: Presence, pub/sub, rate limits\n                - to: foundationdb\n                  direction: outgoing\n                  label: Message queues\n                - to: config_bucket\n                  direction: outgoing\n                  label: Prekeys, dynamic config\n                - to: egress\n                  direction: outgoing\n                  label: Push wake-ups\n                - to: telemetry\n                  direction: outgoing\n                  label: OpenTelemetry (no content)\n            - id: registration\n              name: Registration service (SSO-gated)\n              type: k8s.compute.Deployment\n            - id: directory\n              name: Firm directory service\n              type: k8s.compute.Deployment\n            - id: storage_service\n              name: Storage service (groups, encrypted sync)\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Ported from Bigtable\n            - id: key_transparency\n              name: Key transparency service\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Transparency log\n            - id: upload\n              name: Attachment upload service (tus)\n              type: k8s.compute.Deployment\n              relates:\n                - to: attachments\n                  direction: outgoing\n                  label: Encrypted blobs\n\n        - id: calling\n          name: Calling - public subnets\n          type: cluster\n          of:\n            - id: sfu\n              name: Group-call SFU (Signal-Calling-Service)\n              type: aws.compute.EC2Instances\n            - id: turn\n              name: TURN relays (Elastic IPs)\n              type: aws.compute.EC2\n\n        - id: data\n          name: Data - private subnets\n          type: cluster\n          of:\n            - id: dynamodb\n              name: DynamoDB (on-demand, PITR)\n              type: aws.database.Dynamodb\n              relates:\n                - to: dr_dynamodb\n                  direction: outgoing\n                  label: Global tables\n            - id: redis\n              name: ElastiCache for Redis (5 clusters)\n              type: aws.database.ElastiCache\n            - id: foundationdb\n              name: FoundationDB message store (EC2 i4i, 3 AZs)\n              type: aws.compute.EC2Instances\n              relates:\n                - to: dr_foundationdb\n                  direction: outgoing\n                  label: Async DR\n            - id: attachments\n              name: S3 attachments (SSE-KMS)\n              type: aws.storage.SimpleStorageServiceS3Bucket\n              relates:\n                - to: dr_s3\n                  direction: outgoing\n                  label: Cross-region replication\n            - id: config_bucket\n              name: S3 prekeys & dynamic config\n              type: aws.storage.SimpleStorageServiceS3Bucket\n\n        - id: operations\n          name: Security & operations\n          type: cluster\n          of:\n            - id: kms\n              name: KMS keys + Secrets Manager\n              type: aws.security.KMS\n            - id: telemetry\n              name: CloudWatch, X-Ray, CloudTrail, GuardDuty\n              type: aws.management.Cloudwatch\n\n        - id: egress\n          name: Egress - Network Firewall allowlist + NAT\n          type: aws.network.NATGateway\n          relates:\n            - to: apns\n              direction: outgoing\n            - to: fcm\n              direction: outgoing\n\n    # Separate AWS account: compliance capture and books-and-records archive\n    - id: compliance_account\n      name: Compliance account (isolated)\n      type: cluster\n      of:\n        - id: capture_api\n          name: Capture API (mTLS)\n          type: aws.network.APIGateway\n          relates:\n            - to: capture_queue\n              direction: outgoing\n        - id: capture_queue\n          name: Capture queue (SQS FIFO)\n          type: aws.integration.SQS\n          relates:\n            - to: archiver\n              direction: outgoing\n        - id: archiver\n          name: Archive processor (Lambda)\n          type: aws.compute.Lambda\n          relates:\n            - to: worm_archive\n              direction: outgoing\n              label: Write once\n            - to: archive_key\n              direction: outgoing\n              label: Decrypt (isolated role only)\n            - to: surveillance\n              direction: outgoing\n              label: Export (EML)\n        - id: worm_archive\n          name: WORM archive (S3 Object Lock, 7 years)\n          type: aws.storage.SimpleStorageServiceS3BucketWithObjects\n          relates:\n            - to: dr_s3\n              direction: outgoing\n              label: Object Lock replication\n        - id: archive_key\n          name: Archive key (KMS custom key store on CloudHSM)\n          type: aws.security.CloudHSM\n\n    # Second region: warm standby\n    - id: region_dr\n      name: AWS Region B - warm standby\n      type: cluster\n      of:\n        - id: dr_eks\n          name: EKS (scaled down)\n          type: aws.compute.EKS\n        - id: dr_dynamodb\n          name: DynamoDB replica\n          type: aws.database.Dynamodb\n        - id: dr_foundationdb\n          name: FoundationDB DR cluster\n          type: aws.compute.EC2Instances\n        - id: dr_s3\n          name: S3 replicas (attachments, WORM archive)\n          type: aws.storage.S3", "summaryHtml": "<h2>Overview<\/h2>\n<p>A regulated broker-dealer wants a sanctioned secure messenger for its 25,000 employees, so that business conversations stop moving to consumer apps that compliance cannot see. This design self-hosts the open-source Signal stack on AWS as a closed, firm-only service. It keeps Signal's end-to-end encryption and adds what a regulated firm needs on top: identity tied to the corporate directory, capture of every business communication into a write-once archive, and a warm standby region.<\/p>\n<p>The central tension is that end-to-end encryption and record-keeping pull in opposite directions. The servers never see plaintext, so the firm cannot capture messages on the server. The design resolves this at the endpoint and isolates everything that can decrypt the archive in a separate AWS account.<\/p>\n<h2>Scope and assumptions<\/h2>\n<ul>\n<li>25,000 employees, up to three linked devices each; peak 20,000 concurrent connections; 2 million messages per day.<\/li>\n<li>Closed user group: only employees register, and the service does not federate with the public Signal network.<\/li>\n<li>Every device is enrolled in the firm's mobile device management.<\/li>\n<li>Consumer payments, donations and billing are out of scope. So is call recording, so calling is disabled for roles subject to call-taping rules.<\/li>\n<\/ul>\n<h2>Architecture at a glance<\/h2>\n<ul>\n<li><strong>Edge:<\/strong> Route 53 failover records; an Application Load Balancer for WebSocket and gRPC traffic behind AWS WAF and Shield Advanced; CloudFront for attachment downloads; a UDP Network Load Balancer for group calls.<\/li>\n<li><strong>Services (Amazon EKS, private subnets, three AZs):<\/strong> chat (Signal-Server), registration, storage, key transparency, the firm directory and the attachment upload (tus) service.<\/li>\n<li><strong>Calling:<\/strong> the group-call SFU (Signal-Calling-Service) and TURN relays on EC2 in public subnets.<\/li>\n<li><strong>Data:<\/strong> DynamoDB (34 tables), ElastiCache for Redis (five endpoints), FoundationDB on EC2 for message queues, and S3 for attachments, prekeys and dynamic configuration.<\/li>\n<li><strong>Compliance account:<\/strong> capture API, SQS FIFO buffer, archive processor, S3 Object Lock archive and a CloudHSM-backed archive key.<\/li>\n<li><strong>Region B:<\/strong> warm standby with DynamoDB global tables, FoundationDB DR, replicated S3 buckets and a scaled-down EKS cluster.<\/li>\n<\/ul>\n<h2>Key decisions<\/h2>\n<p>&quot;Grounded in&quot; lists the company policy rules each decision follows, by their ID in <code>policy_rule.md<\/code>: company rules (for example <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a>), approved services (<code>svc:…<\/code>) and AWS selection guidance (<code>guidance:…<\/code>). &quot;Signals&quot; lists what the code scan found.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Decision<\/th>\n<th>Satisfies<\/th>\n<th>Grounded in (policy)<\/th>\n<th>Signals<\/th>\n<th>Alternatives considered<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D1<\/td>\n<td>Run the open-source stack as a closed deployment on Amazon EKS across three AZs<\/td>\n<td>FR-01, FR-04, NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:containers:amazon-elastic-kubernetes-service\">svc:<wbr>containers:<wbr>amazon-<wbr>elastic-<wbr>kubernetes-<wbr>service<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:containers:orchestration\">guidance:<wbr>containers:<wbr>orchestration<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-01\">COMP-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-05\">COMP-<wbr>05<\/a><\/td>\n<td>SIG-01; component inventory<\/td>\n<td>ECS on Fargate is viable. EKS runs seven services and their autoscaling on one platform.<\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>Capture at the endpoint: a firm-managed client journals each sent and received message, encrypted to the archive key, into an isolated compliance account. Records land in S3 Object Lock (compliance mode, 7 years). Only the archive processor's role can use the CloudHSM-backed key.<\/td>\n<td>FR-05, FR-06, NFR-CMP-01 to 04, NFR-SEC-02<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-02\">DPE-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-04\">REG-<wbr>04<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-cloudhsm\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>cloudhsm<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:storage:amazon-simple-storage-service\">svc:<wbr>storage:<wbr>amazon-<wbr>simple-<wbr>storage-<wbr>service<\/a><\/td>\n<td>CON-01; SEC Rule 17a-4<\/td>\n<td>Server-side cap
