ture is impossible with end-to-end encryption. A third-party archiving fork of Signal was rejected: in 2025 one such product was breached and its archive server held plaintext copies.<\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>Replace SGX-based contact discovery with a firm directory service fed by SCIM, and disable PIN-based secure value recovery<\/td>\n<td>FR-07, NFR-DAT-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-01\">REG-<wbr>01<\/a><\/td>\n<td>SIG-08, CON-03<\/td>\n<td>Port the enclave services to AWS Nitro Enclaves. This takes significant effort; revisit if the user group opens up.<\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>Port the storage service from Google Cloud Bigtable to DynamoDB<\/td>\n<td>NFR-DAT-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-dynamodb\">svc:<wbr>databases:<wbr>amazon-<wbr>dynamodb<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:key-value\">guidance:<wbr>databases:<wbr>key-<wbr>value<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-06\">DPE-<wbr>06<\/a><\/td>\n<td>SIG-09, CON-04<\/td>\n<td>Keep Bigtable over a cross-cloud link. That adds a second provider and a data-residency review.<\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>DynamoDB on demand with point-in-time recovery for accounts, keys and profiles; global tables to Region B<\/td>\n<td>NFR-DR-01, NFR-SCL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-dynamodb\">svc:<wbr>databases:<wbr>amazon-<wbr>dynamodb<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:key-value\">guidance:<wbr>databases:<wbr>key-<wbr>value<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-06\">COMP-<wbr>06<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a><\/td>\n<td>SIG-02<\/td>\n<td>Aurora PostgreSQL would mean rewriting the data layer.<\/td>\n<\/tr>\n<tr>\n<td>D6<\/td>\n<td>FoundationDB on EC2 i4i instances (local NVMe) across three AZs in triple-redundancy mode, with asynchronous DR replication to Region B Self-managed, so it needs exception EXC-02.<\/td>\n<td>NFR-AVL-01, NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:compute:amazon-ec2\">svc:<wbr>compute:<wbr>amazon-<wbr>ec2<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-01\">COMP-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"INIT-VM-01\">INIT-<wbr>VM-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-06\">COMP-<wbr>06<\/a><\/td>\n<td>SIG-04<\/td>\n<td>The DynamoDB <code>messages<\/code> table that still appears in the config. The current server build requires FoundationDB.<\/td>\n<\/tr>\n<tr>\n<td>D7<\/td>\n<td>ElastiCache for Redis OSS, Multi-AZ: four cluster-mode groups plus one non-clustered group for pub/sub, matching upstream<\/td>\n<td>NFR-PRF-01, NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-elasticache\">svc:<wbr>databases:<wbr>amazon-<wbr>elasticache<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:in-memory\">guidance:<wbr>databases:<wbr>in-<wbr>memory<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-03\">DPE-<wbr>03<\/a><\/td>\n<td>SIG-03, SIG-05<\/td>\n<td>One shared cluster: fewer nodes, but a larger blast radius and noisy neighbours.<\/td>\n<\/tr>\n<tr>\n<td>D8<\/td>\n<td>The tus upload service writes client-encrypted blobs to S3 (SSE-KMS). Downloads go through CloudFront signed URLs with origin access control. Buckets replicate to Region B.<\/td>\n<td>FR-03, NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:storage:amazon-simple-storage-service\">svc:<wbr>storage:<wbr>amazon-<wbr>simple-<wbr>storage-<wbr>service<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:storage:object\">guidance:<wbr>storage:<wbr>object<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:networking-and-content-delivery:amazon-cloudfront\">svc:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>amazon-<wbr>cloudfront<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS01471\">BB_AWS01471<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-05\">DPE-<wbr>05<\/a><\/td>\n<td>SIG-06<\/td>\n<td>Upstream's GCS and Cloudflare R2 backends would add a second provider.<\/td>\n<\/tr>\n<tr>\n<td>D9<\/td>\n<td>Route 53 failover; an ALB for WebSocket and gRPC behind WAF and Shield Advanced; a UDP NLB for the SFU; TURN relays on EC2 with Elastic IPs UDP media ports need exception EXC-04.<\/td>\n<td>FR-02, NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"guidance:compute:elastic-load-balancing\">guidance:<wbr>compute:<wbr>elastic-<wbr>load-<wbr>balancing<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0125\">BB_AWS0125<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-waf\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>waf<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0206\">BB_AWS0206<\/a><\/td>\n<td>SIG-01, SIG-11<\/td>\n<td>Cloudflare TURN as upstream, which puts a third party in the media path.<\/td>\n<\/tr>\n<tr>\n<td>D10<\/td>\n<td>Remove consumer monetisation: Stripe, Braintree, app-store billing, MobileCoin and donations are not deployed<\/td>\n<td>NFR-DAT-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-04\">REG-<wbr>04<\/a><\/td>\n<td>SIG-10<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>D11<\/td>\n<td>Egress only through AWS Network Firewall with a domain allowlist (APNs, FCM, the IdP); VPC endpoints for AWS services<\/td>\n<td>NFR-NET-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-network-firewall\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>network-<wbr>firewall<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:networking-and-content-delivery:network-security-and-remote-access\">guidance:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>network-<wbr>security-<wbr>and-<wbr>remote-<wbr>access<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:networking-and-content-delivery:aws-privatelink\">svc:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>aws-<wbr>privatelink<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-03\">REG-<wbr>03<\/a><\/td>\n<td>SIG-07<\/td>\n<td>Open NAT egress<\/td>\n<\/tr>\n<tr>\n<td>D12<\/td>\n<td>Registration gated by corporate SSO (OIDC), with SCIM-driven deprovisioning within 15 minutes<\/td>\n<td>FR-04, NFR-SEC-03<\/td>\n<td>—<\/td>\n<td>Registration service in the component inventory<\/td>\n<td>SMS-only verification as upstream<\/td>\n<\/tr>\n<tr>\n<td>D13<\/td>\n<td>Warm standby in Region B with Route 53 failover<\/td>\n<td>NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-06\">COMP-<wbr>06<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-01\">REG-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-06\">DPE-<wbr>06<\/a><\/td>\n<td>NFR-DR-01 targets<\/td>\n<td>Active-active. FoundationDB queues and the Redis message cache make multi-writer complex.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>How a message flows<\/h2>\n<ol>\n<li>A device resolves the service through Route 53 and holds a WebSocket open to the chat service through WAF and the ALB.<\/li>\n<li>The sender's client encrypts the message with the Signal protocol and sends it. The chat service queues it for each recipient device in the Redis message cache, which persists to FoundationDB after one minute.<\/li>\n<li>Online recipients get it immediately over their WebSocket via Redis pub/sub. Offline devices get an APNs or FCM wake-up through the egress firewall and fetch the message when they reconnect.<\/li>\n<li>Attachments are encrypted on the device, uploaded through the tus service to S3 and downloaded through CloudFront.<\/li>\n<li>The managed client also journals the message, encrypted to the archive key, to the capture API in the compliance account. SQS FIFO buffers it and the archive processor writes the original to the WORM archive. Inside the isolated account it then decrypts a copy and exports it to the approved surveillance platform. People can reach raw archive content only with two-person approval.<\/li>\n<\/ol>\n<h2>Well-Architected review<\/h2>\n<ul>\n<li><strong>Security:<\/strong> end-to-end encryption is preserved. Customer-managed KMS keys everywhere; the archive key sits in a separate account with a CloudHSM key store. Least-privilege pod roles, no SSH, an egress allowlist, and WAF with Shield Advanced at the edge.<\/li>\n<li><strong>Reliability:<\/strong> every tier spans three AZs, including the Redis message cache (messages persist only after a minute). Warm standby in Region B meets RPO 5 minutes and RTO 1 hour.<\/li>\n<li><strong>Performance efficiency:<\/strong> Redis pub/sub fans messages out to open WebSockets, FoundationDB absorbs queue writes, and CloudFront serves attachments close to users.<\/li>\n<li><strong>Cost optimisation:<\/strong> DynamoDB on demand, Graviton node groups, a scaled-down standby region, and no consumer billing or payment services.<\/li>\n<li><strong>Operational excellence:<\/strong> OpenTelemetry to CloudWatch and X-Ray with log scrubbing tested in CI; everything defined as code; upstream releases tracked monthly.<\/li>\n<li><strong>Sustainability:<\/strong> Graviton instances and demand-based scaling in the standby region.<\/li>\n<\/ul>\n<h2>Policy check and exceptions requested<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Request<\/th>\n<th>Policy<\/th>\n<th>Why<\/th>\n<th>Compensating controls<\/th>\n<th>Approvers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EXC-01<\/td>\n<td>Run a modified, firm-managed client that journals messages for the archive<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>End-to-end encryption prevents server-side capture (CON-01)<\/td>\n<td>Separate compliance account; archive key usable only by the archive processor; two-person approval for human access; no plaintext stored outside the isolated account; annual penetration test of the client and archive<\/td>\n<td>CISO, Chief Compliance Officer<\/td>\n<\/tr>\n<tr>\n<td>EXC-02<\/td>\n<td>Operate self-managed FoundationDB<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>No managed equivalent on AWS, and the current server requires it<\/td>\n<td>Triple redundancy across three AZs, continuous backup to S3, DR cluster, runbooks and on-call cover<\/td>\n<td>Platform engineering lead, CGC<\/td>\n<\/tr>\n<tr>\n<td>EXC-03<\/td>\n<td>Maintain forks of AGPL-licensed components (client journaling, SSO registration, DynamoDB storage)<\/td>\n<td>—<\/td>\n<td>Needed for D2, D4 and D12<\/td>\n<td>Offer modified source to users as AGPL section 13 requires; merge upstream security fixes within 7 days<\/td>\n<td>Legal, open-source program office<\/td>\n<\/tr>\n<tr>\n<td>EXC-04<\/td>\n<td>Allow UDP media from the internet to the group-call SFU and TURN relays<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0206\">BB_AWS0206<\/a><\/td>\n<td>Calls need UDP media ports, and company policy allows only ports 80 and 443 from the internet<\/td>\n<td>Open only the SFU and TURN media port ranges, behind Shield Advanced; short-lived TURN credentials; TURN over TLS on 443 as the fallback for networks that block UDP<\/td>\n<td>CISO, CGC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Risks and open items<\/h2>\n<ul>\n<li>A compromised device exposes plaintext; this is inherent to end-to-end encryption. Device management and attestation reduce the risk but do not remove it.<\/li>\n<li>Fork maintenance: the client and three server components diverge from upstream, so security fixes must be merged quickly (EXC-03).<\/li>\n<li>FoundationDB and the Bigtable-to-DynamoDB port need specialist skills and are the largest engineering items.<\/li>\n<li>Open questions: the surveillance platform and export format (Q-01), roles that must have calling disabled (Q-02), and AGPL obligations (Q-03).<\/li>\n<li>An encryption export-control review is needed in each country of operation (NFR-CMP-05).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>Signal-Server at commit <code>a15d5cdbb937<\/code>: <a href=\"https://github.com/signalapp/Signal-Server/blob/main/service/config/sample.yml\" target=\"_blank\" rel=\"noopener\">service/config/sample.yml<\/a>, <a href=\"https://github.com/signalapp/Signal-Server\" target=\"_blank\" rel=\"noopener\">README<\/a><\/li>\n<li>Companion services: <a href=\"https://github.com/signalapp/registration-service\" target=\"_blank\" rel=\"noopener\">registration-service<\/a>, <a href=\"https://github.com/signalapp/storage-service\" target=\"_blank\" rel=\"noopener\">storage-service<\/a>, <a href=\"https://github.com/signalapp/key-transparency-server\" target=\"_blank\" rel=\"noopener\">key-transparency-server<\/a>, <a href=\"https://github.com/signalapp/Signal-Calling-Service\" target=\"_blank\" rel=\"noopener\">Signal-Calling-Service<\/a>, <a href=\"https://github.com/signalapp/ContactDiscoveryService-Icelake\" target=\"_blank\" rel=\"noopener\">ContactDiscoveryService-Icelake<\/a>, <a href=\"https://github.com/signalapp/SecureValueRecovery2\" target=\"_blank\" rel=\"noopener\">SecureValueRecovery2<\/a><\/li>\n<li><a href=\"https://www.ecfr.gov/current/title-17/section-240.17a-4\" target=\"_blank\" rel=\"noopener\">SEC Rule 17a-4<\/a>, <a href=\"https://www.finra.org/rules-guidance/rulebooks/finra-rules/3110\" target=\"_blank\" rel=\"noopener\">FINRA Rule 3110<\/a>, <a href=\"https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511\" target=\"_blank\" rel=\"noopener\">FINRA Rule 4511<\/a><\/li>\n<li><a href=\"https://techcrunch.com/2025/05/05/telemessage-a-modified-signal-clone-used-by-us-government-officials-has-been-hacked/\" target=\"_blank\" rel=\"noopener\">TechCrunch: TeleMessage, a modified Signal clone used by US government officials, has been hacked (May 2025)<\/a><\/li>\n<li>Company policy: <code>policy_rule.md<\/code> from the policy engine (company paved-path document, AWS service catalog, AWS decision guides)<\/li>\n<\/ul>\n", "png": "samples/signal_secure_messaging_on_aws/signal_secure_messaging_on_aws.png", "stats": {"signals": 16, "frs": 8, "nfrs": 17, "conflicts": 5, "completeness": 0.875, "threshold": 0.85, "decisions": 13, "nodes": 35, "clusters": 9}}, {"short": "Sentry", "title": "Sentry observability platform on AWS", "source": "getsentry/self-hosted @ d09ff0c", "sourceUrl": "https://github.com/getsentry/self-hosted/tree/d09ff0cd592f709828a84e7c46b7e7ff17e623f3", "alt": "Architecture diagram: SDK traffic enters through AWS WAF and a public load balancer, or through PrivateLink, to the Relay fleet. Events flow through Amazon MSK to processing consumers on EKS and land in ClickHouse, Aurora PostgreSQL, ElastiCache and S3. Backups are copied to a second EU region.", "folder": "samples/sentry_observability_platform_on_aws", "linkFiles": true, "files": {"req": "requirements.json", "sum": "architecture_summary.md", "yaml": "sentry_observability_platform_on_aws.yaml", "diag": "sentry_observability_platform_on_aws.png"}, "req": "{\n  \"$schema\": \"cdp/requirements/v0\",\n  \"document\": {\n    \"id\": \"REQ-SENTRY-001\",\n    \"title\": \"Self-hosted Sentry at enterprise scale\",\n    \"version\": \"1.0\",\n    \"status\": \"ready-for-design\",\n    \"created\": \"2026-10-08\",\n    \"produced_by\": \"Reference sample written in the Requirements Analyzer format (see ../README.md)\",\n    \"policy_basis\": \"Company policy rules from policy_rule.md (policy engine); policy_refs use its rule IDs.\"\n  },\n  \"application\": {\n    \"name\": \"Sentry (self-hosted)\",\n    \"repository\": \"https://github.com/getsentry/self-hosted\",\n    \"commit\": \"d09ff0cd592f\",\n    \"license\": \"FSL-1.1-Apache-2.0\",\n    \"summary\": \"Application monitoring: error tracking, tracing and performance, session replay, profiling, cron and uptime monitoring. The self-hosted package runs the full Sentry stack with Docker Compose and describes itself as 'packaged up for low-volume deployments and proofs-of-concept'.\",\n    \"components\": [\n      {\n        \"name\": \"Relay\",\n        \"repository\": \"getsentry/relay\",\n        \"language\": \"Rust\",\n        \"role\": \"Ingest edge: authenticates SDK traffic, applies quotas and rate limits, scrubs PII, writes to Kafka\"\n      },\n      {\n        \"name\": \"Sentry\",\n        \"repository\": \"getsentry/sentry\",\n        \"language\": \"Python (Django)\",\n        \"role\": \"Web UI and API, ingest consumers, post-processing, alerting, task workers\"\n      },\n      {\n        \"name\": \"Snuba\",\n        \"repository\": \"getsentry/snuba\",\n        \"language\": \"Python / Rust\",\n        \"role\": \"Query service and Kafka consumers in front of ClickHouse\"\n      },\n      {\n        \"name\": \"Symbolicator\",\n        \"repository\": \"getsentry/symbolicator\",\n        \"language\": \"Rust\",\n        \"role\": \"Native and JavaScript symbolication using uploaded debug files\"\n      },\n      {\n        \"name\": \"Vroom\",\n        \"repository\": \"getsentry/vroom\",\n        \"language\": \"Go\",\n        \"role\": \"Profiling storage and queries\"\n      },\n      {\n        \"name\": \"Taskbroker\",\n        \"repository\": \"getsentry/taskbroker\",\n        \"language\": \"Rust\",\n        \"role\": \"Kafka-backed task queue feeding task workers\"\n      },\n      {\n        \"name\": \"Uptime checker\",\n        \"repository\": \"getsentry/uptime-checker\",\n        \"language\": \"Rust\",\n        \"role\": \"Synthetic uptime checks\"\n      }\n    ],\n    \"detected_signals\": [\n      {\n        \"id\": \"SIG-01\",\n        \"signal\": \"53 services in the Compose topology\",\n        \"evidence\": \"docker-compose.yml: services\",\n        \"implies\": \"Container orchestration with per-service scaling\"\n      },\n      {\n        \"id\": \"SIG-02\",\n        \"signal\": \"Kafka is the ingest buffer and event stream, with a 50 MB maximum message size\",\n        \"evidence\": \"sentry/sentry.conf.example.py: DEFAULT_KAFKA_OPTIONS message.max.bytes 50000000; SENTRY_EVENTSTREAM KafkaEventStream\",\n        \"implies\": \"Durable, replicated Kafka; broker limits must accept large messages\"\n      },\n      {\n        \"id\": \"SIG-03\",\n        \"signal\": \"ClickHouse fed by 18 Snuba consumers\",\n        \"evidence\": \"docker-compose.yml: clickhouse, snuba-*-consumer, snuba-replacer, snuba-subscription-consumer-*\",\n        \"implies\": \"Analytical store sized for write-heavy, append-only ingest\"\n      },\n      {\n        \"id\": \"SIG-04\",\n        \"signal\": \"PostgreSQL behind PgBouncer for metadata\",\n        \"evidence\": \"docker-compose.yml: postgres, pgbouncer\",\n        \"implies\": \"Managed PostgreSQL with connection pooling\"\n      },\n      {\n        \"id\": \"SIG-05\",\n        \"signal\": \"Raw event payloads (nodestore) on S3-compatible storage\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_NODESTORE sentry_nodestore_s3.S3PassthroughDjangoNodeStorage (SeaweedFS)\",\n        \"implies\": \"Amazon S3 with lifecycle expiry matching retention\"\n      },\n      {\n        \"id\": \"SIG-06\",\n        \"signal\": \"Files and profiles stored on a filesystem or S3\",\n        \"evidence\": \"sentry/config.example.yml: filestore.backend filesystem; filestore.profiles-backend s3\",\n        \"implies\": \"Shared object storage instead of local disks so services can scale out\"\n      },\n      {\n        \"id\": \"SIG-07\",\n        \"signal\": \"Redis for cache, buffers, quotas, rate limits, TSDB and digests\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_CACHE, SENTRY_BUFFER, SENTRY_QUOTAS, SENTRY_RATELIMITER, SENTRY_TSDB, SENTRY_DIGESTS\",\n        \"implies\": \"Highly available managed Redis\"\n      },\n      {\n        \"id\": \"SIG-08\",\n        \"signal\": \"Memcached as the Django cache\",\n        \"evidence\": \"sentry/sentry.conf.example.py: CACHES memcached:11211\",\n        \"implies\": \"Managed Memcached\"\n      },\n      {\n        \"id\": \"SIG-09\",\n        \"signal\": \"Default event retention of 90 days\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_EVENT_RETENTION_DAYS default 90\",\n        \"implies\": \"Time-based expiry in ClickHouse and S3\"\n      },\n      {\n        \"id\": \"SIG-10\",\n        \"signal\": \"Kafka-backed task system (taskbroker, taskscheduler, taskworker)\",\n        \"evidence\": \"docker-compose.yml: taskbroker, taskscheduler, taskworker\",\n        \"implies\": \"Workers scaled on queue depth; no separate message broker needed\"\n      },\n      {\n        \"id\": \"SIG-11\",\n        \"signal\": \"Symbolication with local caches\",\n        \"evidence\": \"docker-compose.yml: symbolicator; sentry/config.example.yml: dsym.cache-path\",\n        \"implies\": \"Dedicated compute and a shared cache for debug files\"\n      },\n      {\n        \"id\": \"SIG-12\",\n        \"signal\": \"Outbound email over SMTP\",\n        \"evidence\": \"sentry/config.example.yml: mail.host smtp\",\n        \"implies\": \"Amazon SES\"\n      },\n      {\n        \"id\": \"SIG-13\",\n        \"signal\": \"Optional StatsD metrics for self-monitoring\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_STATSD_ADDR\",\n        \"implies\": \"Metrics agent feeding the firm's monitoring\"\n      },\n      {\n        \"id\": \"SIG-14\",\n        \"signal\": \"Single-organisation install\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_SINGLE_ORGANIZATION True\",\n        \"implies\": \"One organisation with teams and projects, managed through SSO\"\n      },\n      {\n        \"id\": \"SIG-15\",\n        \"signal\": \"Functional Source License\",\n        \"evidence\": \"LICENSE.md: FSL-1.1-Apache-2.0\",\n        \"implies\": \"Internal use is permitted; offering a competing hosted service is not\"\n      }\n    ]\n  },\n  \"scenario\": {\n    \"summary\": \"A large engineering organisation wants to run Sentry for 2,500 projects inside its own AWS accounts, because error and performance telemetry carries customer data and source context that may not leave the firm's environment.\",\n    \"assumptions\": [\n      \"3,000 engineers and 2,500 projects\",\n      \"5,000 events per second sustained and 25,000 per second during incident storms\",\n      \"About 2 TB per month of attachments, replays and profiles\",\n      \"Telemetry and backups stay in EU regions\"\n    ],\n    \"out_of_scope\": [\n      \"Sentry SaaS features that are not part of the self-hosted distribution\",\n      \"Multi-region active-active operation\"\n    ]\n  },\n  \"functional_requirements\": [\n    {\n      \"id\": \"FR-01\",\n      \"statement\": \"Ingest errors, transactions and spans, session replays, profiles, attachments, cron check-ins and uptime results from every supported SDK\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-02\",\n      \"statement\": \"Group issues, alert teams (email, Slack, PagerDuty) and create Jira tickets\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-03\",\n      \"statement\": \"CI pipelines upload releases, source maps and debug files for symbolication\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-04\",\n      \"statement\": \"Search issues and build dashboards across errors and performance data\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-05\",\n      \"statement\": \"Engineers sign in through the corporate IdP; teams map to IdP groups\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-06\",\n      \"statement\": \"Workloads in other AWS accounts send events without crossing the internet\",\n      \"source\": \"team-confirmed\"\n    }\n  ],\n  \"non_functional_requirements\": [\n    {\n      \"id\": \"NFR-SCL-01\",\n      \"category\": \"scalability\",\n      \"statement\": \"Absorb incident storms without dropping accepted events\",\n      \"target\": \"5,000 events/s sustained; 25,000 events/s for 30 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-AVL-01\",\n      \"category\": \"availability\",\n      \"statement\": \"Ingest stays up through the loss of one availability zone\",\n      \"target\": \"Ingest 99.95%; UI and API 99.9% monthly\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-DUR-01\",\n      \"category\": \"data\",\n      \"statement\": \"Accepted events are never lost\",\n      \"target\": \"Kafka replication factor 3 with min in-sync replicas 2; producer acks=all\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-01\",\n      \"category\": \"performance\",\n      \"statement\": \"New errors appear as issues quickly\",\n      \"target\": \"p95 under 60 seconds sustained, under 5 minutes during storms\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-02\",\n      \"category\": \"performance\",\n      \"statement\": \"Issue search is interactive\",\n      \"target\": \"p95 under 2 seconds\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-RET-01\",\n      \"category\": \"data\",\n      \"statement\": \"Telemetry expires automatically\",\n      \"target\": \"Errors 90 days; spans, replays and profiles 30 days\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"BB_AWS01471\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-01\",\n      \"category\": \"security\",\n      \"statement\": \"Telemetry and backups stay in EU regions, encrypted with customer-managed keys\",\n      \"target\": \"100% of stores use KMS customer-managed keys; 0 non-EU copies\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"DPE-01\",\n        \"DPE-02\",\n        \"REG-01\",\n        \"DPE-06\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-02\",\n      \"category\": \"security\",\n      \"statement\": \"PII is scrubbed before anything is stored\",\n      \"target\": \"Default and custom scrubbing rules enforced at Relay for 100% of projects\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"LOGP-09\",\n        \"LOGP-10\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-03\",\n      \"category\": \"security\",\n      \"statement\": \"SSO with MFA for everyone; local accounts only for break-glass\",\n      \"target\": \"At most 2 audited break-glass accounts\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-01\",\n      \"category\": \"compliance\",\n      \"statement\": \"Licence terms reviewed and the platform logged as an internal tool\",\n      \"target\": \"Legal approval of FSL-1.1 before go-live\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-NET-01\",\n      \"category\": \"networking\",\n      \"statement\": \"Internal SDK traffic stays private; only browser and mobile telemetry uses a public endpoint\",\n      \"target\": \"100% of internal producers on PrivateLink\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"BB_AWS0206\",\n        \"DPE-05\"\n      ]\n    },\n    {\n      \"id\": \"NFR-OPS-01\",\n      \"category\": \"operations\",\n      \"statement\": \"Kafka consumer lag drives alerting and autoscaling\",\n      \"target\": \"Alert when any consumer group lags more than 5 minutes\",\n      \"source\": \"team-confirmed\",\n      \"policy_refs\": [\n        \"CSPLOG-01\",\n        \"LOGP-01\",\n        \"MON-02\"\n      ]\n    },\n    {\n      \"id\": \"NFR-CST-01\",\n      \"category\": \"cost\",\n      \"statement\": \"Storage cost is controlled with tiering and expiry\",\n      \"target\": \"ClickHouse data older than 7 days moves to S3; cost per million events reported monthly\",\n      \"source\": \"team-confirmed\",\n      \"policy_refs\": [\n        \"TAG-02\"\n      ]\n    },\n    {\n      \"id\": \"NFR-DR-01\",\n      \"category\": \"disaster-recovery\",\n      \"statement\": \"Recover from regional loss using backups held in another EU region\",\n      \"target\": \"RPO 15 minutes for metadata, 24 hours for analytics; RTO 4 hours\",\n      \"source\": \"team-confirmed\",\n      \"policy_refs\": [\n        \"COMP-06\"\n      ]\n    }\n  ],\n  \"policy_conflicts\": [\n    {\n      \"id\": \"CON-01\",\n      \"between\": [\n        \"SIG-03\",\n        \"org policy: prefer managed data services\"\n      ],\n      \"summary\": \"ClickHouse has no AWS-managed equivalent inside the firm's accounts, and the hosted ClickHouse service would move telemetry out of them.\",\n      \"proposed_resolution\": \"Self-manage ClickHouse on EKS with the Altinity operator, S3 tiered storage and automated backups.\",\n      \"needs_exception\": true,\n      \"policy_refs\": [\n        \"COMP-03\"\n      ]\n    },\n    {\n      \"id\": \"CON-02\",\n      \"between\": [\n        \"FR-01\",\n        \"NFR-NET-01\"\n      ],\n      \"summary\": \"Browser and mobile SDKs must reach an internet-facing endpoint.\",\n      \"proposed_resolution\": \"Permitted by company policy: only Relay is exposed, on HTTPS port 443 (BB_AWS0206), and every event is authenticated with a per-project DSN key (DPE-05). Internal producers use PrivateLink.\",\n      \"needs_exception\": false,\n      \"policy_refs\": [\n        \"BB_AWS0206\",\n        \"DPE-05\"\n      ]\n    },\n    {\n      \"id\": \"CON-03\",\n      \"between\": [\n        \"SIG-02\",\n        \"NFR-DUR-01\"\n      ],\n      \"summary\": \"Sentry's producer allows 50 MB messages, which is above common broker defaults.\",\n      \"proposed_resolution\": \"Raise message.max.bytes in the MSK configuration to match, and load-test the largest attachment and replay sizes before go-live.\",\n      \"needs_exception\": false\n    },\n    {\n      \"id\": \"CON-04\",\n      \"between\": [\n        \"FR-02\",\n        \"REG-04\"\n      ],\n      \"summary\": \"Alert email goes through Amazon SES, which is not in the approved service catalog.\",\n      \"proposed_resolution\": \"Request approval to use SES for outbound notification email only (EXC-02).\",\n      \"needs_exception\": true,\n      \"policy_refs\": [\n        \"REG-04\"\n      ]\n    }\n  ],\n  \"open_questions\": [\n    {\n      \"id\": \"Q-01\",\n      \"question\": \"Which teams need session replay, and does replay content need extra masking beyond the SDK defaults?\",\n      \"owner\": \"Privacy office\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-02\",\n      \"question\": \"Should client-side sample rates be enforced centrally through SDK configuration?\",\n      \"owner\": \"Platform engineering\",\n      \"blocking\": false\n    }\n  ],\n  \"scoring\": {\n    \"rubric\": \"Mean of 12 parts: ten NFR categories (1 = numeric target, 0.5 = requirement without one, 0 = none), functional coverage, and conflict resolution; minus 0.05 per blocking open question. See ../README.md.\",\n    \"threshold\": 0.85,\n    \"completeness\": 1.0,\n    \"status\": \"ready-for-design\",\n    \"by_dimension\": {\n      \"security\": 1.0,\n      \"compliance\": 1.0,\n      \"availability\": 1.0,\n      \"disaster-recovery\": 1.0,\n      \"performance\": 1.0,\n      \"scalability\": 1.0,\n      \"operations\": 1.0,\n      \"networking\": 1.0,\n      \"data\": 1.0,\n      \"cost\": 1.0,\n      \"functional\": 1.0,\n      \"conflicts-resolved\": 1.0\n    },\n    \"gaps\": []\n  }\n}", "yaml": "diagram:\n  name: Sentry Observability Platform on AWS\n  direction: left-to-right\n  format: png\n  open: true\n  style:\n    graph:\n      splines: ortho\n      nodesep: 0.7\n      ranksep: 1.3\n      fontsize: 24\n  resources:\n    # Producers and users outside the platform account\n    - id: public_apps\n      name: Web & mobile apps (Sentry SDKs)\n      type: aws.general.MobileClient\n      relates:\n        - to: public_waf\n          direction: outgoing\n          label: Events (HTTPS)\n\n    - id: internal_workloads\n      name: Internal services (other AWS accounts)\n      type: aws.compute.ECS\n      relates:\n        - to: privatelink\n          direction: outgoing\n          label: Events (private)\n\n    - id: engineers\n      name: Engineers\n      type: aws.general.Users\n      relates:\n        - to: internal_alb\n          direction: outgoing\n          label: UI / API\n\n    - id: ci\n      name: CI pipelines\n      type: aws.devtools.Codepipeline\n      relates:\n        - to: internal_alb\n          direction: outgoing\n          label: Releases, source maps, debug files\n\n    - id: idp\n      name: Corporate IdP (SAML)\n      type: aws.security.SingleSignOn\n      relates:\n        - to: web\n          direction: incoming\n          label: SSO\n\n    - id: alert_targets\n      name: Slack, PagerDuty, Jira\n      type: aws.general.InternetAlt1\n\n    # Single region keeps telemetry in one jurisdiction\n    - id: region_primary\n      name: AWS Region (EU) - 3 AZs\n      type: cluster\n      of:\n        - id: edge\n          name: Edge\n          type: cluster\n          of:\n            - id: public_waf\n              name: AWS WAF (rate limits, bot control)\n              type: aws.security.WAF\n              relates:\n                - to: public_alb\n                  direction: outgoing\n            - id: public_alb\n              name: Public ingest ALB\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: relay\n                  direction: outgoing\n            - id: privatelink\n              name: PrivateLink endpoint service (NLB)\n              type: aws.network.Privatelink\n              relates:\n                - to: relay\n                  direction: outgoing\n            - id: internal_alb\n              name: Internal ALB (UI / API)\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: web\n                  direction: outgoing\n\n        - id: ingest_tier\n          name: Ingest - EKS\n          type: cluster\n          of:\n            - id: relay\n              name: Relay fleet (auth, quotas, PII scrubbing)\n              type: k8s.compute.Deployment\n              relates:\n                - to: msk\n                  direction: outgoing\n                  label: ingest-* topics\n                - to: redis\n                  direction: outgoing\n                  label: Quotas, rate limits\n\n        - id: processing_tier\n          name: Processing - EKS (autoscaled on Kafka lag)\n          type: cluster\n          of:\n            - id: ingest_consumers\n              name: Ingest consumers (errors, transactions, spans, monitors)\n              type: k8s.compute.Deployment\n              relates:\n                - to: nodestore\n                  direction: outgoing\n                  label: Raw event payloads\n                - to: aurora\n                  direction: outgoing\n                  label: Issues, groups\n                - to: symbolicator\n                  direction: outgoing\n                  label: Symbolicate\n            - id: snuba_consumers\n              name: Snuba consumers x18\n              type: k8s.compute.Deployment\n              relates:\n                - to: clickhouse\n                  direction: outgoing\n                  label: Batched inserts\n            - id: post_process\n              name: Post-process forwarders\n              type: k8s.compute.Deployment\n              relates:\n                - to: task_workers\n                  direction: outgoing\n                  label: Alerts, workflows\n            - id: task_workers\n              name: Taskbroker + task workers\n              type: k8s.compute.Deployment\n              relates:\n                - to: ses\n                  direction: outgoing\n                  label: Email\n                - to: egress\n                  direction: outgoing\n                  label: Notifications\n            - id: symbolicator\n              name: Symbolicator\n              type: k8s.compute.Deployment\n              relates:\n                - to: files\n                  direction: outgoing\n                  label: Debug files, cache\n            - id: uptime\n              name: Uptime checker + cron monitors\n              type: k8s.compute.Deployment\n\n        - id: query_tier\n          name: Web & query - EKS\n          type: cluster\n          of:\n            - id: web\n              name: Sentry web + API\n              type: k8s.compute.Deployment\n              relates:\n                - to: aurora\n                  direction: outgoing\n                - to: snuba_api\n                  direction: outgoing\n                  label: Search, dashboards\n                - to: memcached\n                  direction: outgoing\n                  label: Page cache\n                - to: files\n                  direction: outgoing\n                  label: Attachments, replays\n                - to: vroom\n                  direction: outgoing\n                  label: Profiles\n            - id: snuba_api\n              name: Snuba API\n              type: k8s.compute.Deployment\n              relates:\n                - to: clickhouse\n                  direction: outgoing\n            - id: vroom\n              name: Vroom (profiling)\n              type: k8s.compute.Deployment\n              relates:\n                - to: files\n                  direction: outgoing\n\n        - id: clickhouse_tier\n          name: ClickHouse - EKS (Altinity operator)\n          type: cluster\n          of:\n            - id: clickhouse\n              name: ClickHouse shards x 2 replicas\n              type: k8s.compute.StatefulSet\n              relates:\n                - to: keeper\n                  direction: outgoing\n                  label: Replication metadata\n                - to: clickhouse_storage\n                  direction: outgoing\n                  label: Cold parts, backups\n            - id: keeper\n              name: ClickHouse Keeper x3\n              type: k8s.compute.StatefulSet\n\n        - id: msk\n          name: Amazon MSK (3 AZs, RF 3)\n          type: aws.analytics.ManagedStreamingForKafka\n          relates:\n            - to: uptime\n              direction: incoming\n              label: Check results\n            - to: ingest_consumers\n              direction: outgoing\n            - to: snuba_consumers\n              direction: outgoing\n              label: Events, spans, outcomes\n            - to: post_process\n              direction: outgoing\n            - to: task_workers\n              direction: outgoing\n              label: Task topics\n\n        - id: data\n          name: Data - private subnets\n          type: cluster\n          of:\n            - id: aurora\n              name: Aurora PostgreSQL + RDS Proxy\n              type: aws.database.Aurora\n              relates:\n                - to: backup\n                  direction: outgoing\n                  label: PITR snapshots\n            - id: redis\n              name: ElastiCache Redis (quotas, buffers, digests)\n              type: aws.database.ElastiCache\n            - id: memcached\n              name: ElastiCache Memcached\n              type: aws.database.ElastiCache\n            - id: nodestore\n              name: S3 nodestore (90-day lifecycle)\n              type: aws.storage.SimpleStorageServiceS3Bucket\n            - id: files\n              name: S3 files (attachments, replays, profiles, debug files)\n              type: aws.storage.SimpleStorageServiceS3Bucket\n            - id: clickhouse_storage\n              name: S3 ClickHouse cold tier + backups\n              type: aws.storage.SimpleStorageServiceS3BucketWithObjects\n              relates:\n                - to: dr_backups\n                  direction: outgoing\n                  label: Cross-region copy\n\n        - id: operations\n          name: Security & operations\n          type: cluster\n          of:\n            - id: kms\n              name: KMS keys + Secrets Manager\n              type: aws.security.KMS\n            - id: monitoring\n              name: CloudWatch (Container Insights, consumer-lag alarms)\n              type: aws.management.Cloudwatch\n            - id: backup\n              name: AWS Backup\n              type: aws.storage.Backup\n              relates:\n                - to: dr_backups\n                  direction: outgoing\n                  label: Vault copy\n            - id: ses\n              name: Amazon SES\n              type: aws.engagement.SimpleEmailServiceSes\n\n        - id: egress\n          name: Egress - Network Firewall allowlist + NAT\n          type: aws.network.NATGateway\n          relates:\n            - to: alert_targets\n              direction: outgoing\n\n    # Backups stay in the same jurisdiction\n    - id: region_backup\n      name: AWS Region (EU) - backup copies\n      type: cluster\n      of:\n        - id: dr_backups\n          name: Backup vault + S3 replica\n          type: aws.storage.Backup", "summaryHtml": "<h2>Overview<\/h2>\n<p>An engineering organisation with 3,000 engineers and 2,500 projects wants Sentry for errors, tracing, replays and profiling. The telemetry carries customer data and source context, so it must stay in the firm's own AWS accounts and in EU regions. Sentry's self-hosted package is a single-host Docker Compose stack of 53 services, and upstream describes it as suited to &quot;low-volume deployments and proofs-of-concept&quot;. This design turns that topology into a production platform that absorbs 25,000 events per second during incident storms without losing accepted events.<\/p>\n<p>The design follows the stack's own data path: Relay authenticates and scrubs events at the edge, Kafka buffers everything, and consumers fan the data out to ClickHouse for search, S3 for raw payloads and files, and PostgreSQL for issue metadata.<\/p>\n<h2>Scope and assumptions<\/h2>\n<ul>\n<li>5,000 events per second sustained, 25,000 per second for up to 30 minutes, and about 2 TB per month of attachments, replays and profiles.<\/li>\n<li>One EU region in production; backups are copied to a second EU region.<\/li>\n<li>Single-organisation install (<code>SENTRY_SINGLE_ORGANIZATION<\/code>), with teams mapped from the corporate IdP.<\/li>\n<li>SaaS-only Sentry features and multi-region active-active operation are out of scope.<\/li>\n<\/ul>\n<h2>Architecture at a glance<\/h2>\n<ul>\n<li><strong>Edge:<\/strong> a public ALB behind AWS WAF for browser and mobile SDKs; a PrivateLink endpoint service for workloads in other AWS accounts; an internal ALB for the UI, API and CI uploads.<\/li>\n<li><strong>Ingest (EKS):<\/strong> the Relay fleet authenticates DSNs, enforces quotas and rate limits in Redis, scrubs PII and writes to Kafka.<\/li>\n<li><strong>Streaming:<\/strong> Amazon MSK across three AZs (replication factor 3) carries ingest, Snuba and task topics.<\/li>\n<li><strong>Processing (EKS):<\/strong> ingest consumers, 18 Snuba consumers, post-process forwarders, the taskbroker and task workers, Symbolicator, and the uptime and cron monitors. All of them scale on Kafka lag.<\/li>\n<li><strong>Web and query (EKS):<\/strong> the Sentry web app and API, the Snuba query API and Vroom for profiles.<\/li>\n<li><strong>ClickHouse (EKS):<\/strong> shards with two replicas each, three ClickHouse Keeper nodes, and S3 for cold parts and backups.<\/li>\n<li><strong>Data:<\/strong> Aurora PostgreSQL behind RDS Proxy, ElastiCache for Redis and Memcached, and S3 for the nodestore and files.<\/li>\n<li><strong>Operations:<\/strong> KMS and Secrets Manager, CloudWatch with consumer-lag alarms, AWS Backup, Amazon SES, and egress through Network Firewall to Slack, PagerDuty and Jira.<\/li>\n<\/ul>\n<h2>Key decisions<\/h2>\n<p>&quot;Grounded in&quot; lists the company policy rules each decision follows, by their ID in <code>policy_rule.md<\/code>: company rules (for example <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a>), approved services (<code>svc:…<\/code>) and AWS selection guidance (<code>guidance:…<\/code>). &quot;Signals&quot; lists what the code scan found.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Decision<\/th>\n<th>Satisfies<\/th>\n<th>Grounded in (policy)<\/th>\n<th>Signals<\/th>\n<th>Alternatives considered<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D1<\/td>\n<td>Run the services on Amazon EKS, with Karpenter for nodes and KEDA scaling consumers on Kafka lag<\/td>\n<td>NFR-SCL-01, NFR-OPS-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:containers:amazon-elastic-kubernetes-service\">svc:<wbr>containers:<wbr>amazon-<wbr>elastic-<wbr>kubernetes-<wbr>service<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:containers:orchestration\">guidance:<wbr>containers:<wbr>orchestration<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-01\">COMP-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-05\">COMP-<wbr>05<\/a><\/td>\n<td>SIG-01<\/td>\n<td>ECS on Fargate handles the stateless services well, but ClickHouse needs StatefulSets and the operator. One platform is simpler to run.<\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>Two ingest paths: a public ALB with AWS WAF for browser and mobile SDKs, and a PrivateLink endpoint service for internal producers<\/td>\n<td>FR-06, NFR-NET-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0206\">BB_AWS0206<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-05\">DPE-<wbr>05<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-waf\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>waf<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:networking-and-content-delivery:aws-privatelink\">svc:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>aws-<wbr>privatelink<\/a><\/td>\n<td>CON-02<\/td>\n<td>Route all traffic over the internet (rejected by policy)<\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>Relay as the only writer to Kafka, enforcing DSN auth, quotas and PII scrubbing before data is stored<\/td>\n<td>NFR-SEC-02, NFR-SCL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"LOGP-09\">LOGP-<wbr>09<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"LOGP-10\">LOGP-<wbr>10<\/a><\/td>\n<td>Relay component; SIG-07<\/td>\n<td>Scrubbing after storage would mean PII lands on disk first<\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>Amazon MSK provisioned across three AZs: replication factor 3, min in-sync replicas 2, producer acks=all, message size raised to match Sentry's 50 MB setting<\/td>\n<td>NFR-DUR-01, NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:analytics:amazon-managed-streaming-for-apache-kafka-amazon-msk\">svc:<wbr>analytics:<wbr>amazon-<wbr>managed-<wbr>streaming-<wbr>for-<wbr>apache-<wbr>kafka-<wbr>amazon-<wbr>msk<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:analytics:apache-kafka-processing-of-streaming-data\">guidance:<wbr>analytics:<wbr>apache-<wbr>kafka-<wbr>processing-<wbr>of-<wbr>streaming-<wbr>data<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-03\">DPE-<wbr>03<\/a><\/td>\n<td>SIG-02, CON-03<\/td>\n<td>Self-managed Kafka on EKS (more to operate, and firm policy prefers managed)<\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>Self-managed ClickHouse on EKS with the Altinity operator: shards with two replicas across AZs, three Keeper nodes, data older than 7 days moved to S3, TTL-based retention Self-managed, so it needs exception EXC-01.<\/td>\n<td>NFR-PRF-02, NFR-RET-01, NFR-CST-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:containers:amazon-elastic-kubernetes-service\">svc:<wbr>containers:<wbr>amazon-<wbr>elastic-<wbr>kubernetes-<wbr>service<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:storage:amazon-simple-storage-service\">svc:<wbr>storage:<wbr>amazon-<wbr>simple-<wbr>storage-<wbr>service<\/a><\/td>\n<td>SIG-03, CON-01<\/td>\n<td>Hosted ClickHouse service (telemetry would leave the firm's accounts); EC2 without an operator (more manual work)<\/td>\n<\/tr>\n<tr>\n<td>D6<\/td>\n<td>Aurora PostgreSQL (Multi-AZ, Graviton) behind RDS Proxy instead of PgBouncer<\/td>\n<td>NFR-AVL-01, NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-aurora\">svc:<wbr>databases:<wbr>amazon-<wbr>aurora<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:relational\">guidance:<wbr>databases:<wbr>relational<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0204\">BB_AWS0204<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a><\/td>\n<td>SIG-04<\/td>\n<td>Self-managed PostgreSQL on EKS<\/td>\n<\/tr>\n<tr>\n<td>D7<\/td>\n<td>Raw event payloads (nodestore) and all files (attachments, replays, profiles, debug files) in S3, with lifecycle expiry at 90 and 30 days<\/td>\n<td>NFR-RET-01, NFR-CST-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:storage:amazon-simple-storage-service\">svc:<wbr>storage:<wbr>amazon-<wbr>simple-<wbr>storage-<wbr>service<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:storage:object\">guidance:<wbr>storage:<wbr>object<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS01471\">BB_AWS01471<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0155\">BB_AWS0155<\/a><\/td>\n<td>SIG-05, SIG-06, SIG-09<\/td>\n<td>Nodestore in PostgreSQL, which upstream moved away from because it did not scale<\/td>\n<\/tr>\n<tr>\n<td>D8<\/td>\n<td>ElastiCache for Redis OSS (Multi-AZ) for quotas, rate limits, buffers and digests; ElastiCache for Memcached for the Django cache<\/td>\n<td>NFR-PRF-01, NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-elasticache\">svc:<wbr>databases:<wbr>amazon-<wbr>elasticache<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:in-memory\">guidance:<wbr>databases:<wbr>in-<wbr>memory<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-03\">DPE-<wbr>03<\/a><\/td>\n<td>SIG-07, SIG-08<\/td>\n<td>A single Redis for everything, which mixes cache evictions with quota state<\/td>\n<\/tr>\n<tr>\n<td>D9<\/td>\n<td>The Kafka-backed taskbroker and task workers handle background work, with no separate message broker<\/td>\n<td>NFR-SCL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:analytics:amazon-managed-streaming-for-apache-kafka-amazon-msk\">svc:<wbr>analytics:<wbr>amazon-<wbr>managed-<wbr>streaming-<wbr>for-<wbr>apache-<wbr>kafka-<wbr>amazon-<wbr>msk<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:application-integration:streaming\">guidance:<wbr>application-<wbr>integration:<wbr>streaming<\/a><\/td>\n<td>SIG-10<\/td>\n<td>Celery with RabbitMQ (no longer the upstream path)<\/td>\n<\/tr>\n<tr>\n<td>D10<\/td>\n<td>SAML SSO with the corporate IdP; email through Amazon SES; Slack, PagerDuty and Jira reached only through the Network Firewall allowlist Amazon SES is not in the approved service catalog, so it needs exception EXC-02.<\/td>\n<td>FR-02, FR-05, NFR-SEC-03<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-03\">REG-<wbr>03<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-network-firewall\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>network-<wbr>firewall<\/a><\/td>\n<td>SIG-12, SIG-14<\/td>\n<td>Local accounts and open egress<\/td>\n<\/tr>\n<tr>\n<td>D11<\/td>\n<td>All stores encrypted with customer-managed KMS keys; one production region; backups copied only to another EU region<\/td>\n<td>NFR-SEC-01, NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-02\">DPE-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-01\">REG-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-06\">DPE-<wbr>06<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-06\">COMP-<wbr>06<\/a><\/td>\n<td>Scenario<\/td>\n<td>Cross-region replicas of live data (more cost, with no matching RTO need)<\/td>\n<\/tr>\n<tr>\n<td>D12<\/td>\n<td>Platform self-monitoring: CloudWatch Container Insights, MSK consumer-lag alarms, StatsD metrics through the CloudWatch agent<\/td>\n<td>NFR-OPS-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"CSPLOG-01\">CSPLOG-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"CSPLOG-02\">CSPLOG-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"LOGP-01\">LOGP-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"MON-02\">MON-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"WLOG-01\">WLOG-<wbr>01<\/a><\/td>\n<td>SIG-13<\/td>\n<td>Monitoring Sentry with Sentry (it fails at the same moment)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>How an event flows<\/h2>\n<ol>\n<li>An SDK sends an event to Relay, either over the public endpoint behind WAF or privately over PrivateLink.<\/li>\n<li>Relay checks the DSN and project quotas in Redis, scrubs PII, and writes the event to an <code>ingest-*<\/code> topic on MSK.<\/li>\n<li>Ingest consumers process the event, call Symbolicator when stack traces need symbols, store the raw payload in the S3 nodestore, and update issues and groups in Aurora.<\/li>\n<li>Snuba consumers batch the processed events into ClickHouse. Post-process forwarders trigger alert rules, and task workers send email through SES and notifications through the egress firewall.<\/li>\n<li>Engineers search and build dashboards through the web app. Its queries go through the Snuba API to ClickHouse, and attachments, replays and profiles come from S3.<\/li>\n<\/ol>\n<h2>Well-Architected review<\/h2>\n<ul>\n<li><strong>Security:<\/strong> PII is scrubbed at the edge, before storage. Internal producers use PrivateLink. WAF rate limits protect the public endpoint, every store uses customer-managed keys, sign-in is SSO-only, and egress goes through an allowlist.<\/li>\n<li><strong>Reliability:<\/strong> Kafka absorbs storms (replication factor 3, acks=all). Every tier spans three AZs, consumers catch up from Kafka after failures, and backups are copied to a second EU region.<\/li>\n<li><strong>Performance efficiency:<\/strong> consumers scale on lag; ClickHouse serves search and dashboards; Relay rejects over-quota traffic before it costs anything downstream.<\/li>\n<li><strong>Cost optimisation:<\/strong> S3 tiering for ClickHouse, lifecycle expiry on every bucket, Graviton nodes, and Karpenter consolidation after storms.<\/li>\n<li><strong>Operational excellence:<\/strong> lag-based SLOs and alarms, everything defined as code, and a monthly upgrade cadence that follows self-hosted releases.<\/li>\n<li><strong>Sustainability:<\/strong> scale-to-demand consumers and cold-tier storage.<\/li>\n<\/ul>\n<h2>Policy check and exceptions requested<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Request<\/th>\n<th>Policy<\/th>\n<th>Why<\/th>\n<th>Compensating controls<\/th>\n<th>Approvers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EXC-01<\/td>\n<td>Operate self-managed ClickHouse<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>No managed option inside the firm's accounts (CON-01)<\/td>\n<td>Altinity operator, replicas across AZs, nightly backups to S3 with cross-region copy, restore tested quarterly, on-call runbooks<\/td>\n<td>Platform engineering lead, CGC<\/td>\n<\/tr>\n<tr>\n<td>EXC-02<\/td>\n<td>Use Amazon SES for alert email<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-04\">REG-<wbr>04<\/a><\/td>\n<td>SES is not in the approved service catalog, and accounts are restricted to approved services<\/td>\n<td>Outbound notification email only, from one verified domain with SPF and DKIM; no inbound mail; sending limited to the alerts identity<\/td>\n<td>Platform engineering lead, CGC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The public ingest endpoint needs no exception: company policy allows ports 80 and 443 from the internet (<a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0206\">BB_AWS0206<\/a>) and requires authentication before data is reachable (<a href=\"#\" class=\"pol\" data-policy=\"DPE-05\">DPE-<wbr>05<\/a>). Relay serves HTTPS on 443 and authenticates every event with a per-project DSN key.<\/p>\n<p>The FSL-1.1 licence permits internal use. Legal sign-off is tracked as NFR-CMP-01 rather than as an exception.<\/p>\n<h2>Risks and open items<\/h2>\n<ul>\n<li>Upstream ships monthly, and self-hosted upgrades include database migrations. Rehearse each upgrade in a staging environment with production-like data volumes.<\/li>\n<li>ClickHouse operations need specialist skills (EXC-01).<\/li>\n<li>Brokers must accept 50 MB messages. Load-test the largest replays and attachments before go-live (CON-03).<\/li>\n<li>Open questions: replay masking (Q-01) and centrally enforced sample rates (Q-02).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>getsentry/self-hosted at commit <code>d09ff0cd592f<\/code>: <a href=\"https://github.com/getsentry/self-hosted/blob/master/docker-compose.yml\" target=\"_blank\" rel=\"noopener\">docker-compose.yml<\/a>, <a href=\"https://github.com/getsentry/self-hosted/blob/master/sentry/sentry.conf.example.py\" target=\"_blank\" rel=\"noopener\">sentry.conf.example.py<\/a>, <a href=\"https://github.com/getsentry/self-hosted/blob/master/sentry/config.example.yml\" target=\"_blank\" rel=\"noopener\">config.example.yml<\/a>, <a href=\"https://github.com/getsentry/self-hosted/blob/master/LICENSE.md\" target=\"_blank\" rel=\"noopener\">LICENSE.md<\/a><\/li>\n<li>Components: <a href=\"https://github.com/getsentry/relay\" target=\"_blank\" rel=\"noopener\">relay<\/a>, <a href=\"https://github.com/getsentry/sentry\" target=\"_blank\" rel=\"noopener\">sentry<\/a>, <a href=\"https://github.com/getsentry/snuba\" target=\"_blank\" rel=\"noopener\">snuba<\/a>, <a href=\"https://github.com/getsentry/symbolicator\" target=\"_blank\" rel=\"noopener\">symbolicator<\/a>, <a href=\"https://github.com/getsentry/vroom\" target=\"_blank\" rel=\"noopener\">vroom<\/a>, <a href=\"https://github.com/getsentry/taskbroker\" target=\"_blank\" rel=\"noopener\">taskbroker<\/a>, <a href=\"https://github.com/getsentry/uptime-checker\" target=\"_blank\" rel=\"noopener\">uptime-checker<\/a><\/li>\n<li><a href=\"https://develop.sentry.dev/backend/application-domains/nodestore/\" target=\"_blank\" rel=\"noopener\">Sentry developer docs: nodestore<\/a><\/li>\n<li>Company policy: <code>policy_rule.md<\/code> from the policy engine (company paved-path document, AWS service catalog, AWS decision guides)<\/li>\n<\/ul>\n", "png": "samples/sentry_observability_platform_on_aws/sentry_observability_platform_on_aws.png", "stats": {"signals": 15, "frs": 6, "nfrs": 14, "conflicts": 4, "completeness": 1.0, "threshold": 0.85, "decisions": 12, "nodes": 35, "clusters": 9}}, {"short": "Dify", "title": "Dify AI agent platform on AWS", "source": "langgenius/dify @ 6d14cd5", "sourceUrl": "https://github.com/langgenius/dify/tree/6d14cd5861320877ee25fb4c63609f25a65c4dba", "alt": "Architecture diagram: employees reach Dify on ECS Fargate through Direct Connect, AWS WAF and an internal load balancer. The API uses Aurora PostgreSQL with pgvector, Valkey, S3 and Amazon Bedrock over VPC endpoints. The code sandbox runs in an isolated subnet, all egress passes through an SSRF proxy and Network Firewall, and audit logs land in an S3 Object Lock bucket.", "folder": "samples/dify_ai_agent_platform_on_aws", "linkFiles": true, "files": {"req": "requirements.json", "sum": "architecture_summary.md", "yaml": "dify_ai_agent_platform_on_aws.yaml", "diag": "dify_ai_agent_platform_on_aws.png"
