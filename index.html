NDPOINT http://localhost:8194; storageBucket.grantReadWrite(taskRole))\",\n        \"implies\": \"User code shares the API's network namespace and credentials unless it is split out\"\n      },\n      {\n        \"id\": \"SIG-11\",\n        \"signal\": \"Licence conditions: operating multiple workspaces (tenants) or removing the console logo needs a commercial licence\",\n        \"evidence\": \"LICENSE: conditions 1a and 1b\",\n        \"implies\": \"Per-team workspaces require Dify Enterprise\"\n      },\n      {\n        \"id\": \"SIG-12\",\n        \"signal\": \"Single sign-on is an Enterprise Edition feature\",\n        \"evidence\": \"Dify Enterprise docs: SSO authentication\",\n        \"implies\": \"Community Edition cannot meet an SSO mandate on its own\"\n      }\n    ]\n  },\n  \"scenario\": {\n    \"summary\": \"A firm wants an internal platform where teams build chat assistants, RAG apps, workflows and agents over internal documents. All model inference must go through Amazon Bedrock in-region; every prompt, response and tool call is audited.\",\n    \"assumptions\": [\n      \"5,000 employees and 800 peak concurrent sessions\",\n      \"About 200 published apps and 40 team workspaces\",\n      \"Knowledge bases of up to 2 million chunks in total\",\n      \"Access only from the corporate network; no public endpoint\"\n    ],\n    \"out_of_scope\": [\n      \"Fine-tuning or hosting self-managed models\",\n      \"Customer-facing apps on the public internet\"\n    ]\n  },\n  \"functional_requirements\": [\n    {\n      \"id\": \"FR-01\",\n      \"statement\": \"Teams build chat apps, workflows and agents with retrieval over internal documents\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-02\",\n      \"statement\": \"Employees use published apps in the web UI; internal services call them through app API keys\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-03\",\n      \"statement\": \"Each team gets its own workspace with separate apps, knowledge bases and usage reporting\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-04\",\n      \"statement\": \"Workflows can run code and call HTTP tools\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-05\",\n      \"statement\": \"Only security-reviewed plugins and tools are available\",\n      \"source\": \"org-policy\"\n    }\n  ],\n  \"non_functional_requirements\": [\n    {\n      \"id\": \"NFR-SEC-01\",\n      \"category\": \"security\",\n      \"statement\": \"Models come only from Amazon Bedrock in the approved region; no traffic to other LLM APIs\",\n      \"target\": \"100% of model calls through Bedrock VPC endpoints; other model providers disabled\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"REG-04\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-02\",\n      \"category\": \"security\",\n      \"statement\": \"Single sign-on with MFA for every user, and prompt deprovisioning\",\n      \"target\": \"Access removed within 1 hour of leaving\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-03\",\n      \"category\": \"security\",\n      \"statement\": \"Untrusted code runs with no credentials, no direct network access and resource limits\",\n      \"target\": \"0 IAM permissions in the sandbox task; 15-second execution limit\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"IAM-05\"\n      ]\n    },\n    {\n      \"id\": \"NFR-SEC-04\",\n      \"category\": \"security\",\n      \"statement\": \"Prompts and responses are screened for PII and harmful content\",\n      \"target\": \"Bedrock Guardrails on 100% of production apps\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-01\",\n      \"category\": \"compliance\",\n      \"statement\": \"Prompts, responses, tool calls and user identity are retained for audit and cannot be altered\",\n      \"target\": \"1-year retention in WORM storage\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"LOGP-05\",\n        \"LOGP-01\"\n      ]\n    },\n    {\n      \"id\": \"NFR-NET-01\",\n      \"category\": \"networking\",\n      \"statement\": \"All outbound HTTP from the platform goes through an allowlisting proxy that blocks internal and metadata addresses\",\n      \"target\": \"0 direct egress paths from application tasks\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"REG-03\"\n      ]\n    },\n    {\n      \"id\": \"NFR-DAT-01\",\n      \"category\": \"data\",\n      \"statement\": \"Documents, embeddings and conversations stay in the region, encrypted with customer-managed keys\",\n      \"target\": \"100% of stores use KMS customer-managed keys\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"DPE-01\",\n        \"DPE-06\"\n      ]\n    },\n    {\n      \"id\": \"NFR-AVL-01\",\n      \"category\": \"availability\",\n      \"statement\": \"The platform survives the loss of one availability zone\",\n      \"target\": \"99.9% monthly availability\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-01\",\n      \"category\": \"performance\",\n      \"statement\": \"Platform overhead stays small compared with model latency\",\n      \"target\": \"p95 platform overhead under 300 ms, excluding model inference\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-SCL-01\",\n      \"category\": \"scalability\",\n      \"statement\": \"Serve peak load and large knowledge bases\",\n      \"target\": \"800 concurrent sessions; 50 requests per second; 2 million chunks\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-OPS-01\",\n      \"category\": \"operations\",\n      \"statement\": \"Queue depth and task failures are monitored and alerted\",\n      \"target\": \"Alert when the Celery queue backlog exceeds 5 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-CST-01\",\n      \"category\": \"cost\",\n      \"statement\": \"Model spend is attributed to each team, with budgets\",\n      \"target\": \"Monthly Bedrock cost per workspace; alert at 80% of budget\",\n      \"source\": \"org-policy\",\n      \"policy_refs\": [\n        \"TAG-02\"\n      ]\n    },\n    {\n      \"id\": \"NFR-DR-01\",\n      \"category\": \"disaster-recovery\",\n      \"statement\": \"Recover the platform in a second region from backups\",\n      \"target\": \"RPO 15 minutes; RTO 4 hours\",\n      \"source\": \"team-confirmed\",\n      \"policy_refs\": [\n        \"COMP-06\"\n      ]\n    }\n  ],\n  \"policy_conflicts\": [\n    {\n      \"id\": \"CON-01\",\n      \"between\": [\n        \"NFR-SEC-02\",\n        \"FR-03\",\n        \"SIG-11\",\n        \"SIG-12\"\n      ],\n      \"summary\": \"SSO and per-team workspaces are required, but SSO is Enterprise-only and multi-workspace operation needs a commercial licence.\",\n      \"proposed_resolution\": \"License Dify Enterprise for SSO and multiple workspaces, subject to vendor risk assessment.\",\n      \"needs_exception\": true\n    },\n    {\n      \"id\": \"CON-02\",\n      \"between\": [\n        \"FR-04\",\n        \"NFR-SEC-03\",\n        \"SIG-10\"\n      ],\n      \"summary\": \"Workflows run user-supplied code. In the AWS sample that code shares the API task's network namespace and IAM role.\",\n      \"proposed_resolution\": \"Run the sandbox as its own service in an isolated subnet with no task role; its only route out is the SSRF proxy.\",\n      \"needs_exception\": true,\n      \"policy_refs\": [\n        \"IAM-05\"\n      ]\n    },\n    {\n      \"id\": \"CON-03\",\n      \"between\": [\n        \"SIG-08\",\n        \"NFR-SEC-03\"\n      ],\n      \"summary\": \"The agent backend's local shell sandbox gives agents a general-purpose shell.\",\n      \"proposed_resolution\": \"Leave the agent backend off at launch, and enable it after a dedicated security review.\",\n      \"needs_exception\": false\n    },\n    {\n      \"id\": \"CON-04\",\n      \"between\": [\n        \"FR-02\",\n        \"REG-04\"\n      ],\n      \"summary\": \"Platform email goes through Amazon SES, which is not in the approved service catalog.\",\n      \"proposed_resolution\": \"Request approval to use SES for outbound email only (EXC-03).\",\n      \"needs_exception\": true,\n      \"policy_refs\": [\n        \"REG-04\"\n      ]\n    }\n  ],\n  \"open_questions\": [\n    {\n      \"id\": \"Q-01\",\n      \"question\": \"Do knowledge bases need per-document access control that mirrors the source systems?\",\n      \"owner\": \"Data governance\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-02\",\n      \"question\": \"Which external APIs belong on the egress allowlist for tools?\",\n      \"owner\": \"Security\",\n      \"blocking\": false\n    }\n  ],\n  \"scoring\": {\n    \"rubric\": \"Mean of 12 parts: ten NFR categories (1 = numeric target, 0.5 = requirement without one, 0 = none), functional coverage, and conflict resolution; minus 0.05 per blocking open question. See ../README.md.\",\n    \"threshold\": 0.85,\n    \"completeness\": 1.0,\n    \"status\": \"ready-for-design\",\n    \"by_dimension\": {\n      \"security\": 1.0,\n      \"compliance\": 1.0,\n      \"availability\": 1.0,\n      \"disaster-recovery\": 1.0,\n      \"performance\": 1.0,\n      \"scalability\": 1.0,\n      \"operations\": 1.0,\n      \"networking\": 1.0,\n      \"data\": 1.0,\n      \"cost\": 1.0,\n      \"functional\": 1.0,\n      \"conflicts-resolved\": 1.0\n    },\n    \"gaps\": []\n  }\n}", "yaml": "diagram:\n  name: Dify AI Agent Platform on AWS\n  direction: left-to-right\n  format: png\n  open: true\n  style:\n    graph:\n      splines: ortho\n      nodesep: 0.7\n      ranksep: 1.3\n      fontsize: 24\n  resources:\n    # People and systems outside the platform account\n    - id: employees\n      name: Employees (corporate network)\n      type: aws.general.Users\n      relates:\n        - to: corporate_link\n          direction: outgoing\n\n    - id: internal_apps\n      name: Internal apps (app API keys)\n      type: aws.general.Client\n      relates:\n        - to: corporate_link\n          direction: outgoing\n\n    - id: idp\n      name: Corporate IdP (SAML / OIDC)\n      type: aws.security.SingleSignOn\n      relates:\n        - to: api\n          direction: incoming\n          label: SSO (Dify Enterprise)\n\n    - id: external_apis\n      name: Allowlisted external APIs\n      type: aws.general.InternetAlt1\n\n    - id: corporate_link\n      name: Direct Connect / VPN\n      type: aws.network.DirectConnect\n      relates:\n        - to: waf\n          direction: outgoing\n\n    - id: region_primary\n      name: AWS Region - 3 AZs\n      type: cluster\n      of:\n        - id: edge\n          name: Private edge\n          type: cluster\n          of:\n            - id: waf\n              name: AWS WAF\n              type: aws.security.WAF\n              relates:\n                - to: alb\n                  direction: outgoing\n            - id: alb\n              name: Internal ALB (TLS)\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: web\n                  direction: outgoing\n                  label: Console UI\n                - to: api\n                  direction: outgoing\n                  label: API + streaming\n\n        - id: ecs\n          name: Amazon ECS on Fargate - private subnets\n          type: cluster\n          of:\n            - id: web\n              name: Web (Next.js)\n              type: aws.compute.ElasticContainerServiceService\n            - id: api\n              name: API + websocket\n              type: aws.compute.ElasticContainerServiceService\n              relates:\n                - to: aurora_app\n                  direction: outgoing\n                  label: Apps, conversations\n                - to: aurora_vectors\n                  direction: outgoing\n                  label: Retrieval\n                - to: valkey\n                  direction: outgoing\n                  label: Cache, task queue\n                - to: files\n                  direction: outgoing\n                - to: plugin_daemon\n                  direction: outgoing\n                  label: Tools, model providers\n                - to: sandbox\n                  direction: outgoing\n                  label: Run user code\n                - to: vpc_endpoints\n                  direction: outgoing\n                  label: Model calls\n                - to: ssrf_proxy\n                  direction: outgoing\n                  label: HTTP tool calls\n            - id: worker\n              name: Celery workers (indexing, workflows)\n              type: aws.compute.ElasticContainerServiceService\n              relates:\n                - to: aurora_vectors\n                  direction: outgoing\n                  label: Index chunks\n                - to: valkey\n                  direction: outgoing\n                  label: Broker\n                - to: files\n                  direction: outgoing\n                  label: Documents\n                - to: vpc_endpoints\n                  direction: outgoing\n                  label: Embeddings\n                - to: audit_bucket\n                  direction: outgoing\n                  label: Conversation export\n                - to: ses\n                  direction: outgoing\n                  label: Email\n            - id: beat\n              name: Celery beat (schedules)\n              type: aws.compute.ElasticContainerServiceService\n              relates:\n                - to: valkey\n                  direction: outgoing\n            - id: plugin_daemon\n              name: Plugin daemon (allowlisted plugins)\n              type: aws.compute.ElasticContainerServiceService\n              relates:\n                - to: ssrf_proxy\n                  direction: outgoing\n\n        - id: isolated\n          name: Isolated subnet - no task role, no direct egress\n          type: cluster\n          of:\n            - id: sandbox\n              name: DifySandbox (code execution)\n              type: aws.compute.Fargate\n              relates:\n                - to: ssrf_proxy\n                  direction: outgoing\n\n        - id: egress_control\n          name: Egress control\n          type: cluster\n          of:\n            - id: ssrf_proxy\n              name: SSRF proxy (Squid)\n              type: aws.compute.ElasticContainerServiceService\n              relates:\n                - to: egress\n                  direction: outgoing\n            - id: egress\n              name: Network Firewall allowlist + NAT\n              type: aws.network.NATGateway\n              relates:\n                - to: external_apis\n                  direction: outgoing\n\n        - id: models\n          name: Amazon Bedrock over PrivateLink\n          type: cluster\n          of:\n            - id: vpc_endpoints\n              name: VPC interface endpoints\n              type: aws.network.Endpoint\n              relates:\n                - to: bedrock\n                  direction: outgoing\n            - id: bedrock\n              name: Amazon Bedrock (models, embeddings, Guardrails)\n              type: aws.ml.MachineLearning\n              relates:\n                - to: audit_bucket\n                  direction: outgoing\n                  label: Invocation logs\n\n        - id: data\n          name: Data - private subnets\n          type: cluster\n          of:\n            - id: aurora_app\n              name: Aurora PostgreSQL (app + plugin metadata)\n              type: aws.database.Aurora\n              relates:\n                - to: backups\n                  direction: outgoing\n                  label: Snapshot copy\n            - id: aurora_vectors\n              name: Aurora PostgreSQL + pgvector (knowledge bases)\n              type: aws.database.Aurora\n            - id: valkey\n              name: ElastiCache Valkey (Multi-AZ, TLS)\n              type: aws.database.ElastiCache\n            - id: files\n              name: S3 (uploads, knowledge files, plugin packages)\n              type: aws.storage.SimpleStorageServiceS3Bucket\n              relates:\n                - to: backups\n                  direction: outgoing\n                  label: Replication\n\n        - id: governance\n          name: Governance & operations\n          type: cluster\n          of:\n            - id: audit_bucket\n              name: S3 AI audit log (Object Lock, 1 year)\n              type: aws.storage.SimpleStorageServiceS3BucketWithObjects\n            - id: athena\n              name: Athena (audit queries)\n              type: aws.analytics.Athena\n              relates:\n                - to: audit_bucket\n                  direction: outgoing\n            - id: monitoring\n              name: CloudWatch (Container Insights, queue-depth alarms)\n              type: aws.management.Cloudwatch\n            - id: kms\n              name: KMS keys + Secrets Manager\n              type: aws.security.KMS\n            - id: ses\n              name: Amazon SES\n              type: aws.engagement.SimpleEmailServiceSes\n\n    - id: region_backup\n      name: AWS Region B - backups\n      type: cluster\n      of:\n        - id: backups\n          name: Aurora snapshot copies + S3 replica\n          type: aws.storage.Backup", "summaryHtml": "<h2>Overview<\/h2>\n<p>The firm wants one internal platform where teams build chat assistants, RAG apps, workflows and agents over internal documents. Every model call must go through Amazon Bedrock in-region, and every prompt, response and tool call is kept for audit. Dify provides the builder experience. AWS publishes a CDK deployment of Dify that is a good starting point, but it is sized for a small team and keeps convenience defaults that an enterprise cannot accept.<\/p>\n<p>This design keeps the sample's shape (ECS on Fargate, Aurora with pgvector, Valkey, S3, Bedrock over VPC endpoints) and changes four things. It isolates the code sandbox from the API's credentials. It forces every outbound request through two layers of egress control. It adds a write-once audit trail. And it settles the licensing question that SSO and per-team workspaces raise.<\/p>\n<h2>Scope and assumptions<\/h2>\n<ul>\n<li>5,000 employees, 800 peak concurrent sessions, about 200 published apps in 40 team workspaces.<\/li>\n<li>Knowledge bases total up to 2 million chunks.<\/li>\n<li>Access only from the corporate network; no public endpoint.<\/li>\n<li>Fine-tuning, self-hosted models and customer-facing apps are out of scope.<\/li>\n<\/ul>\n<h2>Architecture at a glance<\/h2>\n<ul>\n<li><strong>Private edge:<\/strong> Direct Connect or VPN from the corporate network, AWS WAF, and an internal ALB with TLS.<\/li>\n<li><strong>Application (ECS on Fargate):<\/strong> web (Next.js), API with websocket streaming, Celery workers and beat, and the plugin daemon.<\/li>\n<li><strong>Isolated subnet:<\/strong> the DifySandbox service, with no IAM role and no direct egress.<\/li>\n<li><strong>Egress control:<\/strong> the Squid SSRF proxy, then AWS Network Firewall with a domain allowlist, then NAT.<\/li>\n<li><strong>Models:<\/strong> Amazon Bedrock (LLMs, embeddings, Guardrails) through VPC interface endpoints.<\/li>\n<li><strong>Data:<\/strong> Aurora PostgreSQL for app and plugin metadata, a separate Aurora cluster with pgvector for knowledge bases, ElastiCache Valkey, and S3.<\/li>\n<li><strong>Governance:<\/strong> an S3 audit bucket with Object Lock, Athena, CloudWatch, KMS and Secrets Manager, and SES.<\/li>\n<li><strong>Region B:<\/strong> Aurora snapshot copies and an S3 replica.<\/li>\n<\/ul>\n<h2>Key decisions<\/h2>\n<p>&quot;Grounded in&quot; lists the company policy rules each decision follows, by their ID in <code>policy_rule.md<\/code>: company rules (for example <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a>), approved services (<code>svc:…<\/code>) and AWS selection guidance (<code>guidance:…<\/code>). &quot;Signals&quot; lists what the code scan found.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Decision<\/th>\n<th>Satisfies<\/th>\n<th>Grounded in (policy)<\/th>\n<th>Signals<\/th>\n<th>Alternatives considered<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D1<\/td>\n<td>Start from AWS's Dify CDK sample and harden it rather than design from scratch<\/td>\n<td>NFR-AVL-01, NFR-SCL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-02\">COMP-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>SIG-09<\/td>\n<td>EKS: nothing here is stateful enough to justify running Kubernetes<\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>Move the sandbox out of the API task into its own Fargate service in an isolated subnet: no task role, and a security group that only reaches the SSRF proxy. Keep seccomp and the 15-second limit.<\/td>\n<td>FR-04, NFR-SEC-03<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"IAM-05\">IAM-<wbr>05<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:compute:aws-fargate\">svc:<wbr>compute:<wbr>aws-<wbr>fargate<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:compute:run-containers-on-aws-managed-compute\">guidance:<wbr>compute:<wbr>run-<wbr>containers-<wbr>on-<wbr>aws-<wbr>managed-<wbr>compute<\/a><\/td>\n<td>SIG-05, SIG-10, CON-02<\/td>\n<td>Keep the sample's sidecar layout, where user code shares the API's network namespace and its S3 and Bedrock permissions<\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>Run the plugin daemon as its own service with a narrow role, installing plugins only from an internal, reviewed catalogue<\/td>\n<td>FR-05<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"IAM-05\">IAM-<wbr>05<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"COMP-02\">COMP-<wbr>02<\/a><\/td>\n<td>SIG-07<\/td>\n<td>Open marketplace installs<\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>Two layers of egress control: the SSRF proxy blocks internal ranges and the metadata endpoint, then Network Firewall enforces a domain allowlist<\/td>\n<td>NFR-NET-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-03\">REG-<wbr>03<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:security-identity-and-compliance:aws-network-firewall\">svc:<wbr>security-<wbr>identity-<wbr>and-<wbr>compliance:<wbr>aws-<wbr>network-<wbr>firewall<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:networking-and-content-delivery:network-security-and-remote-access\">guidance:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>network-<wbr>security-<wbr>and-<wbr>remote-<wbr>access<\/a><\/td>\n<td>SIG-06<\/td>\n<td>Either layer alone<\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>Bedrock is the only model provider, reached through VPC endpoints. An SCP allows only approved model ARNs. Guardrails apply to every production app, through the provider settings where supported or a mandatory guardrail step in workflows.<\/td>\n<td>NFR-SEC-01, NFR-SEC-04<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:ml-and-ai:amazon-bedrock\">svc:<wbr>ml-<wbr>and-<wbr>ai:<wbr>amazon-<wbr>bedrock<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:networking-and-content-delivery:aws-privatelink\">svc:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>aws-<wbr>privatelink<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-04\">REG-<wbr>04<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-03\">DPE-<wbr>03<\/a><\/td>\n<td>SIG-09<\/td>\n<td>External model APIs through the egress proxy (rejected by policy)<\/td>\n<\/tr>\n<tr>\n<td>D6<\/td>\n<td>Provisioned Aurora PostgreSQL (Multi-AZ, Graviton) for app and plugin metadata, plus a separate Aurora cluster with pgvector for knowledge bases<\/td>\n<td>NFR-AVL-01, NFR-SCL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-aurora\">svc:<wbr>databases:<wbr>amazon-<wbr>aurora<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:relational\">guidance:<wbr>databases:<wbr>relational<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"BB_AWS0204\">BB_AWS0204<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-01\">DPE-<wbr>01<\/a><\/td>\n<td>SIG-04, SIG-09<\/td>\n<td>The sample's Aurora Serverless v2 capped at 2 ACU (too small). Amazon OpenSearch for vectors; revisit beyond about 10 million chunks or if hybrid search is needed.<\/td>\n<\/tr>\n<tr>\n<td>D7<\/td>\n<td>ElastiCache Valkey, Multi-AZ with TLS and AUTH, sized up from the sample's <code>cache.t4g.micro<\/code><\/td>\n<td>NFR-AVL-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:databases:amazon-elasticache\">svc:<wbr>databases:<wbr>amazon-<wbr>elasticache<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:databases:in-memory\">guidance:<wbr>databases:<wbr>in-<wbr>memory<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-03\">DPE-<wbr>03<\/a><\/td>\n<td>SIG-02, SIG-09<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>D8<\/td>\n<td>On-demand Fargate for web and API; Fargate Spot only for Celery workers<\/td>\n<td>NFR-AVL-01, NFR-CST-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"svc:compute:aws-fargate\">svc:<wbr>compute:<wbr>aws-<wbr>fargate<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:compute:cost-and-savings-optimization\">guidance:<wbr>compute:<wbr>cost-<wbr>and-<wbr>savings-<wbr>optimization<\/a><\/td>\n<td>SIG-09 (the sample defaults to Spot)<\/td>\n<td>Spot everywhere, as in the sample<\/td>\n<\/tr>\n<tr>\n<td>D9<\/td>\n<td>License Dify Enterprise for SAML/OIDC SSO and per-team workspaces<\/td>\n<td>NFR-SEC-02, FR-03<\/td>\n<td>—<\/td>\n<td>SIG-11, SIG-12, CON-01<\/td>\n<td>Community edition behind ALB OIDC authentication: one shared workspace, no per-team isolation, and a licence breach if teams get separate workspaces<\/td>\n<\/tr>\n<tr>\n<td>D10<\/td>\n<td>Audit trail: Bedrock model invocation logging plus a scheduled export of conversations and tool calls into an S3 bucket with Object Lock (1 year), queried with Athena<\/td>\n<td>NFR-CMP-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"LOGP-05\">LOGP-<wbr>05<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"LOGP-01\">LOGP-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:analytics:amazon-athena\">svc:<wbr>analytics:<wbr>amazon-<wbr>athena<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:storage:amazon-simple-storage-service\">svc:<wbr>storage:<wbr>amazon-<wbr>simple-<wbr>storage-<wbr>service<\/a><\/td>\n<td>Scenario<\/td>\n<td>CloudWatch Logs only, which gives no write-once guarantee<\/td>\n<\/tr>\n<tr>\n<td>D11<\/td>\n<td>Private access only: an internal ALB with WAF, reached over Direct Connect or VPN<\/td>\n<td>NFR-SEC-02<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-03\">REG-<wbr>03<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:networking-and-content-delivery:direct-connect\">svc:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>direct-<wbr>connect<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"guidance:networking-and-content-delivery:global-and-hybrid-connectivity\">guidance:<wbr>networking-<wbr>and-<wbr>content-<wbr>delivery:<wbr>global-<wbr>and-<wbr>hybrid-<wbr>connectivity<\/a><\/td>\n<td>The sample supports an internal ALB<\/td>\n<td>CloudFront with public access, the sample's default<\/td>\n<\/tr>\n<tr>\n<td>D12<\/td>\n<td>Each workspace's Bedrock provider uses its own application inference profile, tagged for cost allocation, with AWS Budgets alerts at 80%<\/td>\n<td>NFR-CST-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"TAG-02\">TAG-<wbr>02<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:ml-and-ai:amazon-bedrock\">svc:<wbr>ml-<wbr>and-<wbr>ai:<wbr>amazon-<wbr>bedrock<\/a><\/td>\n<td>Scenario<\/td>\n<td>Account-level spend only<\/td>\n<\/tr>\n<tr>\n<td>D13<\/td>\n<td>Keep the agent backend's shell sandbox off at launch<\/td>\n<td>NFR-SEC-03<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>SIG-08, CON-03<\/td>\n<td>Enable it with the default local sandbox<\/td>\n<\/tr>\n<tr>\n<td>D14<\/td>\n<td>Aurora point-in-time recovery with cross-region snapshot copies, S3 replication, and redeployment from CDK in Region B<\/td>\n<td>NFR-DR-01<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-06\">COMP-<wbr>06<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"REG-01\">REG-<wbr>01<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"DPE-06\">DPE-<wbr>06<\/a>, <a href=\"#\" class=\"pol\" data-policy=\"svc:storage:aws-backup\">svc:<wbr>storage:<wbr>aws-<wbr>backup<\/a><\/td>\n<td>NFR-DR-01 targets<\/td>\n<td>A warm standby, which an RTO of 4 hours does not need<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>How a request flows<\/h2>\n<ol>\n<li>An employee opens the console or a published app over the corporate network. WAF and the internal ALB send UI traffic to the web service and API calls to the API service; sign-in goes through the corporate IdP.<\/li>\n<li>For a chat request, the API retrieves matching chunks from pgvector, calls the model in Bedrock through the VPC endpoint, and streams the answer back.<\/li>\n<li>HTTP tool calls leave through the SSRF proxy and Network Firewall, and only to allowlisted APIs. Code nodes run in the isolated sandbox service, which has no credentials and can reach only the proxy.<\/li>\n<li>Uploaded documents land in S3. Celery workers chunk them, create embeddings with Bedrock and index them in pgvector.<\/li>\n<li>Bedrock invocation logs and the scheduled conversation export land in the write-once audit bucket, where Athena supports investigations.<\/li>\n<\/ol>\n<h2>Well-Architected review<\/h2>\n<ul>\n<li><strong>Security:<\/strong> user code is isolated from credentials. Egress has two layers of control and models are reached only privately. Guardrails screen prompts and responses, and every store uses customer-managed keys. There is no public endpoint.<\/li>\n<li><strong>Reliability:<\/strong> every service runs in three AZs; Aurora and Valkey are Multi-AZ; backups are copied to Region B.<\/li>\n<li><strong>Performance efficiency:<\/strong> responses stream over websockets, and vector search stays in a separate Aurora cluster so indexing does not slow app metadata queries.<\/li>\n<li><strong>Cost optimisation:<\/strong> Spot for workers, Graviton for Aurora, and per-workspace model spend with budgets.<\/li>\n<li><strong>Operational excellence:<\/strong> CloudWatch alarms on Celery queue depth and task failures; the stack is CDK code derived from AWS's sample.<\/li>\n<li><strong>Sustainability:<\/strong> serverless containers sized to demand.<\/li>\n<\/ul>\n<h2>Policy check and exceptions requested<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Request<\/th>\n<th>Policy<\/th>\n<th>Why<\/th>\n<th>Compensating controls<\/th>\n<th>Approvers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EXC-01<\/td>\n<td>Commercial Dify Enterprise licence<\/td>\n<td>—<\/td>\n<td>SSO and per-team workspaces (CON-01)<\/td>\n<td>Vendor risk assessment; contract covers security patches and support response times; software runs in the firm's account, so no data goes to the vendor<\/td>\n<td>Procurement, CISO<\/td>\n<\/tr>\n<tr>\n<td>EXC-02<\/td>\n<td>Execute user-supplied code on the platform<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"COMP-03\">COMP-<wbr>03<\/a><\/td>\n<td>Code nodes are central to workflows (FR-04, CON-02)<\/td>\n<td>A separate task with no IAM role, an isolated subnet, egress only through the proxy, seccomp, a 15-second limit, and code nodes restricted to approved builders<\/td>\n<td>CISO<\/td>\n<\/tr>\n<tr>\n<td>EXC-03<\/td>\n<td>Use Amazon SES for platform email<\/td>\n<td><a href=\"#\" class=\"pol\" data-policy=\"REG-04\">REG-<wbr>04<\/a><\/td>\n<td>SES is not in the approved service catalog, and accounts are restricted to approved services<\/td>\n<td>Outbound email only, from one verified domain with SPF and DKIM; no inbound mail<\/td>\n<td>Platform engineering lead, CGC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Risks and open items<\/h2>\n<ul>\n<li>Prompt injection through documents and tool outputs. Guardrails reduce the risk but do not remove it, so actions with side effects should need human approval.<\/li>\n<li>Knowledge bases are separated per workspace, but per-document access control that mirrors the source systems is not designed yet (Q-01).<\/li>\n<li>Dify releases frequently, and its licence lets the producer change terms. Keep upgrades current and keep Legal watching the licence.<\/li>\n<li>The tool egress allowlist still needs an owner and a review process (Q-02).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>langgenius/dify at commit <code>6d14cd586132<\/code>: <a href=\"https://github.com/langgenius/dify/blob/main/docker/docker-compose.yaml\" target=\"_blank\" rel=\"noopener\">docker/docker-compose.yaml<\/a>, <a href=\"https://github.com/langgenius/dify/blob/main/docker/.env.example\" target=\"_blank\" rel=\"noopener\">docker/.env.example<\/a>, <a href=\"https://github.com/langgenius/dify/blob/main/LICENSE\" target=\"_blank\" rel=\"noopener\">LICENSE<\/a><\/li>\n<li>AWS reference: <a href=\"https://github.com/aws-samples/dify-self-hosted-on-aws\" target=\"_blank\" rel=\"noopener\">aws-samples/dify-self-hosted-on-aws<\/a> at commit <code>a589e3e5e83b<\/code><\/li>\n<li><a href=\"https://enterprise-docs.dify.ai/en/3.13.x/administer/sso/introduction\" target=\"_blank\" rel=\"noopener\">Dify Enterprise: SSO authentication<\/a><\/li>\n<li>Amazon Bedrock: <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html\" target=\"_blank\" rel=\"noopener\">model invocation logging<\/a>, <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles.html\" target=\"_blank\" rel=\"noopener\">inference profiles<\/a function hl(src, lang){
  const e = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return src.split('\n').map(line=>{
    if (lang==='yaml'){
      const m = /^(\s*)(#.*)$/.exec(line); if (m) return m[1]+`<span class="c">${e(m[2])}</span>`;
      return e(line).replace(/^(\s*-?\s*)([\w.$-]+)(:)/, '$1<span class="k">$2</span>$3').replace(/(:\s+)(".*"|'.*')\s*$/, '$1<span class="s">$2</span>').replace(/(:\s+)(true|false|\d[\d.]*)\s*$/, '$1<span class="n">$2</span>');
    }
    return e(line).replace(/^(\s*)("[^"]+")(:)/, '$1<span class="k">$2</span>$3').replace(/(:\s|^\s+)("(?:[^"\\]|\\.)*")(,?)$/, '$1<span class="s">$2</span>$3').replace(/(:\s)(-?\d[\d.]*|true|false|null)(,?)$/, '$1<span class="n">$2</span>$3');
  }).join('\n');
}

  return `Rendered from the YAML with the repo's diagram tool. Click the diagram to zoom.`;
}

function text(g, x, y, lines, cls, lh){ lines.forEach((l,i)=>{ const t = el('text',{x,y:y+i*lh,'text-anchor':'middle',class:cls},g); t.textContent = l; }); }

function drawNode(n){
  const isZone = !!n.zone;
  const g = el('g',{class:'node'+(isZone?' zone':''),'data-id':n.id}, document.getElementById(isZone?'layer-zones':'layer-nodes'));
  if (isZone) g.dataset.tone = n.zone; else g.dataset.kind = n.kind;
  const {x,y,w,h} = n;
  if (n.kind === 'artifact'){
    el('path',{class:'shape',d:`M${x},${y} H${x+w-14} L${x+w},${y+14} V${y+h} H${x} Z`},g);
  } else {
    const rx = isZone ? 10 : n.kind==='agent' ? 14 : n.kind==='person' ? 25 : n.kind==='tool' ? 4 : 8;
    el('rect',{class:'shape',x,y,width:w,height:h,rx},g);
  }
  if (isZone){
    const t = el('text',{x:x+12,y:y+20,class:'zlabel'},g); t.textContent = n.t;
    if (n.s){ const s = el('text',{x:x+12,y:y+36,class:'zsub'},g); s.textContent = n.s; }
    return;
  }
  const title = n.t.split('\n');
  const cx = x + w/2;
  if (n.items){
    text(g, cx, y+28, title, 'ntitle', 15);
    text(g, cx, y+58, n.items, 'nsub', 16);
  } else {
    const sub = n.s ? n.s.split('\n') : [];
    const total = title.length*15 + sub.length*14;
    const top = y + h/2 - total/2 + 11 - (n.id.startsWith('a-') ? 7 : 0);
    text(g, cx, top, title, 'ntitle', 15);
    if (sub.length) text(g, cx, top + title.length*15, sub, 'nsub', 14);
  }
  if (STATUS[n.id]){ el('circle',{class:'sdot s-'+STATUS[n.id],cx:x+w-7,cy:y+7,r:5},g); }
  const tt = el('title',{},g); tt.textContent = n.t.replace(/\n/g,' ') + (STATUS[n.id] ? ' — ' + STATUS_TEXT[STATUS[n.id]] : '');
  if (n.id.startsWith('a-')){ const pk = el('text',{x:cx,y:y+h-9,'text-anchor':'middle',class:'peek'},g); pk.textContent = 'VIEW SAMPLE ›'; }
  g.addEventListener('click', () => {
    if (ART_OF[n.id]){ openSample(ART_OF[n.id]); return; }
    const i = STEPS.findIndex((s,k)=>k>0 && s.nodes.includes(n.id)); if (i>0){ stopPlay(); go(i); }
  });
}

function drawEdge(e){
  const g = el('g',{class:'edge'+(e.dotted?' dotted':''),'data-id':e.id}, document.getElementById('layer-edges'));
  const d = 'M' + e.p.map(p=>p.join(',')).join(' L');
  e.path = el('path',{d,'marker-end':'url(#arr)'},g);
  if (e.both) e.path.setAttribute('marker-start','url(#arr)');
  e.g = g;
  const lbl = e.n || e.label;
  if (lbl){
    // badge on the midpoint of the longest segment
    let best = 0, bx = 0, by = 0;
    for (let i=1;i<e.p.length;i++){ const [x1,y1]=e.p[i-1],[x2,y2]=e.p[i]; const L=Math.hypot(x2-x1,y2-y1); if (L>best){best=L;bx=(x1+x2)/2;by=(y1+y2)/2;} }
    const b = el('g',{class:'badge','data-id':e.id}, document.getElementById('layer-badges'));
    const wpx = lbl.length*6.4 + 10;
    el('rect',{x:bx-wpx/2,y:by-8,width:wpx,height:16,rx:8},b);
    const t = el('text',{x:bx,y:by+3.5,'text-anchor':'middle'},b); t.textContent = lbl;
    e.badge = b;
  }
}

const FULL = [0,0,1400,1110];
let vb = FULL.slice(), anim = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setVB(b){ vb = b; svg.setAttribute('viewBox', b.map(v=>v.toFixed(1)).join(' ')); }
function animateTo(target){
  cancelAnimationFrame(anim);
  if (reduce){ setVB(target); return; }
  const from = vb.slice(), t0 = performance.now(), dur = 650;
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    setVB(from.map((v,i)=>v+(target[i]-v)*e)); if (k<1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function boxFor(s){
  if (!follow || !s.nodes.length) return FULL;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  s.nodes.forEach(id=>{ const n=byId[id]; if (n.zone && s.nodes.some(o=>!byId[o].zone)) return; add(n.x,n.y); add(n.x+n.w,n.y+n.h); });
  s.edges.forEach(id=>edgeById[id].p.forEach(([x,y])=>add(x,y)));
  const pad = 50; x0-=pad; y0-=pad; x1+=pad; y1+=pad;
  let w = Math.max(x1-x0, 820), h = Math.max(y1-y0, 560);
  const r = svg.clientWidth / Math.max(1, svg.clientHeight);
  if (w/h < r) w = h*r; else h = w/r;
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  if (w >= FULL[2] && h >= FULL[3]) return FULL;
  return [cx-w/2, cy-h/2, w, h];
}

// ---- state & rendering ----
let cur = 0, follow = true, playTimer = null;
const panel = document.getElementById('panel');
const rail = document.getElementById('rail');
STEPS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent = i===0 ? 'Overview' : s.n; b.title = s.title; b.addEventListener('click',()=>{stopPlay();go(i);}); rail.appendChild(b); });

function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderPanel(s, i){
  const parts = [];
  parts.push(`<div class="eyebrow">${i>0?`<span class="num">${esc(s.n)}</span>`:''}<span>${esc(s.area)}</span></div>`);
  parts.push(`<h2>${esc(s.title)}</h2>`);
  s.body.forEach(p=>parts.push(`<p>${esc(p)}</p>`));
  if (i===0){
    parts.push(`<div class="meta"><h3>Reading the diagram</h3>
      <p class="note">Yellow boxes are agents, green is the versioned artifact repository, blue-grey are LLMs, MCP servers and org data, and lavender is human governance. Numbered badges follow the end-to-end flow.</p></div>`);
    parts.push(`<div class="meta"><h3>Stages</h3><div class="chips">${STEPS.slice(1).map((t,k)=>`<button class="chip" data-go="${k+1}">${esc(t.title)}</button>`).join('')}</div></div>`);
  } else {
    const meta = [];
    const st = BUILD_STATUS && BUILD_STATUS.steps[s.n];
    if (st) meta.push(`<span class="status"><i class="s-${st.status}"></i>${STATUS_TEXT[st.status]}</span>${st.note?`<span class="note">${esc(st.note)}</span>`:''}`);
    if (s.out) meta.push(`<h3>Produces</h3><div class="chips">${s.out.map(o=>typeof o==='string' ? `<span class="chip">${esc(o)}</span>` : `<button class="chip art" data-art="${o.a}" title="Open the sample">${esc(o.t)} ›</button>`).join('')}</div>`);
    const arts = [...new Set(s.nodes.map(id=>ART_OF[id]).filter(Boolean))];
    if (arts.length) parts.push(`<button class="open-sample" data-art="${arts[arts.length-1]}">Open sample ${esc(ARTIFACTS[arts[arts.length-1]].tab)} ›</button>`);
    const names = s.nodes.filter(id=>!byId[id].zone).map(id=>byId[id].t.replace(/\n/g,' '));
    if (names.length) meta.push(`<h3>In focus</h3><div class="chips">${names.map(nm=>`<span class="chip">${esc(nm)}</span>`).join('')}</div>`);
    parts.push(`<div class="meta">${meta.join('')}</div>`);
  }
  if (i===0) parts.push(`<button class="open-sample" data-art="req">Browse sample artifacts ›</button>`);
  if (POLICY && POLICY_STEPS.includes(s.n)) parts.push(`<button class="open-sample" data-open-policy>Open the policy list ›</button>`);
  parts.push(`<p class="hint"><kbd>←</kbd> <kbd>→</kbd> or <kbd>Space</kbd> to move · <kbd>Esc</kbd> for overview · click any box to jump to its step, or an artifact to open its sample</p>`);
  panel.innerHTML = parts.join('');
  panel.querySelectorAll('[data-art]').forEach(b=>b.addEventListener('click',()=>openSample(b.dataset.art)));
  panel.querySelectorAll('[data-open-policy]').forEach(b=>b.addEventListener('click',()=>openPolicy()));
  panel.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{stopPlay();go(+b.dataset.go);}));
  panel.scrollTop = 0;
}

function go(i){
  cur = Math.max(0, Math.min(STEPS.length-1, i));
  const s = STEPS[cur];
  const on = new Set(s.nodes), eon = new Set(s.edges), quiet = new Set(s.quiet || []);
  svg.classList.toggle('focus', cur>0);
  svg.querySelectorAll('.node').forEach(g=>g.classList.toggle('on', on.has(g.dataset.id)));
  EDGES.forEach(e=>{
    const a = eon.has(e.id);
    e.g.classList.toggle('on', a);
    if (e.badge) e.badge.classList.toggle('on', a && !quiet.has(e.id));
    const m = a ? 'url(#arr-on)' : 'url(#arr)';
    e.path.setAttribute('marker-end', m);
    if (e.both) e.path.setAttribute('marker-start', m);
  });
  [...rail.children].forEach((b,k)=>{ b.classList.toggle('done', k<cur); if (k===cur){ b.setAttribute('aria-current','step'); b.scrollIntoView({block:'nearest',inline:'nearest',behavior:reduce?'auto':'smooth'}); } else b.removeAttribute('aria-current'); });
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').textContent = cur===0 ? 'Start →' : cur===STEPS.length-1 ? 'Back to overview' : 'Next →';
  renderPanel(s, cur);
  animateTo(boxFor(s));
  try { history.replaceState(null,'', cur ? '#step-'+cur : '#overview'); } catch(_){}
}

function next(){ go(cur===STEPS.length-1 ? 0 : cur+1); }
function prev(){ go(cur-1); }
document.getElementById('next').addEventListener('click',()=>{stopPlay();next();});
document.getElementById('prev').addEventListener('click',()=>{stopPlay();prev();});
document.addEventListener('keydown',e=>{
  if (viewer.open || (policyViewer && policyViewer.open) || e.target.closest('input,textarea')) return;
  if (e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); stopPlay(); next(); }
  else if (e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); stopPlay(); prev(); }
  else if (e.key==='Escape'||e.key==='Home'){ stopPlay(); go(0); }
  else if (e.key==='End'){ stopPlay(); go(STEPS.length-1); }
  else if ((e.key==='f'||e.key==='F') && !e.metaKey && !e.ctrlKey && !e.altKey){ toggleFullscreen(); }
});

const fsBtn = document.getElementById('fsBtn');
function toggleFullscreen(){
  if (!document.fullscreenEnabled) return;
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  } catch(_){}
}
if (document.fullscreenEnabled){ fsBtn.hidden = false; fsBtn.addEventListener('click', toggleFullscreen); }
document.addEventListener('fullscreenchange',()=>{ fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

const followBtn = document.getElementById('follow');
followBtn.addEventListener('click',()=>{ follow=!follow; followBtn.setAttribute('aria-pressed',follow); animateTo(boxFor(STEPS[cur])); });
const statusBtn = document.getElementById('statusBtn');
if (statusBtn) statusBtn.addEventListener('click',()=>{ const on = svg.classList.toggle('show-status'); statusBtn.setAttribute('aria-pressed',on); document.getElementById('legend').hidden = !on; });
const playBtn = document.getElementById('play');
function stopPlay(){ clearInterval(playTimer); playTimer=null; playBtn.setAttribute('aria-pressed','false'); playBtn.textContent='▶ Auto-play'; }
playBtn.addEventListener('click',()=>{
  if (playTimer){ stopPlay(); return; }
  playBtn.setAttribute('aria-pressed','true'); playBtn.textContent='❚❚ Pause';
  if (cur===STEPS.length-1) go(0); else next();
  playTimer = setInterval(()=>{ if (cur===STEPS.length-1) stopPlay(); else next(); }, 8000);
});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>setVB(boxFor(STEPS[cur])),120); });

const m = /^#step-(\d+)$/.exec(location.hash);
go(m ? +m[1] : 0);
</script>
