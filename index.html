<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDP-Agents Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#18211E; --muted:#5D6964; --line:#CAD2CE;
  --node:#FFFFFF; --node-stroke:#8E9A95; --edge:#8A9690;
  --z-agent:#FBF3DC; --z-agent-s:#DDC888;
  --z-art:#E2F1E5; --z-art-s:#94C5A0;
  --z-gov:#ECE9F6; --z-gov-s:#B5ACD8;
  --z-ext:#E8EEF3; --z-ext-s:#AFBECC;
  --accent:#2541D8; --accent-soft:#DCE2FB; --on-accent:#FFFFFF;
  --ok:#2F8F5B; --wip:#B7791F; --plan:#7A6FA8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513; --surface:#171E1B; --ink:#E6ECE9; --muted:#97A39E; --line:#2D3834;
    --node:#1C2421; --node-stroke:#55625D; --edge:#66736E;
    --z-agent:#262315; --z-agent-s:#5A5030;
    --z-art:#16271B; --z-art-s:#2F5939;
    --z-gov:#201E31; --z-gov-s:#4A4370;
    --z-ext:#18212A; --z-ext-s:#394959;
    --accent:#8095FF; --accent-soft:#242C55; --on-accent:#0E1330;
    --ok:#5BC48A; --wip:#E0A84A; --plan:#A79CDB;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513; --surface:#171E1B; --ink:#E6ECE9; --muted:#97A39E; --line:#2D3834;
  --node:#1C2421; --node-stroke:#55625D; --edge:#66736E;
  --z-agent:#262315; --z-agent-s:#5A5030;
  --z-art:#16271B; --z-art-s:#2F5939;
  --z-gov:#201E31; --z-gov-s:#4A4370;
  --z-ext:#18212A; --z-ext-s:#394959;
  --accent:#8095FF; --accent-soft:#242C55; --on-accent:#0E1330;
  --ok:#5BC48A; --wip:#E0A84A; --plan:#A79CDB;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;box-sizing:border-box}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--node-stroke)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;min-height:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;position:relative;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 8px;border-radius:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 9px;font-weight:500;letter-spacing:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance}
.panel p{margin:0;max-width:62ch}
.meta{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.meta h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
button.chip:hover{border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status i{width:9px;height:9px;border-radius:50%}
.note{font-size:13px;color:var(--muted)}
.hint{margin-top:auto;font-size:12px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}
footer{display:flex;align-items:center;gap:10px;padding-block:12px 14px}
.rail{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin;padding-block:2px}
.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.rail button.done{color:var(--ink)}
.rail button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 14px}

/* diagram */
.zone rect,.zone path{stroke-width:1.2}
.zone[data-tone="agent"] .shape{fill:var(--z-agent);stroke:var(--z-agent-s)}
.zone[data-tone="art"] .shape{fill:var(--z-art);stroke:var(--z-art-s)}
.zone[data-tone="gov"] .shape{fill:var(--z-gov);stroke:var(--z-gov-s)}
.zone[data-tone="ext"] .shape{fill:var(--z-ext);stroke:var(--z-ext-s)}
.zone[data-tone="inner"] .shape{fill:var(--node);stroke:var(--z-agent-s);stroke-dasharray:4 3;fill-opacity:.55}
.zlabel{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.zsub{font:italic 400 11.5px var(--sans);fill:var(--muted)}
.node .shape{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.2;transition:stroke .3s,fill .3s}
.node[data-kind="artifact"] .shape{stroke:var(--z-art-s)}
.node[data-kind="agent"] .shape{stroke-width:1.8;stroke:var(--ink)}
.node[data-kind="ext"] .shape{stroke-dasharray:3 3}
.ntitle{font:600 12.5px var(--sans);fill:var(--ink)}
.nsub{font:400 11px var(--sans);fill:var(--muted)}
.node,.zone,.edge,.badge{transition:opacity .35s}
.node:not(.zone){cursor:pointer}
.node:not(.zone):hover .shape{stroke:var(--accent)}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.3}
.edge.dotted path{stroke-dasharray:2 4}
.badge rect{fill:var(--surface);stroke:var(--edge);stroke-width:1}
.badge text{font:500 10px var(--mono);fill:var(--muted)}
.focus .zone:not(.on){opacity:.45}
.focus .node:not(.zone):not(.on){opacity:.2}
.focus .edge:not(.on),.focus .badge:not(.on){opacity:.1}
.node.on:not(.zone) .shape{stroke:var(--accent);stroke-width:2.2;fill:var(--accent-soft)}
.zone.on .zlabel{fill:var(--ink)}
.edge.on path{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 5;animation:flow 1s linear infinite}
.badge.on rect{fill:var(--accent);stroke:var(--accent)}
.badge.on text{fill:var(--on-accent)}
@keyframes flow{to{stroke-dashoffset:-12}}
.sdot{display:none;stroke:var(--surface);stroke-width:2}
.show-status .sdot{display:block}
.s-ok{fill:var(--ok);background:var(--ok)} .s-wip{fill:var(--wip);background:var(--wip)} .s-plan{fill:var(--plan);background:var(--plan)}
.mk{fill:var(--edge)} .mk-on{fill:var(--accent)}
.node[data-kind="artifact"] .peek{font:500 9.5px var(--mono);fill:var(--accent);letter-spacing:.04em}

/* sample artifact viewer */
.open-sample{align-self:flex-start;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
button.chip.art{border-color:var(--z-art-s);background:var(--z-art)}
dialog.viewer{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(1100px,calc(100vw - 32px));height:min(860px,calc(100vh - 32px));max-width:none;max-height:none}
dialog.viewer[open]{display:flex;flex-direction:column}
dialog.viewer::backdrop{background:rgba(10,14,12,.55)}
.v-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.v-head h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.2}
.v-head .v-title{margin-right:auto;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 360px}
.v-path{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.v-path a{color:var(--accent)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;align-self:flex-start}
.tag.real{background:var(--z-art);color:var(--ok);border:1px solid var(--z-art-s)}
.tag.illus{background:var(--z-agent);color:var(--wip);border:1px solid var(--z-agent-s)}
.tag.ref{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent)}
.v-sets{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:center}
.v-sets button{border:0;background:var(--surface);padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.v-sets button+button{border-left:1px solid var(--line)}
.v-sets button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.v-tabs{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.v-tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;border-radius:8px 8px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.v-tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.v-note{font-size:13px;color:var(--muted);padding:10px 18px 0;margin:0}
.v-body{flex:1;min-height:0;overflow:auto;padding:12px 18px 18px}
.code{font:12.5px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0;white-space:pre;tab-size:2;min-width:max-content}
.code .k{color:var(--accent)} .code .s{color:var(--ok)} .code .n{color:var(--wip)} .code .c{color:var(--muted);font-style:italic}
.doc{max-width:78ch;display:flex;flex-direction:column;gap:12px}
.doc h2,.doc h3{font-family:var(--display);font-size:17px;margin:10px 0 0}
.doc a{color:var(--accent)}
.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc p,.doc li{margin:0}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc table{border-collapse:collapse;font-size:13px;width:100%}
.doc th,.doc td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 10px 8px 0}
.doc th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.doc code{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.tablewrap{overflow-x:auto}
.imgwrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;cursor:zoom-in}
.imgwrap img{display:block;width:100%;max-width:100%}
.imgwrap.zoomed{cursor:zoom-out}
.imgwrap.zoomed img{width:auto;max-width:none}
@media (prefers-reduced-motion: reduce){.edge.on path{animation:none}.node,.zone,.edge,.badge{transition:none}}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .stage{height:58vh;min-height:320px}
  .panel{overflow:visible}
  .hint{display:none}
}
</style>
</head>

<div class="app">
  <header>
    <div class="brand">
      <h1>CDP-Agents Walkthrough</h1>

    <div class="tools">
      <button class="btn" id="samplesBtn" title="Open the sample artifacts">Sample artifacts</button>

      <button class="btn" id="play" aria-pressed="false">▶ Auto-play</button>

  <main>
    <div class="stage" id="stage">
      <svg id="dia" viewBox="0 0 1400 1110" preserveAspectRatio="xMidYMid meet" role="img" aria-label="CDP-Agents end-to-end architecture flow">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-on" d="M0,0 L10,5 L0,10 z"/></marker>

        <g id="layer-zones"></g><g id="layer-edges"></g><g id="layer-nodes"></g><g id="layer-badges"></g>

  </main>
  <footer>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous step">←</button>
      <button class="btn primary" id="next" aria-label="Next step">Next →</button>

</div>

<dialog class="viewer" id="viewer" aria-labelledby="vTitle">

    <button class="btn" id="vClose" aria-label="Close sample viewer">Close ✕</button>
  </div>
  <div class="v-tabs" role="tablist" id="vTabs"></div>
  <p class="v-note" id="vNote"></p>
  <div class="v-body" id="vBody"></div>
</dialog>

<script type="application/json" id="sample-data">[{"short": "Signal", "title": "Signal secure messaging on AWS", "source": "signalapp/Signal-Server @ a15d5cd", "sourceUrl": "https://github.com/signalapp/Signal-Server/tree/a15d5cdbb937fc5d078b73ec7b4a725ddf4e9473", "alt": "Architecture diagram: employee devices reach Signal chat services on Amazon EKS through Route 53, AWS WAF and an Application Load Balancer. The services use DynamoDB, ElastiCache, FoundationDB and S3. A separate compliance account captures journaled messages into an S3 Object Lock archive, and a warm-standby region receives replicas.", "folder": "samples/signal_secure_messaging_on_aws", "linkFiles": true, "files": {"req": "requirements.json", "sum": "architecture_summary.md", "yaml": "signal_secure_messaging_on_aws.yaml", "diag": "signal_secure_messaging_on_aws.png"}, "req": "{\n  \"$schema\": \"cdp/requirements/v0\",\n  \"document\": {\n    \"id\": \"REQ-SIGNAL-001\",\n    \"title\": \"Signal secure messaging for a regulated financial firm\",\n    \"version\": \"1.0\",\n    \"status\": \"ready-for-design\",\n    \"created\": \"2026-10-08\",\n    \"produced_by\": \"Reference sample written in the Requirements Analyzer format (see ../README.md)\"\n  },\n  \"application\": {\n    \"name\": \"Signal Server and companion services\",\n    \"repository\": \"https://github.com/signalapp/Signal-Server\",\n    \"commit\": \"a15d5cdbb937\",\n    \"license\": \"AGPL-3.0\",\n    \"summary\": \"The open-source server behind the Signal messenger: end-to-end encrypted 1:1 and group messaging, attachments, linked devices, and voice/video calling. The chat server is a Java (Dropwizard) service; several capabilities live in companion repositories.\",\n    \"components\": [\n      {\n        \"name\": \"Chat service\",\n        \"repository\": \"signalapp/Signal-Server\",\n        \"language\": \"Java (Dropwizard)\",\n        \"role\": \"WebSocket/gRPC API, message routing, accounts, keys, push\"\n      },\n      {\n        \"name\": \"Registration service\",\n        \"repository\": \"signalapp/registration-service\",\n        \"language\": \"Java\",\n        \"role\": \"Phone-number verification for new accounts (gRPC)\"\n      },\n      {\n        \"name\": \"Storage service\",\n        \"repository\": \"signalapp/storage-service\",\n        \"language\": \"Java\",\n        \"role\": \"Encrypted contacts/settings sync and groups; uses Google Cloud Bigtable\"\n      },\n      {\n        \"name\": \"Key transparency server\",\n        \"repository\": \"signalapp/key-transparency-server\",\n        \"language\": \"Go\",\n        \"role\": \"Append-only log of identity keys; uses DynamoDB and DynamoDB Streams\"\n      },\n      {\n        \"name\": \"Calling service\",\n        \"repository\": \"signalapp/Signal-Calling-Service\",\n        \"language\": \"Rust\",\n        \"role\": \"Selective forwarding unit for group calls\"\n      },\n      {\n        \"name\": \"Contact discovery\",\n        \"repository\": \"signalapp/ContactDiscoveryService-Icelake\",\n        \"language\": \"C (hardware enclave)\",\n        \"role\": \"Private address-book lookup inside an attested enclave\"\n      },\n      {\n        \"name\": \"Secure value recovery\",\n        \"repository\": \"signalapp/SecureValueRecovery2\",\n        \"language\": \"C++ (hardware enclave)\",\n        \"role\": \"PIN-protected recovery of account secrets\"\n      }\n    ],\n    \"detected_signals\": [\n      {\n        \"id\": \"SIG-01\",\n        \"signal\": \"WebSocket and gRPC listeners on the chat service\",\n        \"evidence\": \"service/config/sample.yml: grpc.port 50051, grpc.websocketPort 8080\",\n        \"implies\": \"Long-lived client connections; load balancer must support WebSocket and HTTP/2\"\n      },\n      {\n        \"id\": \"SIG-02\",\n        \"signal\": \"34 DynamoDB tables (accounts, keys, profiles, messages, verification sessions, and more)\",\n        \"evidence\": \"service/config/sample.yml: dynamoDbTables\",\n        \"implies\": \"DynamoDB is the primary system of record for accounts and keys\"\n      },\n      {\n        \"id\": \"SIG-03\",\n        \"signal\": \"Five separate Redis endpoints: cache, pub/sub, push scheduler, rate limiters, message cache\",\n        \"evidence\": \"service/config/sample.yml: cacheCluster, pubsub, pushSchedulerCluster, rateLimitersCluster, messageCache\",\n        \"implies\": \"Managed Redis with cluster mode for four endpoints; pub/sub uses a single non-cluster endpoint\"\n      },\n      {\n        \"id\": \"SIG-04\",\n        \"signal\": \"FoundationDB message store sharded across four clusters with resharding epochs\",\n        \"evidence\": \"service/config/sample.yml: foundationDbMessages; README: 'This project uses FoundationDB'\",\n        \"implies\": \"Self-managed FoundationDB; no managed equivalent on AWS\"\n      },\n      {\n        \"id\": \"SIG-05\",\n        \"signal\": \"Messages are cached in Redis and persisted after one minute\",\n        \"evidence\": \"service/config/sample.yml: messageCache.persistDelayMinutes 1\",\n        \"implies\": \"Message cache must be Multi-AZ to avoid loss of undelivered messages\"\n      },\n      {\n        \"id\": \"SIG-06\",\n        \"signal\": \"Object storage for attachments and prekeys, with resumable uploads\",\n        \"evidence\": \"service/config/sample.yml: cdn.bucket, pagedSingleUseKEMPreKeyStore.bucket, tus.uploadUri, gcpAttachments, cdn3StorageManager (gcs, r2)\",\n        \"implies\": \"S3 buckets plus a CDN for downloads and a tus upload endpoint; upstream also uses GCS and Cloudflare R2\"\n      },\n      {\n        \"id\": \"SIG-07\",\n        \"signal\": \"Push notifications through Apple and Google\",\n        \"evidence\": \"service/config/sample.yml: apn, fcm\",\n        \"implies\": \"Outbound internet egress to APNs and FCM only\"\n      },\n      {\n        \"id\": \"SIG-08\",\n        \"signal\": \"Contact discovery and secure value recovery run as remote enclave services\",\n        \"evidence\": \"service/config/sample.yml: directoryV2, svr2, svrb\",\n        \"implies\": \"Hardware-enclave hosting; the upstream enclave code targets Intel SGX\"\n      },\n      {\n        \"id\": \"SIG-09\",\n        \"signal\": \"Storage service persists to Google Cloud Bigtable\",\n        \"evidence\": \"signalapp/storage-service: src/main/java/org/signal/storageservice/storage/Table.java\",\n        \"implies\": \"Porting to an AWS data store, or a cross-cloud dependency\"\n      },\n      {\n        \"id\": \"SIG-10\",\n        \"signal\": \"Consumer monetisation integrations: Stripe, Braintree, Google Play and App Store billing, MobileCoin payments, donations\",\n        \"evidence\": \"service/config/sample.yml: stripe, braintree, googlePlayBilling, appleAppStore, paymentsService, oneTimeDonations\",\n        \"implies\": \"Not needed for an enterprise deployment; removing them shrinks third-party and payment-card scope\"\n      },\n      {\n        \"id\": \"SIG-11\",\n        \"signal\": \"Calling relies on TURN relays (Cloudflare in the sample) and a group-call SFU\",\n        \"evidence\": \"service/config/sample.yml: turn.cloudflare; signalapp/Signal-Calling-Service\",\n        \"implies\": \"UDP media paths and public IPs for relays\"\n      },\n      {\n        \"id\": \"SIG-12\",\n        \"signal\": \"OpenTelemetry export for logs and traces\",\n        \"evidence\": \"service/config/sample.yml: logging.appenders[type: otlp], openTelemetry\",\n        \"implies\": \"OTel collector feeding the firm's monitoring stack\"\n      },\n      {\n        \"id\": \"SIG-13\",\n        \"signal\": \"Dynamic configuration and ASN table read from S3 every 10 seconds\",\n        \"evidence\": \"service/config/sample.yml: dynamicConfig, asnTable\",\n        \"implies\": \"Configuration bucket with versioning and change control\"\n      },\n      {\n        \"id\": \"SIG-14\",\n        \"signal\": \"Secrets referenced indirectly as secret:// values\",\n        \"evidence\": \"service/config/sample.yml: secret://...\",\n        \"implies\": \"Secrets manager integration; no secrets in config files\"\n      },\n      {\n        \"id\": \"SIG-15\",\n        \"signal\": \"Messages expire after 30 days in the messages table\",\n        \"evidence\": \"service/config/sample.yml: dynamoDbTables.messages.expiration P30D\",\n        \"implies\": \"Server-side storage is transient and cannot serve as a record-keeping archive\"\n      },\n      {\n        \"id\": \"SIG-16\",\n        \"signal\": \"Cryptography export classification ECCN 5D002\",\n        \"evidence\": \"README.md: Cryptography Notice\",\n        \"implies\": \"Export-control review before deploying in each country\"\n      }\n    ]\n  },\n  \"scenario\": {\n    \"summary\": \"A regulated broker-dealer wants a sanctioned secure messenger for employees to replace off-channel use of consumer apps. It will self-host the open-source Signal stack on AWS, keep end-to-end encryption, and still capture every business communication for record-keeping and supervision.\",\n    \"assumptions\": [\n      \"25,000 employees with up to three linked devices each (about 60,000 devices)\",\n      \"Peak 20,000 concurrent WebSocket connections and 2 million messages per day\",\n      \"Attachments up to 100 MB\",\n      \"Closed user group: only employees can register; no federation with the public Signal network\",\n      \"All devices are enrolled in the firm's mobile device management\"\n    ],\n    \"out_of_scope\": [\n      \"Consumer payments, donations and subscription billing\",\n      \"Interoperability with the public Signal service\",\n      \"Voice recording for roles subject to call-taping rules (calling is disabled for those roles)\"\n    ]\n  },\n  \"functional_requirements\": [\n    {\n      \"id\": \"FR-01\",\n      \"statement\": \"End-to-end encrypted 1:1 and group messaging across phones, tablets and desktops, including linked devices\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-02\",\n      \"statement\": \"1:1 and group voice and video calls with relay support for restrictive networks\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-03\",\n      \"statement\": \"Attachments up to 100 MB with resumable uploads\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-04\",\n      \"statement\": \"Only active employees can register, using their corporate identity; leavers lose access within 15 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-05\",\n      \"statement\": \"Capture every message, edit, deletion, attachment and call record of in-scope employees into the firm's archive\",\n      \"source\": \"regulation\"\n    },\n    {\n      \"id\": \"FR-06\",\n      \"statement\": \"Compliance reviewers can search, review and export captured communications, and place legal holds\",\n      \"source\": \"regulation\"\n    },\n    {\n      \"id\": \"FR-07\",\n      \"statement\": \"Employees find colleagues through the firm directory\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-08\",\n      \"statement\": \"Users can verify each other's identity keys (safety numbers backed by key transparency)\",\n      \"source\": \"detected\"\n    }\n  ],\n  \"non_functional_requirements\": [\n    {\n      \"id\": \"NFR-SEC-01\",\n      \"category\": \"security\",\n      \"statement\": \"Message content stays end-to-end encrypted; servers never handle plaintext\",\n      \"target\": \"Zero plaintext message content in the production account\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-02\",\n      \"category\": \"security\",\n      \"statement\": \"All data at rest is encrypted with customer-managed keys; archive keys are controlled only by the compliance function\",\n      \"target\": \"100% of stores use KMS customer-managed keys; archive key in a separate account\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-03\",\n      \"category\": \"security\",\n      \"statement\": \"Only MDM-managed, attested devices can register and connect\",\n      \"target\": \"Device attestation on every registration\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-04\",\n      \"category\": \"security\",\n      \"statement\": \"Administrative access through SSO with MFA and no standing shell access\",\n      \"target\": \"No SSH keys; Session Manager only; break-glass access audited\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-01\",\n      \"category\": \"compliance\",\n      \"statement\": \"Retain business communications, the first two years in an easily accessible place\",\n      \"target\": \"At least 3 years (regulatory minimum); firm policy 7 years\",\n      \"source\": \"regulation\",\n      \"reference\": \"SEC Rule 17a-4(b)(4)\"\n    },\n    {\n      \"id\": \"NFR-CMP-02\",\n      \"category\": \"compliance\",\n      \"statement\": \"Records are preserved in a non-rewriteable, non-erasable form\",\n      \"target\": \"WORM storage in compliance mode; deletions impossible before retention ends\",\n      \"source\": \"regulation\",\n      \"reference\": \"SEC Rule 17a-4(f); FINRA Rule 4511\"\n    },\n    {\n      \"id\": \"NFR-CMP-03\",\n      \"category\": \"compliance\",\n      \"statement\": \"Captured communications are available to supervisory review and surveillance\",\n      \"target\": \"Delivered to the surveillance platform within 15 minutes of capture\",\n      \"source\": \"regulation\",\n      \"reference\": \"FINRA Rule 3110\"\n    },\n    {\n      \"id\": \"NFR-CMP-04\",\n      \"category\": \"compliance\",\n      \"statement\": \"Disappearing messages and deletions must not defeat capture\",\n      \"target\": \"Capture happens before any client-side expiry\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-05\",\n      \"category\": \"compliance\",\n      \"statement\": \"Encryption export-control review for every country of operation\",\n      \"target\": \"Legal sign-off per country before rollout\",\n      \"source\": \"org-policy\",\n      \"reference\": \"ECCN 5D002\"\n    },\n    {\n      \"id\": \"NFR-AVL-01\",\n      \"category\": \"availability\",\n      \"statement\": \"Messaging remains available through the loss of one availability zone\",\n      \"target\": \"99.95% monthly availability\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-DR-01\",\n      \"category\": \"disaster-recovery\",\n      \"statement\": \"Recover messaging in a second region after a regional outage\",\n      \"target\": \"RPO 5 minutes for accounts and keys; RTO 1 hour\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-01\",\n      \"category\": \"performance\",\n      \"statement\": \"Fast delivery to online recipients within the region\",\n      \"target\": \"p99 under 1 second from server acknowledgement to recipient device\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-SCL-01\",\n      \"category\": \"scalability\",\n      \"statement\": \"Handle peak load with headroom\",\n      \"target\": \"20,000 concurrent connections and 2 million messages per day, with 3x headroom\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-OPS-01\",\n      \"category\": \"operations\",\n      \"statement\": \"Central logs, metrics and traces with no message content, keys or phone numbers in telemetry\",\n      \"target\": \"Automated log scrubbing checks in CI\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-NET-01\",\n      \"category\": \"networking\",\n      \"statement\": \"Outbound traffic only to approved destinations\",\n      \"target\": \"Egress allowlist: APNs, FCM, corporate IdP\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-DAT-01\",\n      \"category\": \"data\",\n      \"statement\": \"Message content stays in the firm's AWS accounts, except for exports to the approved surveillance platform\",\n      \"target\": \"Exports only over private connectivity; no other third party receives message content\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CST-01\",\n      \"category\": \"cost\",\n      \"statement\": \"Cost is visible per component and per environment\",\n      \"target\": \"100% of resources tagged; monthly cost report per tier\",\n      \"source\": \"org-policy\"\n    }\n  ],\n  \"policy_conflicts\": [\n    {\n      \"id\": \"CON-01\",\n      \"between\": [\n        \"NFR-SEC-01\",\n        \"FR-05\",\n        \"NFR-CMP-01\"\n      ],\n      \"summary\": \"End-to-end encryption means the servers cannot read messages, yet every business communication must be captured and retained.\",\n      \"proposed_resolution\": \"Capture at the endpoint: a firm-managed client build journals each sent and received message, encrypted to the archive's public key, into an isolated compliance account. Plaintext exists only on devices and inside the archive's controlled decryption step.\",\n      \"needs_exception\": true\n    },\n    {\n      \"id\": \"CON-02\",\n      \"between\": [\n        \"SIG-15\",\n        \"NFR-CMP-04\"\n      ],\n      \"summary\": \"Signal supports disappearing messages and server-side expiry, which conflicts with retention.\",\n      \"proposed_resolution\": \"Disable disappearing messages through managed-client policy; journal messages at send and receive time.\",\n      \"needs_exception\": false\n    },\n    {\n      \"id\": \"CON-03\",\n      \"between\": [\n        \"SIG-08\",\n        \"NFR-DAT-01\"\n      ],\n      \"summary\": \"Upstream contact discovery and secure value recovery depend on Intel SGX enclaves, which AWS does not offer.\",\n      \"proposed_resolution\": \"Replace contact discovery with the firm directory (the user group is closed and the directory is known) and disable PIN-based recovery; managed devices are re-provisioned instead.\",\n      \"needs_exception\": false\n    },\n    {\n      \"id\": \"CON-04\",\n      \"between\": [\n        \"SIG-09\",\n        \"NFR-DAT-01\"\n      ],\n      \"summary\": \"The storage service persists to Google Cloud Bigtable, which would put group and sync data with a second cloud provider.\",\n      \"proposed_resolution\": \"Port the storage layer to DynamoDB.\",\n      \"needs_exception\": false\n    }\n  ],\n  \"open_questions\": [\n    {\n      \"id\": \"Q-01\",\n      \"question\": \"Which surveillance and e-discovery platform receives the export, and in which format?\",\n      \"owner\": \"Compliance\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-02\",\n      \"question\": \"Which roles are subject to call-recording rules and must have calling disabled?\",\n      \"owner\": \"Compliance\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-03\",\n      \"question\": \"Is the firm prepared to maintain modified forks of the AGPL-licensed server components and offer their source to users?\",\n      \"owner\": \"Legal / Engineering\",\n      \"blocking\": false\n    }\n  ],\n  \"scoring\": {\n    \"rubric\": \"Mean of 12 parts: ten NFR categories (1 = numeric target, 0.5 = requirement without one, 0 = none), functional coverage, and conflict resolution; minus 0.05 per blocking open question. See ../README.md.\",\n    \"threshold\": 0.85,\n    \"completeness\": 0.875,\n    \"status\": \"ready-for-design\",\n    \"by_dimension\": {\n      \"security\": 1.0,\n      \"compliance\": 1.0,\n      \"availability\": 1.0,\n      \"disaster-recovery\": 1.0,\n      \"performance\": 1.0,\n      \"scalability\": 1.0,\n      \"operations\": 0.5,\n      \"networking\": 0.5,\n      \"data\": 0.5,\n      \"cost\": 1.0,\n      \"functional\": 1.0,\n      \"conflicts-resolved\": 1.0\n    },\n    \"gaps\": [\n      \"operations: no measurable target\",\n      \"networking: no measurable target\",\n      \"data: no measurable target\"\n    ]\n  }\n}", "yaml": "diagram:\n  name: Signal Secure Messaging on AWS\n  direction: left-to-right\n  format: png\n  open: true\n  style:\n    graph:\n      splines: ortho\n      nodesep: 0.7\n      ranksep: 1.3\n      fontsize: 24\n  resources:\n    # People and services outside the firm's AWS accounts\n    - id: employees\n      name: Employee devices (MDM-managed)\n      type: aws.general.Users\n      relates:\n        - to: route53\n          direction: outgoing\n        - to: attachments_cdn\n          direction: outgoing\n          label: Attachment download\n        - to: calls_nlb\n          direction: outgoing\n          label: Group calls (UDP)\n        - to: turn\n          direction: outgoing\n          label: 1:1 call relay\n        - to: capture_api\n          direction: outgoing\n          label: Compliance journal (encrypted)\n\n    - id: idp\n      name: Corporate IdP (SSO + SCIM)\n      type: aws.security.SingleSignOn\n      relates:\n        - to: registration\n          direction: incoming\n          label: Verify employee (OIDC)\n        - to: directory\n          direction: outgoing\n          label: SCIM sync\n\n    - id: push_providers\n      name: Push providers\n      type: cluster\n      of:\n        - id: apns\n          name: Apple APNs\n          type: generic.os.IOS\n        - id: fcm\n          name: Google FCM\n          type: generic.os.Android\n\n    - id: surveillance\n      name: Approved surveillance & e-discovery platform\n      type: aws.general.TraditionalServer\n\n    # Primary region: production workload account\n    - id: region_primary\n      name: AWS Region A - primary (3 AZs)\n      type: cluster\n      of:\n        - id: edge\n          name: Edge\n          type: cluster\n          of:\n            - id: route53\n              name: Route 53 (failover routing)\n              type: aws.network.Route53\n              relates:\n                - to: chat_waf\n                  direction: outgoing\n                - to: dr_eks\n                  direction: outgoing\n                  label: Regional failover\n                  style: dashed\n            - id: chat_waf\n              name: AWS WAF + Shield Advanced\n              type: aws.security.WAF\n              relates:\n                - to: chat_alb\n                  direction: outgoing\n            - id: chat_alb\n              name: Chat ALB (WebSocket, TLS 1.3)\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: chat\n                  direction: outgoing\n                  label: WebSocket + gRPC\n                - to: registration\n                  direction: outgoing\n                - to: directory\n                  direction: outgoing\n                - to: storage_service\n                  direction: outgoing\n                - to: key_transparency\n                  direction: outgoing\n                - to: upload\n                  direction: outgoing\n                  label: Uploads (tus)\n            - id: attachments_cdn\n              name: CloudFront (signed URLs)\n              type: aws.network.CloudFront\n              relates:\n                - to: attachments\n                  direction: outgoing\n                  label: Origin access control\n            - id: calls_nlb\n              name: NLB (UDP) for calls\n              type: aws.network.ElbNetworkLoadBalancer\n              relates:\n                - to: sfu\n                  direction: outgoing\n\n        - id: eks\n          name: Amazon EKS - private subnets\n          type: cluster\n          of:\n            - id: chat\n              name: Chat service x N (Signal-Server)\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Accounts, keys, profiles\n                - to: redis\n                  direction: outgoing\n                  label: Presence, pub/sub, rate limits\n                - to: foundationdb\n                  direction: outgoing\n                  label: Message queues\n                - to: config_bucket\n                  direction: outgoing\n                  label: Prekeys, dynamic config\n                - to: egress\n                  direction: outgoing\n                  label: Push wake-ups\n                - to: telemetry\n                  direction: outgoing\n                  label: OpenTelemetry (no content)\n            - id: registration\n              name: Registration service (SSO-gated)\n              type: k8s.compute.Deployment\n            - id: directory\n              name: Firm directory service\n              type: k8s.compute.Deployment\n            - id: storage_service\n              name: Storage service (groups, encrypted sync)\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Ported from Bigtable\n            - id: key_transparency\n              name: Key transparency service\n              type: k8s.compute.Deployment\n              relates:\n                - to: dynamodb\n                  direction: outgoing\n                  label: Transparency log\n            - id: upload\n              name: Attachment upload service (tus)\n              type: k8s.compute.Deployment\n              relates:\n                - to: attachments\n                  direction: outgoing\n                  label: Encrypted blobs\n\n        - id: calling\n          name: Calling - public subnets\n          type: cluster\n          of:\n            - id: sfu\n              name: Group-call SFU (Signal-Calling-Service)\n              type: aws.compute.EC2Instances\n            - id: turn\n              name: TURN relays (Elastic IPs)\n              type: aws.compute.EC2\n\n        - id: data\n          name: Data - private subnets\n          type: cluster\n          of:\n            - id: dynamodb\n              name: DynamoDB (on-demand, PITR)\n              type: aws.database.Dynamodb\n              relates:\n                - to: dr_dynamodb\n                  direction: outgoing\n                  label: Global tables\n            - id: redis\n              name: ElastiCache for Redis (5 clusters)\n              type: aws.database.ElastiCache\n            - id: foundationdb\n              name: FoundationDB message store (EC2 i4i, 3 AZs)\n              type: aws.compute.EC2Instances\n              relates:\n                - to: dr_foundationdb\n                  direction: outgoing\n                  label: Async DR\n            - id: attachments\n              name: S3 attachments (SSE-KMS)\n              type: aws.storage.SimpleStorageServiceS3Bucket\n              relates:\n                - to: dr_s3\n                  direction: outgoing\n                  label: Cross-region replication\n            - id: config_bucket\n              name: S3 prekeys & dynamic config\n              type: aws.storage.SimpleStorageServiceS3Bucket\n\n        - id: operations\n          name: Security & operations\n          type: cluster\n          of:\n            - id: kms\n              name: KMS keys + Secrets Manager\n              type: aws.security.KMS\n            - id: telemetry\n              name: CloudWatch, X-Ray, CloudTrail, GuardDuty\n              type: aws.management.Cloudwatch\n\n        - id: egress\n          name: Egress - Network Firewall allowlist + NAT\n          type: aws.network.NATGateway\n          relates:\n            - to: apns\n              direction: outgoing\n            - to: fcm\n              direction: outgoing\n\n    # Separate AWS account: compliance capture and books-and-records archive\n    - id: compliance_account\n      name: Compliance account (isolated)\n      type: cluster\n      of:\n        - id: capture_api\n          name: Capture API (mTLS)\n          type: aws.network.APIGateway\n          relates:\n            - to: capture_queue\n              direction: outgoing\n        - id: capture_queue\n          name: Capture queue (SQS FIFO)\n          type: aws.integration.SQS\n          relates:\n            - to: archiver\n              direction: outgoing\n        - id: archiver\n          name: Archive processor (Lambda)\n          type: aws.compute.Lambda\n          relates:\n            - to: worm_archive\n              direction: outgoing\n              label: Write once\n            - to: archive_key\n              direction: outgoing\n              label: Decrypt (isolated role only)\n            - to: surveillance\n              direction: outgoing\n              label: Export (EML)\n        - id: worm_archive\n          name: WORM archive (S3 Object Lock, 7 years)\n          type: aws.storage.SimpleStorageServiceS3BucketWithObjects\n          relates:\n            - to: dr_s3\n              direction: outgoing\n              label: Object Lock replication\n        - id: archive_key\n          name: Archive key (KMS custom key store on CloudHSM)\n          type: aws.security.CloudHSM\n\n    # Second region: warm standby\n    - id: region_dr\n      name: AWS Region B - warm standby\n      type: cluster\n      of:\n        - id: dr_eks\n          name: EKS (scaled down)\n          type: aws.compute.EKS\n        - id: dr_dynamodb\n          name: DynamoDB replica\n          type: aws.database.Dynamodb\n        - id: dr_foundationdb\n          name: FoundationDB DR cluster\n          type: aws.compute.EC2Instances\n        - id: dr_s3\n          name: S3 replicas (attachments, WORM archive)\n          type: aws.storage.S3", "summaryHtml": "<h2>Overview<\/h2>\n<p>A regulated broker-dealer wants a sanctioned secure messenger for its 25,000 employees, so that business conversations stop moving to consumer apps that compliance cannot see. This design self-hosts the open-source Signal stack on AWS as a closed, firm-only service. It keeps Signal's end-to-end encryption and adds what a regulated firm needs on top: identity tied to the corporate directory, capture of every business communication into a write-once archive, and a warm standby region.<\/p>\n<p>The central tension is that end-to-end encryption and record-keeping pull in opposite directions. The servers never see plaintext, so the firm cannot capture messages on the server. The design resolves this at the endpoint and isolates everything that can decrypt the archive in a separate AWS account.<\/p>\n<h2>Scope and assumptions<\/h2>\n<ul>\n<li>25,000 employees, up to three linked devices each; peak 20,000 concurrent connections; 2 million messages per day.<\/li>\n<li>Closed user group: only employees register, and the service does not federate with the public Signal network.<\/li>\n<li>Every device is enrolled in the firm's mobile device management.<\/li>\n<li>Consumer payments, donations and billing are out of scope. So is call recording, so calling is disabled for roles subject to call-taping rules.<\/li>\n<\/ul>\n<h2>Architecture at a glance<\/h2>\n<ul>\n<li><strong>Edge:<\/strong> Route 53 failover records; an Application Load Balancer for WebSocket and gRPC traffic behind AWS WAF and Shield Advanced; CloudFront for attachment downloads; a UDP Network Load Balancer for group calls.<\/li>\n<li><strong>Services (Amazon EKS, private subnets, three AZs):<\/strong> chat (Signal-Server), registration, storage, key transparency, the firm directory and the attachment upload (tus) service.<\/li>\n<li><strong>Calling:<\/strong> the group-call SFU (Signal-Calling-Service) and TURN relays on EC2 in public subnets.<\/li>\n<li><strong>Data:<\/strong> DynamoDB (34 tables), ElastiCache for Redis (five endpoints), FoundationDB on EC2 for message queues, and S3 for attachments, prekeys and dynamic configuration.<\/li>\n<li><strong>Compliance account:<\/strong> capture API, SQS FIFO buffer, archive processor, S3 Object Lock archive and a CloudHSM-backed archive key.<\/li>\n<li><strong>Region B:<\/strong> warm standby with DynamoDB global tables, FoundationDB DR, replicated S3 buckets and a scaled-down EKS cluster.<\/li>\n<\/ul>\n<h2>Key decisions<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Decision<\/th>\n<th>Satisfies<\/th>\n<th>Grounded in<\/th>\n<th>Alternatives considered<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D1<\/td>\n<td>Run the open-source stack as a closed deployment on Amazon EKS across three AZs<\/td>\n<td>FR-01, FR-04, NFR-AVL-01<\/td>\n<td>SIG-01; component inventory<\/td>\n<td>ECS on Fargate is viable. EKS runs seven services and their autoscaling on one platform.<\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>Capture at the endpoint: a firm-managed client journals each sent and received message, encrypted to the archive key, into an isolated compliance account. Records land in S3 Object Lock (compliance mode, 7 years). Only the archive processor's role can use the CloudHSM-backed key.<\/td>\n<td>FR-05, FR-06, NFR-CMP-01 to 04, NFR-SEC-02<\/td>\n<td>CON-01; SEC Rule 17a-4<\/td>\n<td>Server-side capture is impossible with end-to-end encryption. A third-party archiving fork of Signal was rejected: in 2025 one such product was breached and its archive server held plaintext copies.<\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>Replace SGX-based contact discovery with a firm directory service fed by SCIM, and disable PIN-based secure value recovery<\/td>\n<td>FR-07, NFR-DAT-01<\/td>\n<td>SIG-08, CON-03<\/td>\n<td>Port the enclave services to AWS Nitro Enclaves. This takes significant effort; revisit if the user group opens up.<\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>Port the storage service from Google Cloud Bigtable to DynamoDB<\/td>\n<td>NFR-DAT-01<\/td>\n<td>SIG-09, CON-04<\/td>\n<td>Keep Bigtable over a cross-cloud link. That adds a second provider and a data-residency review.<\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>DynamoDB on demand with point-in-time recovery for accounts, keys and profiles; global tables to Region B<\/td>\n<td>NFR-DR-01, NFR-SCL-01<\/td>\n<td>SIG-02<\/td>\n<td>Aurora PostgreSQL would mean rewriting the data layer.<\/td>\n<\/tr>\n<tr>\n<td>D6<\/td>\n<td>FoundationDB on EC2 i4i instances (local NVMe) across three AZs in triple-redundancy mode, with asynchronous DR replication to Region B<\/td>\n<td>NFR-AVL-01, NFR-DR-01<\/td>\n<td>SIG-04<\/td>\n<td>The DynamoDB <code>messages<\/code> table that still appears in the config. The current server build requires FoundationDB.<\/td>\n<\/tr>\n<tr>\n<td>D7<\/td>\n<td>ElastiCache for Redis OSS, Multi-AZ: four cluster-mode groups plus one non-clustered group for pub/sub, matching upstream<\/td>\n<td>NFR-PRF-01, NFR-AVL-01<\/td>\n<td>SIG-03, SIG-05<\/td>\n<td>One shared cluster: fewer nodes, but a larger blast radius and noisy neighbours.<\/td>\n<\/tr>\n<tr>\n<td>D8<\/td>\n<td>The tus upload service writes client-encrypted blobs to S3 (SSE-KMS). Downloads go through CloudFront signed URLs with origin access control. Buckets replicate to Region B.<\/td>\n<td>FR-03, NFR-DR-01<\/td>\n<td>SIG-06<\/td>\n<td>Upstream's GCS and Cloudflare R2 backends would add a second provider.<\/td>\n<\/tr>\n<tr>\n<td>D9<\/td>\n<td>Route 53 failover; an ALB for WebSocket and gRPC behind WAF and Shield Advanced; a UDP NLB for the SFU; TURN relays on EC2 with Elastic IPs<\/td>\n<td>FR-02, NFR-AVL-01<\/td>\n<td>SIG-01, SIG-11<\/td>\n<td>Cloudflare TURN as upstream, which puts a third party in the media path.<\/td>\n<\/tr>\n<tr>\n<td>D10<\/td>\n<td>Remove consumer monetisation: Stripe, Braintree, app-store billing, MobileCoin and donations are not deployed<\/td>\n<td>NFR-DAT-01<\/td>\n<td>SIG-10<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>D11<\/td>\n<td>Egress only through AWS Network Firewall with a domain allowlist (APNs, FCM, the IdP); VPC endpoints for AWS services<\/td>\n<td>NFR-NET-01<\/td>\n<td>SIG-07<\/td>\n<td>Open NAT egress<\/td>\n<\/tr>\n<tr>\n<td>D12<\/td>\n<td>Registration gated by corporate SSO (OIDC), with SCIM-driven deprovisioning within 15 minutes<\/td>\n<td>FR-04, NFR-SEC-03<\/td>\n<td>Registration service in the component inventory<\/td>\n<td>SMS-only verification as upstream<\/td>\n<\/tr>\n<tr>\n<td>D13<\/td>\n<td>Warm standby in Region B with Route 53 failover<\/td>\n<td>NFR-DR-01<\/td>\n<td>NFR-DR-01 targets<\/td>\n<td>Active-active. FoundationDB queues and the Redis message cache make multi-writer complex.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>How a message flows<\/h2>\n<ol>\n<li>A device resolves the service through Route 53 and holds a WebSocket open to the chat service through WAF and the ALB.<\/li>\n<li>The sender's client encrypts the message with the Signal protocol and sends it. The chat service queues it for each recipient device in the Redis message cache, which persists to FoundationDB after one minute.<\/li>\n<li>Online recipients get it immediately over their WebSocket via Redis pub/sub. Offline devices get an APNs or FCM wake-up through the egress firewall and fetch the message when they reconnect.<\/li>\n<li>Attachments are encrypted on the device, uploaded through the tus service to S3 and downloaded through CloudFront.<\/li>\n<li>The managed client also journals the message, encrypted to the archive key, to the capture API in the compliance account. SQS FIFO buffers it and the archive processor writes the original to the WORM archive. Inside the isolated account it then decrypts a copy and exports it to the approved surveillance platform. People can reach raw archive content only with two-person approval.<\/li>\n<\/ol>\n<h2>Well-Architected review<\/h2>\n<ul>\n<li><strong>Security:<\/strong> end-to-end encryption is preserved. Customer-managed KMS keys everywhere; the archive key sits in a separate account with a CloudHSM key store. Least-privilege pod roles, no SSH, an egress allowlist, and WAF with Shield Advanced at the edge.<\/li>\n<li><strong>Reliability:<\/strong> every tier spans three AZs, including the Redis message cache (messages persist only after a minute). Warm standby in Region B meets RPO 5 minutes and RTO 1 hour.<\/li>\n<li><strong>Performance efficiency:<\/strong> Redis pub/sub fans messages out to open WebSockets, FoundationDB absorbs queue writes, and CloudFront serves attachments close to users.<\/li>\n<li><strong>Cost optimisation:<\/strong> DynamoDB on demand, Graviton node groups, a scaled-down standby region, and no consumer billing or payment services.<\/li>\n<li><strong>Operational excellence:<\/strong> OpenTelemetry to CloudWatch and X-Ray with log scrubbing tested in CI; everything defined as code; upstream releases tracked monthly.<\/li>\n<li><strong>Sustainability:<\/strong> Graviton instances and demand-based scaling in the standby region.<\/li>\n<\/ul>\n<h2>Policy check and exceptions requested<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Request<\/th>\n<th>Why<\/th>\n<th>Compensating controls<\/th>\n<th>Approvers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EXC-01<\/td>\n<td>Run a modified, firm-managed client that journals messages for the archive<\/td>\n<td>End-to-end encryption prevents server-side capture (CON-01)<\/td>\n<td>Separate compliance account; archive key usable only by the archive processor; two-person approval for human access; no plaintext stored outside the isolated account; annual penetration test of the client and archive<\/td>\n<td>CISO, Chief Compliance Officer<\/td>\n<\/tr>\n<tr>\n<td>EXC-02<\/td>\n<td>Operate self-managed FoundationDB<\/td>\n<td>No managed equivalent on AWS, and the current server requires it<\/td>\n<td>Triple redundancy across three AZs, continuous backup to S3, DR cluster, runbooks and on-call cover<\/td>\n<td>Platform engineering lead, CCoE<\/td>\n<\/tr>\n<tr>\n<td>EXC-03<\/td>\n<td>Maintain forks of AGPL-licensed components (client journaling, SSO registration, DynamoDB storage)<\/td>\n<td>Needed for D2, D4 and D12<\/td>\n<td>Offer modified source to users as AGPL section 13 requires; merge upstream security fixes within 7 days<\/td>\n<td>Legal, open-source program office<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Risks and open items<\/h2>\n<ul>\n<li>A compromised device exposes plaintext; this is inherent to end-to-end encryption. Device management and attestation reduce the risk but do not remove it.<\/li>\n<li>Fork maintenance: the client and three server components diverge from upstream, so security fixes must be merged quickly (EXC-03).<\/li>\n<li>FoundationDB and the Bigtable-to-DynamoDB port need specialist skills and are the largest engineering items.<\/li>\n<li>Open questions: the surveillance platform and export format (Q-01), roles that must have calling disabled (Q-02), and AGPL obligations (Q-03).<\/li>\n<li>An encryption export-control review is needed in each country of operation (NFR-CMP-05).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>Signal-Server at commit <code>a15d5cdbb937<\/code>: <a href=\"https://github.com/signalapp/Signal-Server/blob/main/service/config/sample.yml\" target=\"_blank\" rel=\"noopener\">service/config/sample.yml<\/a>, <a href=\"https://github.com/signalapp/Signal-Server\" target=\"_blank\" rel=\"noopener\">README<\/a><\/li>\n<li>Companion services: <a href=\"https://github.com/signalapp/registration-service\" target=\"_blank\" rel=\"noopener\">registration-service<\/a>, <a href=\"https://github.com/signalapp/storage-service\" target=\"_blank\" rel=\"noopener\">storage-service<\/a>, <a href=\"https://github.com/signalapp/key-transparency-server\" target=\"_blank\" rel=\"noopener\">key-transparency-server<\/a>, <a href=\"https://github.com/signalapp/Signal-Calling-Service\" target=\"_blank\" rel=\"noopener\">Signal-Calling-Service<\/a>, <a href=\"https://github.com/signalapp/ContactDiscoveryService-Icelake\" target=\"_blank\" rel=\"noopener\">ContactDiscoveryService-Icelake<\/a>, <a href=\"https://github.com/signalapp/SecureValueRecovery2\" target=\"_blank\" rel=\"noopener\">SecureValueRecovery2<\/a><\/li>\n<li><a href=\"https://www.ecfr.gov/current/title-17/section-240.17a-4\" target=\"_blank\" rel=\"noopener\">SEC Rule 17a-4<\/a>, <a href=\"https://www.finra.org/rules-guidance/rulebooks/finra-rules/3110\" target=\"_blank\" rel=\"noopener\">FINRA Rule 3110<\/a>, <a href=\"https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511\" target=\"_blank\" rel=\"noopener\">FINRA Rule 4511<\/a><\/li>\n<li><a href=\"https://techcrunch.com/2025/05/05/telemessage-a-modified-signal-clone-used-by-us-government-officials-has-been-hacked/\" target=\"_blank\" rel=\"noopener\">TechCrunch: TeleMessage, a modified Signal clone used by US government officials, has been hacked (May 2025)<\/a><\/li>\n<\/ul>\n", "png": "samples/signal_secure_messaging_on_aws/signal_secure_messaging_on_aws.png", "stats": {"signals": 16, "frs": 8, "nfrs": 17, "conflicts": 4, "completeness": 0.875, "threshold": 0.85, "decisions": 13, "nodes": 35, "clusters": 9}}, {"short": "Sentry", "title": "Sentry observability platform on AWS", "source": "getsentry/self-hosted @ d09ff0c", "sourceUrl": "https://github.com/getsentry/self-hosted/tree/d09ff0cd592f709828a84e7c46b7e7ff17e623f3", "alt": "Architecture diagram: SDK traffic enters through AWS WAF and a public load balancer, or through PrivateLink, to the Relay fleet. Events flow through Amazon MSK to processing consumers on EKS and land in ClickHouse, Aurora PostgreSQL, ElastiCache and S3. Backups are copied to a second EU region.", "folder": "samples/sentry_observability_platform_on_aws", "linkFiles": true, "files": {"req": "requirements.json", "sum": "architecture_summary.md", "yaml": "sentry_observability_platform_on_aws.yaml", "diag": "sentry_observability_platform_on_aws.png"}, "req": "{\n  \"$schema\": \"cdp/requirements/v0\",\n  \"document\": {\n    \"id\": \"REQ-SENTRY-001\",\n    \"title\": \"Self-hosted Sentry at enterprise scale\",\n    \"version\": \"1.0\",\n    \"status\": \"ready-for-design\",\n    \"created\": \"2026-10-08\",\n    \"produced_by\": \"Reference sample written in the Requirements Analyzer format (see ../README.md)\"\n  },\n  \"application\": {\n    \"name\": \"Sentry (self-hosted)\",\n    \"repository\": \"https://github.com/getsentry/self-hosted\",\n    \"commit\": \"d09ff0cd592f\",\n    \"license\": \"FSL-1.1-Apache-2.0\",\n    \"summary\": \"Application monitoring: error tracking, tracing and performance, session replay, profiling, cron and uptime monitoring. The self-hosted package runs the full Sentry stack with Docker Compose and describes itself as 'packaged up for low-volume deployments and proofs-of-concept'.\",\n    \"components\": [\n      {\n        \"name\": \"Relay\",\n        \"repository\": \"getsentry/relay\",\n        \"language\": \"Rust\",\n        \"role\": \"Ingest edge: authenticates SDK traffic, applies quotas and rate limits, scrubs PII, writes to Kafka\"\n      },\n      {\n        \"name\": \"Sentry\",\n        \"repository\": \"getsentry/sentry\",\n        \"language\": \"Python (Django)\",\n        \"role\": \"Web UI and API, ingest consumers, post-processing, alerting, task workers\"\n      },\n      {\n        \"name\": \"Snuba\",\n        \"repository\": \"getsentry/snuba\",\n        \"language\": \"Python / Rust\",\n        \"role\": \"Query service and Kafka consumers in front of ClickHouse\"\n      },\n      {\n        \"name\": \"Symbolicator\",\n        \"repository\": \"getsentry/symbolicator\",\n        \"language\": \"Rust\",\n        \"role\": \"Native and JavaScript symbolication using uploaded debug files\"\n      },\n      {\n        \"name\": \"Vroom\",\n        \"repository\": \"getsentry/vroom\",\n        \"language\": \"Go\",\n        \"role\": \"Profiling storage and queries\"\n      },\n      {\n        \"name\": \"Taskbroker\",\n        \"repository\": \"getsentry/taskbroker\",\n        \"language\": \"Rust\",\n        \"role\": \"Kafka-backed task queue feeding task workers\"\n      },\n      {\n        \"name\": \"Uptime checker\",\n        \"repository\": \"getsentry/uptime-checker\",\n        \"language\": \"Rust\",\n        \"role\": \"Synthetic uptime checks\"\n      }\n    ],\n    \"detected_signals\": [\n      {\n        \"id\": \"SIG-01\",\n        \"signal\": \"53 services in the Compose topology\",\n        \"evidence\": \"docker-compose.yml: services\",\n        \"implies\": \"Container orchestration with per-service scaling\"\n      },\n      {\n        \"id\": \"SIG-02\",\n        \"signal\": \"Kafka is the ingest buffer and event stream, with a 50 MB maximum message size\",\n        \"evidence\": \"sentry/sentry.conf.example.py: DEFAULT_KAFKA_OPTIONS message.max.bytes 50000000; SENTRY_EVENTSTREAM KafkaEventStream\",\n        \"implies\": \"Durable, replicated Kafka; broker limits must accept large messages\"\n      },\n      {\n        \"id\": \"SIG-03\",\n        \"signal\": \"ClickHouse fed by 18 Snuba consumers\",\n        \"evidence\": \"docker-compose.yml: clickhouse, snuba-*-consumer, snuba-replacer, snuba-subscription-consumer-*\",\n        \"implies\": \"Analytical store sized for write-heavy, append-only ingest\"\n      },\n      {\n        \"id\": \"SIG-04\",\n        \"signal\": \"PostgreSQL behind PgBouncer for metadata\",\n        \"evidence\": \"docker-compose.yml: postgres, pgbouncer\",\n        \"implies\": \"Managed PostgreSQL with connection pooling\"\n      },\n      {\n        \"id\": \"SIG-05\",\n        \"signal\": \"Raw event payloads (nodestore) on S3-compatible storage\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_NODESTORE sentry_nodestore_s3.S3PassthroughDjangoNodeStorage (SeaweedFS)\",\n        \"implies\": \"Amazon S3 with lifecycle expiry matching retention\"\n      },\n      {\n        \"id\": \"SIG-06\",\n        \"signal\": \"Files and profiles stored on a filesystem or S3\",\n        \"evidence\": \"sentry/config.example.yml: filestore.backend filesystem; filestore.profiles-backend s3\",\n        \"implies\": \"Shared object storage instead of local disks so services can scale out\"\n      },\n      {\n        \"id\": \"SIG-07\",\n        \"signal\": \"Redis for cache, buffers, quotas, rate limits, TSDB and digests\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_CACHE, SENTRY_BUFFER, SENTRY_QUOTAS, SENTRY_RATELIMITER, SENTRY_TSDB, SENTRY_DIGESTS\",\n        \"implies\": \"Highly available managed Redis\"\n      },\n      {\n        \"id\": \"SIG-08\",\n        \"signal\": \"Memcached as the Django cache\",\n        \"evidence\": \"sentry/sentry.conf.example.py: CACHES memcached:11211\",\n        \"implies\": \"Managed Memcached\"\n      },\n      {\n        \"id\": \"SIG-09\",\n        \"signal\": \"Default event retention of 90 days\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_EVENT_RETENTION_DAYS default 90\",\n        \"implies\": \"Time-based expiry in ClickHouse and S3\"\n      },\n      {\n        \"id\": \"SIG-10\",\n        \"signal\": \"Kafka-backed task system (taskbroker, taskscheduler, taskworker)\",\n        \"evidence\": \"docker-compose.yml: taskbroker, taskscheduler, taskworker\",\n        \"implies\": \"Workers scaled on queue depth; no separate message broker needed\"\n      },\n      {\n        \"id\": \"SIG-11\",\n        \"signal\": \"Symbolication with local caches\",\n        \"evidence\": \"docker-compose.yml: symbolicator; sentry/config.example.yml: dsym.cache-path\",\n        \"implies\": \"Dedicated compute and a shared cache for debug files\"\n      },\n      {\n        \"id\": \"SIG-12\",\n        \"signal\": \"Outbound email over SMTP\",\n        \"evidence\": \"sentry/config.example.yml: mail.host smtp\",\n        \"implies\": \"Amazon SES\"\n      },\n      {\n        \"id\": \"SIG-13\",\n        \"signal\": \"Optional StatsD metrics for self-monitoring\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_STATSD_ADDR\",\n        \"implies\": \"Metrics agent feeding the firm's monitoring\"\n      },\n      {\n        \"id\": \"SIG-14\",\n        \"signal\": \"Single-organisation install\",\n        \"evidence\": \"sentry/sentry.conf.example.py: SENTRY_SINGLE_ORGANIZATION True\",\n        \"implies\": \"One organisation with teams and projects, managed through SSO\"\n      },\n      {\n        \"id\": \"SIG-15\",\n        \"signal\": \"Functional Source License\",\n        \"evidence\": \"LICENSE.md: FSL-1.1-Apache-2.0\",\n        \"implies\": \"Internal use is permitted; offering a competing hosted service is not\"\n      }\n    ]\n  },\n  \"scenario\": {\n    \"summary\": \"A large engineering organisation wants to run Sentry for 2,500 projects inside its own AWS accounts, because error and performance telemetry carries customer data and source context that may not leave the firm's environment.\",\n    \"assumptions\": [\n      \"3,000 engineers and 2,500 projects\",\n      \"5,000 events per second sustained and 25,000 per second during incident storms\",\n      \"About 2 TB per month of attachments, replays and profiles\",\n      \"Telemetry and backups stay in EU regions\"\n    ],\n    \"out_of_scope\": [\n      \"Sentry SaaS features that are not part of the self-hosted distribution\",\n      \"Multi-region active-active operation\"\n    ]\n  },\n  \"functional_requirements\": [\n    {\n      \"id\": \"FR-01\",\n      \"statement\": \"Ingest errors, transactions and spans, session replays, profiles, attachments, cron check-ins and uptime results from every supported SDK\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-02\",\n      \"statement\": \"Group issues, alert teams (email, Slack, PagerDuty) and create Jira tickets\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-03\",\n      \"statement\": \"CI pipelines upload releases, source maps and debug files for symbolication\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-04\",\n      \"statement\": \"Search issues and build dashboards across errors and performance data\",\n      \"source\": \"detected\"\n    },\n    {\n      \"id\": \"FR-05\",\n      \"statement\": \"Engineers sign in through the corporate IdP; teams map to IdP groups\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"FR-06\",\n      \"statement\": \"Workloads in other AWS accounts send events without crossing the internet\",\n      \"source\": \"team-confirmed\"\n    }\n  ],\n  \"non_functional_requirements\": [\n    {\n      \"id\": \"NFR-SCL-01\",\n      \"category\": \"scalability\",\n      \"statement\": \"Absorb incident storms without dropping accepted events\",\n      \"target\": \"5,000 events/s sustained; 25,000 events/s for 30 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-AVL-01\",\n      \"category\": \"availability\",\n      \"statement\": \"Ingest stays up through the loss of one availability zone\",\n      \"target\": \"Ingest 99.95%; UI and API 99.9% monthly\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-DUR-01\",\n      \"category\": \"data\",\n      \"statement\": \"Accepted events are never lost\",\n      \"target\": \"Kafka replication factor 3 with min in-sync replicas 2; producer acks=all\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-01\",\n      \"category\": \"performance\",\n      \"statement\": \"New errors appear as issues quickly\",\n      \"target\": \"p95 under 60 seconds sustained, under 5 minutes during storms\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-PRF-02\",\n      \"category\": \"performance\",\n      \"statement\": \"Issue search is interactive\",\n      \"target\": \"p95 under 2 seconds\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-RET-01\",\n      \"category\": \"data\",\n      \"statement\": \"Telemetry expires automatically\",\n      \"target\": \"Errors 90 days; spans, replays and profiles 30 days\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-01\",\n      \"category\": \"security\",\n      \"statement\": \"Telemetry and backups stay in EU regions, encrypted with customer-managed keys\",\n      \"target\": \"100% of stores use KMS customer-managed keys; 0 non-EU copies\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-02\",\n      \"category\": \"security\",\n      \"statement\": \"PII is scrubbed before anything is stored\",\n      \"target\": \"Default and custom scrubbing rules enforced at Relay for 100% of projects\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-SEC-03\",\n      \"category\": \"security\",\n      \"statement\": \"SSO with MFA for everyone; local accounts only for break-glass\",\n      \"target\": \"At most 2 audited break-glass accounts\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-CMP-01\",\n      \"category\": \"compliance\",\n      \"statement\": \"Licence terms reviewed and the platform logged as an internal tool\",\n      \"target\": \"Legal approval of FSL-1.1 before go-live\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-NET-01\",\n      \"category\": \"networking\",\n      \"statement\": \"Internal SDK traffic stays private; only browser and mobile telemetry uses a public endpoint\",\n      \"target\": \"100% of internal producers on PrivateLink\",\n      \"source\": \"org-policy\"\n    },\n    {\n      \"id\": \"NFR-OPS-01\",\n      \"category\": \"operations\",\n      \"statement\": \"Kafka consumer lag drives alerting and autoscaling\",\n      \"target\": \"Alert when any consumer group lags more than 5 minutes\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-CST-01\",\n      \"category\": \"cost\",\n      \"statement\": \"Storage cost is controlled with tiering and expiry\",\n      \"target\": \"ClickHouse data older than 7 days moves to S3; cost per million events reported monthly\",\n      \"source\": \"team-confirmed\"\n    },\n    {\n      \"id\": \"NFR-DR-01\",\n      \"category\": \"disaster-recovery\",\n      \"statement\": \"Recover from regional loss using backups held in another EU region\",\n      \"target\": \"RPO 15 minutes for metadata, 24 hours for analytics; RTO 4 hours\",\n      \"source\": \"team-confirmed\"\n    }\n  ],\n  \"policy_conflicts\": [\n    {\n      \"id\": \"CON-01\",\n      \"between\": [\n        \"SIG-03\",\n        \"org policy: prefer managed data services\"\n      ],\n      \"summary\": \"ClickHouse has no AWS-managed equivalent inside the firm's accounts, and the hosted ClickHouse service would move telemetry out of them.\",\n      \"proposed_resolution\": \"Self-manage ClickHouse on EKS with the Altinity operator, S3 tiered storage and automated backups.\",\n      \"needs_exception\": true\n    },\n    {\n      \"id\": \"CON-02\",\n      \"between\": [\n        \"FR-01\",\n        \"NFR-NET-01\"\n      ],\n      \"summary\": \"Browser and mobile SDKs must reach an internet-facing endpoint, while firm policy discourages public data endpoints.\",\n      \"proposed_resolution\": \"Internet-facing ingest only for Relay, behind AWS WAF with rate limits and per-project DSN keys; all internal traffic over PrivateLink.\",\n      \"needs_exception\": true\n    },\n    {\n      \"id\": \"CON-03\",\n      \"between\": [\n        \"SIG-02\",\n        \"NFR-DUR-01\"\n      ],\n      \"summary\": \"Sentry's producer allows 50 MB messages, which is above common broker defaults.\",\n      \"proposed_resolution\": \"Raise message.max.bytes in the MSK configuration to match, and load-test the largest attachment and replay sizes before go-live.\",\n      \"needs_exception\": false\n    }\n  ],\n  \"open_questions\": [\n    {\n      \"id\": \"Q-01\",\n      \"question\": \"Which teams need session replay, and does replay content need extra masking beyond the SDK defaults?\",\n      \"owner\": \"Privacy office\",\n      \"blocking\": false\n    },\n    {\n      \"id\": \"Q-02\",\n      \"question\": \"Should client-side sample rates be enforced centrally through SDK configuration?\",\n      \"owner\": \"Platform engineering\",\n      \"blocking\": false\n    }\n  ],\n  \"scoring\": {\n    \"rubric\": \"Mean of 12 parts: ten NFR categories (1 = numeric target, 0.5 = requirement without one, 0 = none), functional coverage, and conflict resolution; minus 0.05 per blocking open question. See ../README.md.\",\n    \"threshold\": 0.85,\n    \"completeness\": 1.0,\n    \"status\": \"ready-for-design\",\n    \"by_dimension\": {\n      \"security\": 1.0,\n      \"compliance\": 1.0,\n      \"availability\": 1.0,\n      \"disaster-recovery\": 1.0,\n      \"performance\": 1.0,\n      \"scalability\": 1.0,\n      \"operations\": 1.0,\n      \"networking\": 1.0,\n      \"data\": 1.0,\n      \"cost\": 1.0,\n      \"functional\": 1.0,\n      \"conflicts-resolved\": 1.0\n    },\n    \"gaps\": []\n  }\n}", "yaml": "diagram:\n  name: Sentry Observability Platform on AWS\n  direction: left-to-right\n  format: png\n  open: true\n  style:\n    graph:\n      splines: ortho\n      nodesep: 0.7\n      ranksep: 1.3\n      fontsize: 24\n  resources:\n    # Producers and users outside the platform account\n    - id: public_apps\n      name: Web & mobile apps (Sentry SDKs)\n      type: aws.general.MobileClient\n      relates:\n        - to: public_waf\n          direction: outgoing\n          label: Events (HTTPS)\n\n    - id: internal_workloads\n      name: Internal services (other AWS accounts)\n      type: aws.compute.ECS\n      relates:\n        - to: privatelink\n          direction: outgoing\n          label: Events (private)\n\n    - id: engineers\n      name: Engineers\n      type: aws.general.Users\n      relates:\n        - to: internal_alb\n          direction: outgoing\n          label: UI / API\n\n    - id: ci\n      name: CI pipelines\n      type: aws.devtools.Codepipeline\n      relates:\n        - to: internal_alb\n          direction: outgoing\n          label: Releases, source maps, debug files\n\n    - id: idp\n      name: Corporate IdP (SAML)\n      type: aws.security.SingleSignOn\n      relates:\n        - to: web\n          direction: incoming\n          label: SSO\n\n    - id: alert_targets\n      name: Slack, PagerDuty, Jira\n      type: aws.general.InternetAlt1\n\n    # Single region keeps telemetry in one jurisdiction\n    - id: region_primary\n      name: AWS Region (EU) - 3 AZs\n      type: cluster\n      of:\n        - id: edge\n          name: Edge\n          type: cluster\n          of:\n            - id: public_waf\n              name: AWS WAF (rate limits, bot control)\n              type: aws.security.WAF\n              relates:\n                - to: public_alb\n                  direction: outgoing\n            - id: public_alb\n              name: Public ingest ALB\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: relay\n                  direction: outgoing\n            - id: privatelink\n              name: PrivateLink endpoint service (NLB)\n              type: aws.network.Privatelink\n              relates:\n                - to: relay\n                  direction: outgoing\n            - id: internal_alb\n              name: Internal ALB (UI / API)\n              type: aws.network.ElbApplicationLoadBalancer\n              relates:\n                - to: web\n                  direction: outgoing\n\n        - id: ingest_tier\n          name: Ingest - EKS\n          type: cluster\n          of:\n            - id: relay\n              name: Relay fleet (auth, quotas, PII scrubbing)\n              type: k8s.compute.Deployment\n              relates:\n                - to: msk\n                  direction: outgoing\n                  label: ingest-* topics\n                - to: redis\n                  direction: outgoing\n                  label: Quotas, rate limits\n\n        - id: processing_tier\n          name: Processing - EKS (autoscaled on Kafka lag)\n          type: cluster\n          of:\n            - id: ingest_consumers\n              name: Ingest consumers (errors, transactions, spans, monitors)\n              type: k8s.compute.Deployment\n              relates:\n                - to: nodestore\n                  direction: outgoing\n                  label: Raw event payloads\n                - to: aurora\n                  direction: outgoing\n                  label: Issues, groups\n                - to: symbolicator\n                  direction: outgoing\n                  label: Symbolicate\n            - id: snuba_consumers\n              name: Snuba consumers x18\n              type: k8s.compute.Deployment\n              relates:\n                - to: clickhouse\n                  direction: outgoing\n                  label: Batched inserts\n            - id: post_process\n              name: Post-process forwarders\n              type: k8s.compute.Deployment\n              relates:\n                - to: task_workers\n                  direction: outgoing\n                  label: Alerts, workflows\n            - id: task_workers\n              name: Taskbroker + task workers\n              type: k8s.compute.Deployment\n              relates:\n                - to: ses\n                  direction: outgoing\n                  label: Email\n                - to: egress\n                  direction: outgoing\n                  label: Notifications\n            - id: symbolicator\n              name: Symbolicator\n              type: k8s.compute.Deployment\n              relates:\n                - to: files\n                  direction: outgoing\n                  label: Debug files, cache\n            - id: uptime\n              name: Uptime checker + cron monitors\n              type: k8s.compute.Deployment\n\n        - id: query_tier\n          name: Web & query - EKS\n          type: cluster\n          of:\n            - id: web\n              name: Sentry web + API\n              type: k8s.compute.Deployment\n              relates:\n                - to: aurora\n                  direction: outgoing\n                - to: snuba_api\n                  direction: outgoing\n                  label: Search, dashboards\n                - to: memcached\n                  direction: outgoing\n                  label: Page cache\n                - to: files\n                  direction: outgoing\n                  label: Attachments, replays\n                - to: vroom\n                  direction: outgoing\n                  label: Profiles\n            - id: snuba_api\n              name: Snuba API\n              type: k8s.compute.Deployment\n              relates:\n                - to: clickhouse\n                  direction: outgoing\n            - id: vroom\n              name: Vroom (profiling)\n              type: k8s.compute.Deployment\n              relates:\n                - to: files\n                  direction: outgoing\n\n        - id: clickhouse_tier\n          name: ClickHouse - EKS (Altinity operator)\n          type: cluster\n          of:\n            - id: clickhouse\n              name: ClickHouse shards x 2 replicas\n              type: k8s.compute.StatefulSet\n              relates:\n                - to: keeper\n                  direction: outgoing\n                  label: Replication metadata\n                - to: clickhouse_storage\n                  direction: outgoing\n                  label: Cold parts, backups\n            - id: keeper\n              name: ClickHouse Keeper x3\n              type: k8s.compute.StatefulSet\n\n        - id: msk\n          name: Amazon MSK (3 AZs, RF 3)\n          type: aws.analytics.ManagedStreamingForKafka\n          relates:\n            - to: uptime\n              direction: incoming\n              label: Check resul
